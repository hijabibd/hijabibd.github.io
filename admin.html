<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1A473C">
<meta name="robots" content="noindex">
<title>Hijabi DMS · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--p:#1A473C;--p2:#235a4c;--pd:#123329;--ink:#282626;--soft:#F8F3EC;--soft2:#EFE8DC;--mut:#6E6A63;--line:#E6DFD3;--card:#fff;
    --ok:#2E7D5B;--okb:#E4F1EA;--warn:#8A6100;--warnb:#FBF1DA;--bad:#A8322A;--badb:#F8E6E3;--info:#24507A;--infob:#E7EEF6;--r:12px;
    --serif:'Libre Baskerville',Georgia,'Times New Roman',serif;--sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Bengali',Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--soft);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--p)}
  .hidden{display:none!important}
  /* ---------- login ---------- */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--pd),var(--p) 60%,#2f6b5b)}
  .lbox{background:#fff;border-radius:18px;padding:34px 34px 28px;width:min(400px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .lbox h1{font-family:var(--serif);color:var(--p);margin:0 0 4px;font-size:24px}
  .lbox p.sub{color:var(--mut);margin:0 0 22px}
  .lbox label{display:block;font-weight:600;margin:12px 0 6px;font-size:13px}
  .lbox input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
  .lbox input:focus,.fld input:focus,.fld select:focus,.fld textarea:focus,.tb input:focus,.tb select:focus{outline:2px solid rgba(26,71,60,.25);border-color:var(--p)}
  .lbox .err{color:var(--bad);min-height:20px;margin-top:10px;font-size:13px}
  .lbox .foot{margin-top:18px;color:var(--mut);font-size:12px;line-height:1.5}
  /* ---------- shell ---------- */
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  #side{background:var(--pd);color:#e9f1ee;position:sticky;top:0;height:100vh;overflow:auto;padding:16px 10px 30px}
  #side .brand{font-family:var(--serif);font-weight:700;font-size:18px;padding:6px 10px 2px;color:#fff}
  #side .brand small{display:block;font-family:var(--sans);font-weight:500;font-size:11.5px;opacity:.7;letter-spacing:.3px;margin-top:2px}
  #side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;opacity:.55;margin:18px 10px 6px}
  #side a.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#e9f1ee;text-decoration:none;font-weight:500;margin:1px 0}
  #side a.nav:hover{background:rgba(255,255,255,.08)}
  #side a.nav.on{background:rgba(255,255,255,.15);color:#fff;font-weight:700}
  #side a.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}
  #main{min-width:0;display:flex;flex-direction:column}
  #top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px;min-height:58px}
  #top .ttl{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--p);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #top .co{color:var(--mut);font-size:12.5px;text-align:right;line-height:1.3}
  #top .co b{color:var(--ink);font-size:13.5px}
  #top .who{display:flex;align-items:center;gap:10px;border-left:1px solid var(--line);padding-left:14px}
  #top .av{width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
  #top .who div{line-height:1.25;font-size:12.5px}#top .who div b{font-size:13.5px}
  #menuBtn{display:none}
  #view{padding:20px 22px 60px;min-width:0}
  /* ---------- controls ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
  .btn:hover{border-color:#cfc5b4;background:#fdfbf7}
  .btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.pri:hover{background:var(--p2)}
  .btn.danger{color:var(--bad);border-color:#e7c3be}.btn.ok{color:var(--ok);border-color:#bfdccc}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.block{width:100%;justify-content:center;padding:11px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
  .tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:2.5px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--p);border-bottom-color:var(--p)}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 2px rgba(40,38,38,.04)}
  .card h3{margin:0 0 12px;font-family:var(--serif);font-size:15px;color:var(--pd)}
  .muted{color:var(--mut)}
  .chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--infob);color:var(--info)}
  .chip.ok{background:var(--okb);color:var(--ok)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.mut{background:#efede9;color:var(--mut)}
  /* ---------- table ---------- */
  .tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .tb .grow{flex:1}
  .tb input[type=search]{min-width:240px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .tb input,.tb select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .tb label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
  .tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 250px);min-height:120px}
  table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
  table.dt th,table.dt td{padding:8px 10px;border-bottom:1px solid #f0ebe2;text-align:left;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
  table.dt thead th{position:sticky;top:0;background:#faf7f1;z-index:2;font-weight:700;font-size:12px;color:#4a4641;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
  table.dt thead tr.flt th{top:35px;background:#fdfbf7;cursor:default;padding:5px 6px}
  table.dt thead tr.flt input,table.dt thead tr.flt select{width:100%;min-width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff;font-weight:400}
  table.dt th .ar{opacity:.4;margin-left:3px}table.dt th.sorted .ar{opacity:1;color:var(--p)}
  table.dt td.n,table.dt th.n{text-align:right;font-variant-numeric:tabular-nums}
  table.dt tbody tr{cursor:default}table.dt tbody tr.click{cursor:pointer}
  table.dt tbody tr:hover td{background:#fbf8f2}
  table.dt tfoot td{position:sticky;bottom:0;background:#f4efe6;font-weight:700;border-top:1px solid var(--line)}
  table.dt img.thumb{width:30px;height:30px;object-fit:cover;border-radius:6px;vertical-align:middle;background:var(--soft2)}
  .pager{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--mut);font-size:12.5px;flex-wrap:wrap}
  .pager .grow{flex:1}
  .empty{padding:36px;text-align:center;color:var(--mut)}
  .note{background:var(--warnb);color:var(--warn);border-radius:9px;padding:8px 12px;margin-bottom:10px;font-size:12.5px}
  .loading{opacity:.55;pointer-events:none}
  .colpop{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:10px;max-height:360px;overflow:auto;min-width:220px}
  .colpop label{display:flex;gap:8px;padding:4px 2px;font-size:13px;cursor:pointer}
  /* ---------- dashboard ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;transition:transform .08s,box-shadow .08s}
  .kpi:hover{box-shadow:0 6px 18px rgba(26,71,60,.1);transform:translateY(-1px)}
  .kpi .l{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .kpi .v{font-size:24px;font-weight:800;color:var(--pd);margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12px;color:var(--mut)}
  .dgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
  .pend{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
  .pend:last-child{border-bottom:0}.pend:hover{background:#fbf8f2}
  .pend .c{min-width:36px;text-align:center;border-radius:20px;padding:3px 8px;font-weight:800;background:var(--warnb);color:var(--warn)}
  .pend .c.z{background:#efede9;color:#9a958d}
  .stages{display:flex;gap:8px;flex-wrap:wrap}
  .stage{flex:1;min-width:110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fdfbf7}
  .stage b{display:block;font-size:20px;color:var(--pd)}.stage span{font-size:12px;color:var(--mut)}
  .hrrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .hrrow div{background:var(--soft);border-radius:10px;padding:10px 4px}.hrrow b{display:block;font-size:20px;color:var(--pd)}.hrrow span{font-size:11.5px;color:var(--mut)}
  /* ---------- drawer / modal / toast ---------- */
  #shade{position:fixed;inset:0;background:rgba(18,25,22,.35);z-index:80}
  #drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:#fff;z-index:90;box-shadow:-10px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s ease}
  #drawer.open{transform:none}
  #drawer.wide{width:min(940px,100vw)}
  #drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  #drawer .dh h3{margin:0;font-family:var(--serif);font-size:17px;color:var(--p);flex:1}
  #drawer .db{flex:1;overflow:auto;padding:16px 20px}
  #drawer .df{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;background:#fdfbf7}
  #drawer .df .grow{flex:1}
  .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld.full{grid-column:1/-1}
  .fld label{font-size:12px;font-weight:700;color:#4a4641}.fld label em{color:var(--bad);font-style:normal}
  .fld input,.fld select,.fld textarea{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%}
  .fld input[readonly]{background:var(--soft);color:var(--mut)}
  .fld .help{font-size:11.5px;color:var(--mut)}
  .fld.chk{flex-direction:row;align-items:center;gap:8px;padding-top:22px}.fld.chk input{width:auto}
  .ph{display:flex;gap:10px;align-items:center}.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft2)}
  .sect{font-family:var(--serif);font-weight:700;color:var(--pd);margin:18px 0 8px;grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px}
  #modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgba(18,25,22,.45);padding:20px}
  #modal .mb{background:#fff;border-radius:16px;padding:22px 24px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
  #modal h3{margin:0 0 10px;font-family:var(--serif);color:var(--p)}
  #modal .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .pin{font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;background:var(--soft);border-radius:12px;padding:14px;color:var(--pd);font-variant-numeric:tabular-nums;margin:10px 0}
  #toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:420px}
  .toast{background:var(--ink);color:#fff;padding:11px 15px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;line-height:1.4}
  .toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}
  /* ---------- route board ---------- */
  .board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow:auto;padding-bottom:6px}
  .rcol{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
  .rcol h4{margin:0 0 2px;font-size:13px;color:var(--pd)}.rcol .rs{font-size:11.5px;color:var(--mut);margin-bottom:8px}
  .rcol.un{background:#fffaf0;border-style:dashed}
  .area{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 7px;border-radius:8px;background:var(--soft);margin-bottom:5px;font-size:12.5px}
  .area span{flex:1 1 100%;min-width:0;font-weight:600;line-height:1.25}.area b{font-size:11px;color:var(--mut);margin-right:auto}
  .area select{font-size:11px;padding:1px 2px;border:1px solid var(--line);border-radius:6px;max-width:84px;background:#fff}
  .area button{border:0;background:none;cursor:pointer;color:var(--mut);padding:0 2px}
  .rcol .add{display:flex;gap:4px;margin-top:6px}.rcol .add input{flex:1;min-width:0;padding:5px 7px;border:1px solid var(--line);border-radius:7px;font-size:12px}
  /* ---------- reports / settings ---------- */
  .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .rcard h4{margin:0;font-size:14.5px;color:var(--pd)}.rcard p{margin:0;font-size:12.5px;color:var(--mut)}
  .rcard .ps{display:flex;gap:6px;flex-wrap:wrap}.rcard .ps input,.rcard .ps select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
  .rgh{font-family:var(--serif);color:var(--pd);margin:20px 0 10px;font-size:16px}
  .srow{display:grid;grid-template-columns:260px 1fr 260px 90px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
  .srow code{font-size:12px;background:var(--soft);padding:2px 6px;border-radius:5px}
  .srow input,.srow select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;width:100%}
  .srow .d{font-size:12px;color:var(--mut)}
  .imptbl{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
  .lines td{padding:3px 4px}.lines input,.lines select{width:100%;padding:6px;border:1px solid var(--line);border-radius:7px}
  @media (max-width:1100px){.dgrid{grid-template-columns:1fr}.srow{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(4,minmax(170px,1fr))}}
  @media (max-width:900px){
    #app{grid-template-columns:1fr}
    #side{position:fixed;left:0;top:0;z-index:100;width:250px;transform:translateX(-105%);transition:transform .18s}
    #side.open{transform:none}
    #menuBtn{display:inline-flex}
    #top .co{display:none}
    .form{grid-template-columns:1fr}
    .tb input[type=search]{min-width:160px}
  }
</style>
</head>
<body>
<div id="login">
  <form class="lbox" id="loginForm" autocomplete="off">
    <h1 id="lCo">Hijabi.bd</h1>
    <p class="sub">Distribution admin · desktop panel</p>
    <div id="lStep1">
      <label for="lEmp">Employee ID</label><input id="lEmp" placeholder="EMP-001" autocapitalize="characters" required>
      <label for="lPin">PIN</label><input id="lPin" type="password" inputmode="numeric" placeholder="••••" required>
      <div class="err" id="lErr"></div>
      <button class="btn pri block" id="lBtn" type="submit">Log in</button>
    </div>
    <div id="lStep2" class="hidden">
      <p><b>Choose a new PIN.</b> Your PIN was set by the admin and must be changed before you continue.</p>
      <label for="cOld">Current (temporary) PIN</label><input id="cOld" type="password" inputmode="numeric">
      <label for="cNew">New PIN (4–8 digits)</label><input id="cNew" type="password" inputmode="numeric">
      <label for="cNew2">Repeat new PIN</label><input id="cNew2" type="password" inputmode="numeric">
      <div class="err" id="cErr"></div>
      <button class="btn pri block" id="cBtn" type="button">Change PIN and continue</button>
    </div>
    <div class="foot">Super Admin, CEO, HR, Accounts and ASM. Field staff use the phone app.<br>Use a private computer and log out when you finish.</div>
  </form>
</div>

<div id="app" class="hidden">
  <aside id="side"></aside>
  <div id="main">
    <header id="top">
      <button class="btn sm" id="menuBtn" type="button">☰</button>
      <div class="ttl" id="pTitle">Dashboard</div>
      <div class="co"><b id="tCo">Hijabi.bd</b><br><span id="tDate"></span></div>
      <div class="who"><div class="av" id="tAv">A</div><div><b id="tName"></b><br><span class="muted" id="tRole"></span></div>
        <button class="btn sm" id="pinBtn" type="button" title="Change PIN">PIN</button>
        <button class="btn sm" id="outBtn" type="button">Log out</button></div>
    </header>
    <section id="view"></section>
  </div>
</div>
<div id="shade" class="hidden"></div>
<div id="drawer"><div class="dh"><h3 id="dTitle"></h3><button class="x" id="dClose" type="button">×</button></div><div class="db" id="dBody"></div><div class="df" id="dFoot"></div></div>
<div id="modal" class="hidden"><div class="mb"><h3 id="mTitle"></h3><div id="mBody"></div><div class="mf" id="mFoot"></div></div></div>
<div id="toasts"></div>

<script>
/* Hijabi DMS – desktop admin panel (field.hijabi.bd/admin.html).
   Talks to the same single entry point as the phone app: POST {SUPA_URL}/rest/v1/rpc/api_call {p_fn, p_args:[token, …]}.
   BUILD NOTE: keep SUPA_KEY empty in the repository. build/admin_build.py writes build/deploy13/admin_live.html with the
   publishable key filled in; that file is what goes to field.hijabi.bd/admin.html. No external JavaScript: the Excel
   (.xlsx) writer and reader below are self-contained. Never write a double slash in this script (URLs use \/). */
const SUPA_URL = 'https:\/\/aiqtzolaxtpgjernvuuh.supabase.co';
const SUPA_KEY = 'sb_publishable_wIUtS2qQODPFQXI4Un-hLA_V9519ZcD';
const TOKEN_KEY = 'hdms_admin_token';

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2);
const money = v => (v == null || v === '') ? '' : '৳ ' + Number(v).toLocaleString('en-IN');
const num = v => (v == null || v === '') ? '' : Number(v).toLocaleString('en-IN');
const S = { tok: sessionStorage.getItem(TOKEN_KEY) || '', boot: null, page: '', tab: '', preset: null, cache: {} };

/* ======================================================================= transport */
function headers_(){ const h = { apikey: SUPA_KEY, 'Content-Type': 'application/json' }; if (SUPA_KEY.slice(0, 3) === 'eyJ') h.Authorization = 'Bearer ' + SUPA_KEY; return h; }
async function rpc(fn, args){
  if (!SUPA_KEY) return { ok: false, message: 'This page is not built yet: the Supabase key is missing (run build/admin_build.py).' };
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 120000);
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/rpc/api_call', { method: 'POST', credentials: 'omit', headers: headers_(), body: JSON.stringify({ p_fn: fn, p_args: args }), signal: ac.signal });
    const j = await res.json().catch(() => null);
    clearTimeout(tm);
    if (!res.ok) return { ok: false, message: (j && j.message) || ('Server error ' + res.status) };
    return j || { ok: false, message: 'Empty answer from the server' };
  } catch (e) { clearTimeout(tm); return { ok: false, net: true, message: 'Network problem – check the internet and try again (' + (e && e.message || e) + ')' }; }
}
async function api(fn, ...args){
  const r = await rpc(fn, [S.tok, ...args]);
  if (r && r.code === 'AUTH'){ toast(r.message, 'bad'); logout(true); }
  else if (r && r.code === 'PIN'){ showChangePin(); }

}
async function must(fn, ...args){ const r = await api(fn, ...args); if (!r || r.ok === false) { if (r && r.code !== 'AUTH') toast((r && r.message) || 'Failed', 'bad'); throw new Error((r && r.message) || 'Failed'); } return r; }

    if (s.kind === 'yesno') return '<select data-v' + dis + '>' + optHtml(['Yes', 'No'], s.value) + '</select>';
    if (s.kind === 'map') return '<select data-v' + dis + '>' + optHtml(['OSM', 'GOOGLE'], s.value) + '</select>';
    if (s.kind === 'colour') return '<input type="color" data-v value="' + esc(s.value) + '"' + dis + '>';
    if (s.kind === 'time') return '<input type="time" data-v value="' + esc(s.value) + '"' + dis + '>';
    return '<input data-v value="' + esc(s.value) + '"' + (s.kind === 'number' ? ' inputmode="decimal"' : '') + dis + '>'; };
  $('[data-r=g]', v).innerHTML = groups.map(g => '<div class="card" style="margin-bottom:14px"><h3>' + esc(g) + '</h3>' + r.rows.filter(x => x.group === g).map(s =>
    '<div class="srow" data-key="' + esc(s.key) + '"><div><code>' + esc(s.key) + '</code></div><div class="d">' + esc(s.description) + '</div><div>' + editor(s) + '</div><div>' +
    (ed && s.kind !== 'readonly' ? '<button class="btn sm pri" type="button" data-save>Save</button>' : s.kind === 'readonly' ? '<span class="chip mut">system</span>' : '') + '</div></div>').join('') + '</div>').join('');
  $$('[data-save]', v).forEach(b => b.onclick = async () => { const row = b.closest('.srow'), key = row.dataset.key, val = $('[data-v]', row).value;
    b.disabled = true; const res = await api('apiAdminSettingSave', { key, value: val, submissionId: uuid() }); b.disabled = false;
    if (!res || !res.ok) return toast((res && res.message) || 'Not saved', 'bad'); toast(res.message, 'ok'); });
};
VIEWS.audit = v => { makeTable(v, { entity: 'audit', dated: true, defFrom: period('7')[0], preset: S.preset }); };

/* ======================================================================= login / boot / shell */
function showLogin(msg){ $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lStep1').classList.remove('hidden'); $('#lStep2').classList.add('hidden'); $('#lErr').textContent = msg || ''; $('#lEmp').focus(); }
function showChangePin(){ $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lStep1').classList.add('hidden'); $('#lStep2').classList.remove('hidden'); $('#cErr').textContent = ''; $('#cOld').focus(); }
async function logout(silent){ if (S.tok && !silent) await rpc('apiLogout', [S.tok]); S.tok = ''; S.boot = null; sessionStorage.removeItem(TOKEN_KEY); closeDrawer(); showLogin(silent ? 'Please log in again.' : ''); }
async function boot(){
  const r = await rpc('apiAdminBoot', [S.tok]);
  if (!r || !r.ok){ S.tok = ''; sessionStorage.removeItem(TOKEN_KEY); showLogin((r && r.message) || 'Could not open the admin panel.'); return; }
  S.boot = r;
  if (r.mustChangePin) return showChangePin();
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#tCo').textContent = r.company.name; $('#lCo').textContent = r.company.name; $('#tName').textContent = r.user.name; $('#tRole').textContent = r.user.empId + ' · ' + r.roleLabel;
  $('#tAv').textContent = ((r.user.name || '?').split(/\s+/).filter(x => /^[A-Za-z\u0980-\u09FF]/.test(x)).map(x => x[0]).slice(0, 2).join('') || '?').toUpperCase();
  $('#tDate').textContent = new Date(r.today + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
  let g = '', html = '<div class="brand">' + esc(r.company.name) + '<small>Distribution admin</small></div>';
  PAGES.filter(p => can(p.perm)).forEach(p => { if (p.g !== g){ g = p.g; html += '<div class="grp">' + esc(g) + '</div>'; } html += '<a class="nav" href="#' + p.id + '" data-p="' + p.id + '"><i>' + p.i + '</i>' + esc(p.l) + '</a>'; });
  $('#side').innerHTML = html;
  route();
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); const b = $('#lBtn'); b.disabled = true; $('#lErr').textContent = '';
  const r = await rpc('apiLogin', [$('#lEmp').value.trim().toUpperCase(), $('#lPin').value, 'admin-desktop ' + navigator.userAgent.slice(0, 80)]);
  b.disabled = false;
  if (!r || !r.ok){ $('#lErr').textContent = (r && r.message) || 'Login failed'; return; }
  S.tok = r.token; sessionStorage.setItem(TOKEN_KEY, r.token); $('#lPin').value = '';
  if (r.mustChangePin){ S.boot = null; return showChangePin(); }
  boot();
};
$('#cBtn').onclick = async () => {
  const o = $('#cOld').value, n = $('#cNew').value, n2 = $('#cNew2').value;
  if (!/^\d{4,8}$/.test(n)) return $('#cErr').textContent = 'The new PIN must be 4 to 8 digits.';
  if (n !== n2) return $('#cErr').textContent = 'The two new PINs are not the same.';
  const r = await rpc('apiChangePin', [S.tok, o, n]);
  if (!r || !r.ok){ $('#cErr').textContent = (r && r.message) || 'PIN not changed'; if (r && r.code === 'AUTH') logout(true); return; }
  ['#cOld', '#cNew', '#cNew2'].forEach(s => $(s).value = ''); toast('PIN changed.', 'ok'); boot();
};
$('#outBtn').onclick = () => logout(false);
$('#pinBtn').onclick = () => showChangePin();
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
$('#dClose').onclick = closeDrawer; $('#shade').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!$('#modal').classList.contains('hidden')) return; closeDrawer(); } });
window.addEventListener('hashchange', route);
if (S.tok) boot(); else showLogin(SUPA_KEY ? '' : 'This page is not built yet (Supabase key missing).');
</script>
