<style>
  :root{--p:#1A473C;--a:#282626;--pd:#282626;--soft:#F8F3EC;--soft2:#EFE8DC;--ink:#282626;--mut:#6E6A63;--ok:#2E7D5B;--okb:#E4F1EA;--warn:#8A6100;--warnb:#FBF1DA;--bad:#A8322A;--badb:#F8E6E3;--info:#24507A;--infob:#E7EEF6;--line:#E6DFD3;--r:16px;--serif:'Libre Baskerville',Georgia,'Times New Roman',serif;--sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Bengali',Arial,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--soft);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 0 90px}
  header.top{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  header.top .brand{font-family:var(--serif);font-weight:700;letter-spacing:.2px;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.top .brand small{font-family:var(--sans)}
  header.top img.wm{height:30px;width:auto;display:block;margin:-2px 0 2px}
  header.top .brand small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
  header.top button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:14px}
  .pad{padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(40,38,38,.05)}
  .card h3{margin:0 0 12px;font-family:var(--serif);font-weight:700;font-size:15.5px;color:var(--pd)}
  .ch{width:100%;height:auto;display:block}
  .lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mut);margin-top:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .dn{display:flex;gap:12px;align-items:center}.dnc{width:44%;max-width:170px;flex:0 0 auto}.dnl{flex:1;font-size:12.5px}.dnl span.grow{font-weight:600;color:#444}.dnl div{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}.dnl i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .hb .hbr{margin-bottom:8px;font-size:13px}.hbt{position:relative;height:9px;background:var(--soft);border-radius:6px;margin-top:3px;overflow:visible}.hbt i{display:block;height:100%;border-radius:6px}.hbt s{position:absolute;top:-3px;width:2px;height:15px;background:var(--pd)}
  .kpi em{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:2px}.kpi em.up{color:var(--ok)}.kpi em.dn2{color:var(--bad)}
  .btn.sm{padding:9px;font-size:14px;margin-top:8px}
  .dcst{display:none;font-size:12.5px;color:var(--mut);background:var(--soft);border-radius:10px;padding:7px 10px;margin:0 2px 8px}
  @media print{header.top,.tabs,.btn{display:none!important}.card{box-shadow:none;border:1px solid #ddd}}
  .muted{color:var(--mut);font-size:12.5px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1;min-width:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .kpi{background:var(--soft);border-radius:14px;padding:12px 8px;text-align:center}

/* Safety net: any data: URL still left in a call is sent as '' (photos go to Storage first, see supaPhotos_). */
function supaArgs_(args){ return args.map(a=>{ if(!a || typeof a!=='object' || Array.isArray(a)) return a; const c={}; for(const k in a){ if(k==='_phTries') continue; c[k]=(typeof a[k]==='string' && /^data:[^,;]*;base64,/.test(a[k]))?'':a[k]; } return c; }); }

function supaHeaders_(){ const hd={apikey:SUPA_KEY}; if(SUPA_KEY.slice(0,3)==='eyJ') hd.Authorization='Bearer '+SUPA_KEY; return hd; }
function supaRpc_(fn, args){
  const ac=(typeof AbortController!=='undefined')?new AbortController():null, tm=ac?setTimeout(()=>ac.abort(), 120000):null;
  const hd=Object.assign(supaHeaders_(), {'Content-Type':'application/json'});
  return fetch(SUPA_URL+'/rest/v1/rpc/api_call', {method:'POST', credentials:'omit', headers:hd, body:JSON.stringify({p_fn:fn, p_args:supaArgs_(args)}), signal:ac?ac.signal:undefined})
    .then(res=>res.json().then(j=>res.ok?j:{ok:false,message:(j&&j.message)?j.message:('Server error '+res.status)}))
    .then(r=>{ clearTimeout(tm); return r; })
    .catch(e=>{ clearTimeout(tm); return {ok:false,net:true,message:'Network problem, check internet and try again ('+(e&&e.message?e.message:e)+')'}; });

/* Photos on Supabase: before a call is sent, every data:image value in its object arguments is uploaded to Storage
   (bucket "photos") with one-time upload tickets (apiPhotoTicket) and replaced by its public URL. The URL is written
   back into the same object, so an item in Unsent items keeps it and a retry never uploads it again. No network →
   {net:true}: the outbox keeps the item and retries with the same submissionId. A storage error is retried twice,
   then the photo is left out (the server decides whether the record may be saved without it). */
const PHOTO_RX=/^data:image\/(jpeg|png|webp);base64,/;
const PHOTO_PURPOSE={apiGrnCreate:'grn',apiSubmitOnboarding:'shop',apiSubmitVisit:'visit',apiSubmitCollection:'collection',apiSubmitExpense:'expense',apiDeliver:'delivery'};
function photoBlob_(d){ const m=d.match(PHOTO_RX), bin=atob(d.slice(d.indexOf(',')+1)), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:'image/'+(m?m[1]:'jpeg')}); }
function photoSaved_(){ try{ obPersist(); }catch(e){} }
async function supaPhotos_(fn, args){
  const spots=[]; let warn='';
  args.forEach(a=>{ if(a && typeof a==='object' && !Array.isArray(a)) for(const k in a) if(typeof a[k]==='string' && PHOTO_RX.test(a[k])) spots.push([a,k]); });
  if(!spots.length || typeof args[0]!=='string' || !args[0]) return null;
  const t=await supaRpc_('apiPhotoTicket', [args[0], {purpose:PHOTO_PURPOSE[fn]||'other', count:Math.min(6, spots.length)}]);
  if(!t || !t.ok){
    if(!t || t.net || t.code==='AUTH') return t||{ok:false,net:true,message:'No response from server'};
    spots.forEach(([a,k])=>{ a[k]=''; }); photoSaved_();
    return {warn:'Photo not uploaded: '+t.message};
  }
  for(let i=0;i<spots.length;i++){
    const [a,k]=spots[i], tk=t.tickets[i];
    if(!tk){ a[k]=''; warn='Only 6 photos can be sent at once; the rest were left out.'; continue; }
    let res;
    try{ res=await fetch(SUPA_URL+'/storage/v1/object/photos/'+tk.path, {method:'POST', credentials:'omit',
      headers:Object.assign(supaHeaders_(), {'Content-Type':'image/jpeg', 'x-upsert':'false'}), body:photoBlob_(a[k])}); }
    catch(e){ return {ok:false,net:true,message:'Network problem while uploading the photo — it will be sent again ('+(e&&e.message?e.message:e)+')'}; }
    if(res.ok || res.status===409){ a[k]=tk.url; photoSaved_(); continue; }
    a._phTries=(a._phTries||0)+1; photoSaved_();
    if(a._phTries<3) return {ok:false,net:true,message:'Photo upload failed (server '+res.status+') — it will be tried again'};
    a[k]=''; photoSaved_(); warn='Photo could not be uploaded (server '+res.status+') and was left out.';
  }
  return warn?{warn}:null;
}
async function supaCall_(fn, args){
  let ph=null;
  try{ ph=await supaPhotos_(fn, args); }catch(e){ ph={ok:false,net:true,message:'Photo upload problem — it will be tried again ('+(e&&e.message?e.message:e)+')'}; }
  if(ph && ph.ok===false) return ph;
  const r=await supaRpc_(fn, args);
  if(ph && ph.warn && r && r.ok) r.warning=(r.warning?r.warning+' ':'')+ph.warn;
  else if(ph && ph.warn && r && !r.ok && r.message) r.message+=' ('+ph.warn+')';
  return r;
}
function call(fn, ...args){
  return new Promise(resolve=>{
    if(SUPA){ supaCall_(fn, args).then(r=>done_(r, resolve)); return; }
    if(GAS){
      google.script.run
        .withSuccessHandler(r=>done_(r, resolve))
        .withFailureHandler(e=>resolve({ok:false,net:true,message:(e&&e.message)?e.message:String(e)}))[fn](...args);
      return;
    }
    const ac=(typeof AbortController!=='undefined')?new AbortController():null, tm=ac?setTimeout(()=>ac.abort(), 120000):null;
    fetch(API_URL, {method:'POST', credentials:'omit', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({fn, args}), signal:ac?ac.signal:undefined})
      .then(res=>res.json()).then(r=>{ clearTimeout(tm); done_(r, resolve); })
      .catch(e=>{ clearTimeout(tm); resolve({ok:false,net:true,message:'Network problem, check internet and try again ('+(e&&e.message?e.message:e)+')'}); });
  });
}

function compress(file, max, q){
  max=max||1280; q=q||0.7;
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
    img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}

/* ---------------------------------------------------------------- unsent items (instant save, sent in the background)
   Orders, payments, visits, expenses and deliveries are saved on the phone at once and sent to the server in the
   background, in order, with automatic retry when the network is bad. The same submission ID is reused on every retry,
   so the server never records an item twice. Items the server refuses stay in "Unsent items" to fix or discard. */
const OB_FNS={apiSubmitOnboarding:'New shop',apiSubmitOrder:'Order',apiSubmitCollection:'Payment',apiSubmitVisit:'Visit',apiSubmitExpense:'Expense',apiDeliver:'Delivery'};
S.ob=(function(){ try{ const q=JSON.parse(localStorage.getItem('hbd_outbox')||'[]'); q.forEach(x=>{ if(x.st==='sending') x.st='pending'; }); return Array.isArray(q)?q:[]; }catch(e){ return []; } })();
S.obWait={}; S.obSaved=true; S.obSent=false;
function obPersist(){ try{ localStorage.setItem('hbd_outbox', JSON.stringify(S.ob)); S.obSaved=true; }catch(e){ S.obSaved=false; } updOb(); }
function obMine(){ return S.user ? S.ob.filter(x=>x.emp===S.user.empId) : []; }
function obBadge(){ return `<span id="obBadge" class="chip" onclick="show('outbox')" style="display:none;cursor:pointer;margin-right:6px"></span>`; }
function updOb(){
  const m=obMine(), f=m.filter(x=>x.st==='failed').length, p=m.length-f;
  document.querySelectorAll('#obBadge').forEach(el=>{ el.style.display=m.length?'inline-block':'none'; el.className='chip '+(f?'c-bad':'c-info'); el.textContent=f?('⚠ '+f+(p?' · ⏳ '+p:'')):('⏳ '+p); });
}
function queueSubmit(fn, payload, label){
  if(!S.user) return null;
  const it={id:payload.submissionId||uid(), fn, p:payload, label:label||OB_FNS[fn]||fn, at:Date.now(), emp:S.user.empId, st:'pending', tries:0, err:''};
  payload.submissionId=it.id;
  S.ob.push(it); obPersist();
  if(!S.obSaved){ S.ob=S.ob.filter(x=>x!==it); updOb(); return null; }
  S.gps={}; S.photos={};
  setTimeout(obRun, 50); return it;
}
async function obRun(){
  if(S.obBusy || !S.token || !S.user) return; S.obBusy=true;
  try{
    for(;;){
      const it=obMine().find(x=>x.st==='pending'); if(!it) break;
      it.st='sending'; obPersist();
      const r=await call(it.fn, S.token, it.p);
      if(r && r.ok){ S.ob=S.ob.filter(x=>x!==it); obPersist(); obDone(it, r); continue; }
      if(!r || r.net || r.code==='AUTH'){ it.st='pending'; it.tries++; obPersist(); clearTimeout(S.obTimer); S.obTimer=setTimeout(obRun, Math.min(60000, 4000*it.tries)); break; }
      it.st='failed'; it.err=r.message||'Not saved'; obPersist(); obDone(it, r);
    }
  } finally { S.obBusy=false; }
  if(S.obSent && !obMine().some(x=>x.st!=='failed')){ S.obSent=false; refreshInBackground(); }
}
function obDone(it, r){
  if(r.ok){ S.obSent=true; if(r.doc && r.id){ S.docs=S.docs||{}; S.docs[r.id]=Object.assign({_t:Date.now()}, r.doc); } }
  const w=S.obWait[it.id]; delete S.obWait[it.id];
  if(w && document.getElementById('obw_'+it.id)) w(r);
  else if(r.ok) toast('✅ '+it.label+' saved on server');
  else toast('⛔ '+it.label+' NOT saved: '+r.message+' — open ⚠ Unsent items', 9000);
}
window.addEventListener('online', ()=>obRun());
const homeScreen_=screens.home; screens.home=function(){ homeScreen_.apply(this, arguments); updOb(); };
async function saveQueued(fn, p, label, busyMsg){
  const it=queueSubmit(fn, p, label);
  if(it) return {it};
  const r=await submit(fn, p, busyMsg);
  return r ? {sync:r} : null;
}
function waitBox(it, render){
  S.obWait[it.id]=r=>{ const el=$('obw_'+it.id); if(el) el.outerHTML=render(r); };
  return `<div id="obw_${it.id}" class="hint" style="margin-top:10px">⏳ Sending to the server in the background — you can carry on working.</div>`;
}
function resultBox(r){
  return r.ok ? `<div class="okbox" style="margin-top:10px">✅ On server: ${h(r.message)}</div>${r.geoFlag&&String(r.geoFlag).indexOf('Outside')>=0?`<div class="warnbox">📍 ${h(r.geoFlag)}</div>`:''}${r.warning?`<div class="warnbox">${h(r.warning)}</div>`:''}`
    : `<div class="badbox" style="margin-top:10px">⛔ Not saved: ${h(r.message)}</div><button class="btn sec" onclick="show('outbox')">Fix in Unsent items</button>`;
}
screens.outbox = function(){
  const m=obMine().slice().sort((a,b)=>a.at-b.at);
  const when=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  page('Unsent items', m.length? m.length+' on this phone' : 'All sent', m.length ? m.map(x=>`<div class="card"><div class="row"><div class="grow"><b>${h(x.label)}</b><div class="muted">${h(when(x.at))}${x.tries?' · tried '+x.tries+'×':''}</div></div>
      <span class="chip ${x.st==='failed'?'c-bad':'c-info'}">${x.st==='failed'?'NOT SAVED':(x.st==='sending'?'SENDING':'WAITING')}</span></div>
      ${x.st==='failed'?`<div class="badbox">${h(x.err)}</div><div class="grid2"><button class="btn sm" onclick="obRetry('${h(x.id)}')">Try again</button><button class="btn sm sec" onclick="obDiscard('${h(x.id)}')">Discard</button></div>`:''}</div>`).join('')
      + `<div class="hint">Waiting items are sent automatically as soon as the network allows. A refused item (for example credit limit or amount above the balance) must be discarded and entered again with the right details.</div>`
      : `<div class="okbox">✅ Everything saved on this phone has reached the server.</div>`);
  obRun();
};
function obRetry(id){ const x=S.ob.find(y=>y.id===id); if(x){ x.st='pending'; x.err=''; obPersist(); obRun(); setTimeout(()=>{ if(S.screen==='outbox') screens.outbox(); }, 400); } }
function obDiscard(id){ const x=S.ob.find(y=>y.id===id); if(!x || !confirm('Discard this '+x.label+'? It was NOT saved on the server.')) return; S.ob=S.ob.filter(y=>y!==x); obPersist(); screens.outbox(); }

  if(m && m[sku]!==undefined) return Number(m[sku])||0;
  const p=b.products.find(x=>x.sku===sku); return (p && typeof p.stock==='number') ? p.stock : null; }
function stockBadge(sku, n){ const a=ordAvail(sku); if(a===null) return ''; const low=(S.boot.settings&&S.boot.settings.lowStock)||12;
  if(n && n>a) return `<span class="pst out">Only ${a} in stock</span>`;
  if(a<=0) return `<span class="pst out">Out of stock</span>`;

  return `<span class="pst ok">Stock ${a}</span>`; }
function ordShorts(){ return cartLines().map(l=>({l, a:ordAvail(l.sku)})).filter(x=>x.a!==null && x.l.qty>x.a); }
async function ordStockRefresh(){ const b=S.boot; if(!b || !b.warehouses || !b.warehouses.length) return;
  const r=await api('apiStockAvail', {}); if(!r || !r.ok || !r.stockWh || S.boot!==b) return;
  b.stockWh=r.stockWh; const my=r.stockWh[b.myWarehouse]||r.stock||{}; b.products.forEach(p=>{ if(my[p.sku]!==undefined) p.stock=my[p.sku]; });
  if(S.screen==='order'){ renderGrid(); calcOrder(); } }

  lines.forEach(l=>{ if(m && m[l.sku]!==undefined) m[l.sku]=Math.max(0, m[l.sku]-l.qty);
    if(wh && wh===b.myWarehouse){ const p=b.products.find(x=>x.sku===l.sku); if(p && typeof p.stock==='number') p.stock=Math.max(0, p.stock-l.qty); } }); }

function setDue(){ const m=(val('or_terms').match(/(\d+)/)||[0,0])[1]; $('or_due').value=addDays(today(), Number(m)); $('or_due').min=today(); }
function orderTailorInfo(){
  const t=tailorById(val('or_t')), el=$('or_tinfo'); if(!el) return;

async function doOrder(){
  const tid=val('or_t'); if(!tid) return toast('Select a shop');
  const lines=cartLines().map(l=>({sku:l.sku, qty:l.qty}));
  if(!lines.length) return toast('Add at least one colour');
  const t=orderTotals(); if(t.over) return toast('Maximum discount is ৳'+S.boot.settings.maxPerPc+' per piece'); if(t.frac) return toast('Discount must be whole taka');
  const g=needGps('or'); if(!g) return;
  const tl=tailorById(tid);
  if(!confirm(`Confirm order for ${tl.shop}\n${lines.length} colour(s), ${t.units} pcs\nDiscount: ${money(t.pc)} per piece (${money(t.disc)})\nNet: ${money(t.net)}\nTerms: ${val('or_terms')} · due ${val('or_due')}${t.needsAppr?'\n\n⚠ Needs manager approval (discount above ৳'+S.boot.settings.repPerPc+'/pc)':''}${ordShorts().length?'\n\n⚠ Above available stock: '+ordShorts().map(x=>(x.l.p.variant||x.l.p.name)+' '+x.l.qty+' / '+x.a).join(', '):''}`)) return;
  const owh=ordWh(), sh0=ordShorts();
  const q=await saveQueued('apiSubmitOrder', Object.assign({tailorId:tid,lines,discPerPc:t.pc,paymentTerms:val('or_terms'),expectedPayDate:val('or_due'),remarks:val('or_rem'),submissionId:uid()}, g), 'Order · '+tl.shop+' · '+money(t.net), 'Saving order…');
  if(!q) return;
  if(S.boot.warehouses && S.boot.warehouses.length) ordReserveLocal(owh, lines);
  const inv=r=>r.ok?`<button class="btn gold" onclick="show('doc','${h(r.id)}','invoice')">🧾 ${r.status==='Submitted'?'View order':'Draft invoice — print / share'}</button>`:'';
  if(q.sync){ const r=q.sync; if(r.doc){ S.docs=S.docs||{}; S.docs[r.id]=Object.assign({_t:Date.now()}, r.doc); } return done(r,'order', ordWarnBox(r)+inv(r)); }
  const w0=sh0.length?ordWarnBox({warehouse:owh, stockWarnings:sh0.map(x=>({colour:x.l.p.variant||x.l.p.name, ordered:x.l.qty, available:x.a}))}):'';
  done({message:'Order for '+tl.shop+' saved: '+lines.length+' colour(s), '+t.units+' pcs, '+money(t.net)+'.'+(t.needsAppr?' Waiting for manager approval of the discount.':'')}, 'order', w0+waitBox(q.it, r=>resultBox(r)+(w0?'':ordWarnBox(r))+inv(r)));
}

function sfFilter(){ const q=val('sf_q').toLowerCase(); document.querySelectorAll('#sf_lines .sfl').forEach(x=>{ x.style.display = !q||x.dataset.s.indexOf(q)>=0 ? '' : 'none'; }); }

  else { fn='apiStockAdjust'; p.mode=s.kind; p.reason=val('sf_reason'); if(!p.reason) return toast('Please give the reason'); }
  const sum=lines.map(x=>{ const pr=S.boot.products.find(y=>y.sku===x.sku); return (pr?(pr.variant||pr.name):x.sku)+' '+(x.counted!==undefined?'= '+x.counted:x.qty); }).join(', ');

  done(r, null, ch+`<button class="btn sec" onclick="show('stock', S.sf.mode==='transfer'?'':S.sf.wh)">📦 Back to Inventory</button>`);
}

screens.trfs = async function(tab){

  page('Inventory', 'Transfer challans', `${invTabs(t.tab==='discrepancy'&&P.resolve?'disc':'trfs')}<div class="card"><div class="tabs" id="tl_tabs" style="margin:0">${TL_TABS.map(x=>`<button class="${t.tab===x[0]?'on':''}" onclick="screens.trfs('${x[0]}')">${x[1]}<span class="tlc" id="tlc_${x[0]}"></span></button>`).join('')}</div>
    ${P.transfer?`<div><button class="btn sm" onclick="show('trfForm','send')">🚚 New transfer</button><button class="btn sm sec" onclick="show('trfForm','request')">📨 Request stock</button></div>`:''}</div><div id="tl_out">${ivLoading()}</div>`);
  const r=await api('apiTransfers', {tab:t.tab}); if(S.screen!=='trfs' || S.tl!==t) return;
  if(!r.ok){ $('tl_out').innerHTML=`<div class="badbox">${h(r.message)}</div>`; return; }
  TL_TABS.forEach(x=>{ const n=r.counts[x[0]]; const el=$('tlc_'+x[0]); if(el&&n&&x[0]!=='all'&&x[0]!=='outgoing') el.textContent=' '+n; });
  const help={incoming:'Challans coming to your warehouse. Count the goods, then receive.',outgoing:'Challans your warehouse sent.',requests:'Stock asked for. The sending warehouse dispatches or rejects.',discrepancy:'Received with a difference — a manager decides.',all:'Everything in the last 60 days and every open challan.'};
  $('tl_out').innerHTML=`<div class="card"><div class="hint" style="margin-bottom:6px">${help[t.tab]||''}</div><div id="tl_list">${r.list.map(trfRow).join('')||'<div class="muted" style="text-align:center;padding:18px">Nothing here.</div>'}</div></div>`;
};
function trfRow(x){
  const req=x.status==='Requested';
  return `<div class="drow trow" onclick="show('trf','${h(x.id)}')"><div class="grow"><b>${h(x.id)}</b> ${trfChip(x.status)} <span class="chip">${h(x.type)}${x.requested?' · request':''}</span>${x.sample?' <span class="chip">Sample</span>':''}
    <div class="hint">${h(x.from.code)} → ${h(x.to.code)} · ${h(fmtD(x.date))} · ${x.lines} colour${x.lines===1?'':'s'}${x.vehicle?' · '+h(x.vehicle):''}</div>
    ${x.pendingQty&&!req?`<div class="hint" style="color:var(--warn)">🚚 ${ivN(x.pendingQty)} pcs in transit</div>`:''}${x.openDiscrepancies?`<div class="hint" style="color:var(--bad)">⚠ short ${x.shortQty} · excess ${x.excessQty} — waiting for a manager</div>`:''}</div>
    <div class="r"><b class="ivn">${ivN(req?x.requestedQty:x.sentQty)}</b><div class="hint">${req?'requested':'sent'}</div></div><span class="chev">›</span></div>`;
}

/* ---- one challan: details + the action the user may take (dispatch a request, receive, resolve, cancel) */
screens.trf = async function(id){
  page('Transfer challan', id, `<div id="tf_out">${ivLoading()}</div>`);
  const r=await api('apiTransferDoc', id); if(S.screen!=='trf') return;
  if(!r.ok){ $('tf_out').innerHTML=`<div class="badbox">${h(r.message)}</div>`; return; }
  S.tf={id, d:r.doc, sub:uid()}; trfRender();
};
function trfRender(){
  const d=S.tf.d, it=d.items; let act='';
  if(d.canReceive) act+=`<button class="btn ok" onclick="show('trfRecv','${h(d.id)}')">📥 Count &amp; receive</button>`;
  if(d.canDispatch) act+=`<div class="card"><h3>Dispatch this request</h3><div class="hint">Change a quantity if you cannot send all (0 = not sent). Batches are taken oldest first.</div>
    ${it.map(l=>`<div class="sfl">${prodImg({img:l.img,variant:l.colour},'cim')}<div class="grow"><b>${h(l.colour||l.name)}</b><div class="hint">${h(l.sku)} · asked ${l.requested} · available ${ivN(l.available)}${(l.fromBatches||[]).length?' · '+l.fromBatches.slice(0,3).map(b=>h(b.batch)+' '+b.qty).join(', '):''}</div></div><input type="number" inputmode="numeric" min="0" id="td_${h(l.sku)}" data-sku="${h(l.sku)}" value="${Math.min(l.requested, Math.max(0,l.available||0))}"></div>`).join('')}
    <label>Vehicle / carrier</label><input id="td_veh" placeholder="optional"><button class="btn ok" onclick="trfDispatch()">🚚 Dispatch</button><button class="btn bad" onclick="trfCancel('reject')">✗ Reject request</button></div>`;
  else if(d.canCancel) act+=`<button class="btn sec" onclick="trfCancel('cancel')">✗ Cancel request</button>`;
  if(d.canResolve){
    const open=it.filter(l=>l.received!==null&&l.received!==l.sent&&!l.resolution);
    act+=`<div class="card" id="tf_res"><h3>Resolve the difference</h3>${open.map(l=>{ const sh=l.sent>l.received;
      return `<div class="sfl">${prodImg({img:l.img,variant:l.colour},'cim')}<div class="grow"><b>${h(l.colour||l.name)}</b><div class="hint">sent ${l.sent} · counted ${l.received} · <b style="color:var(--bad)">${sh?'short '+(l.sent-l.received):'excess '+(l.received-l.sent)}</b>${l.reason?' · '+h(l.reason):''}${l.note?' · '+h(l.note):''}</div>
        <select id="rs_${h(l.sku)}" data-sku="${h(l.sku)}">${(sh?['loss','source','late']:['accept','return']).map(a=>`<option value="${a}">${RES_LABEL[a]}</option>`).join('')}</select></div></div>`; }).join('')}
      <label>Note</label><input id="rs_note" placeholder="optional"><button class="btn" onclick="trfResolve()">✓ Save decision</button></div>`;
  }
  const rows=it.map(l=>{ const diff=l.received!==null&&l.received!==l.sent;
    return `<tr><td>${prodImg({img:l.img,variant:l.colour},'cim')}</td><td><b>${h(l.colour||l.name)}</b><div class="hint">${h(l.sku)}${(l.batches||[]).length?' · '+l.batches.map(b=>h(b.batch)+(l.batches.length>1?' ×'+b.qty:'')).join(', '):''}</div>${l.reason?`<div class="hint" style="color:var(--bad)">${h(l.reason)}${l.note?' · '+h(l.note):''}</div>`:''}${l.resolution?`<div class="hint" style="color:var(--ok)">✓ ${h(RES_LABEL[l.resolution]||l.resolution)}</div>`:''}</td>
      <td class="r">${d.status==='Requested'?l.requested:l.sent}</td><td class="r">${l.received===null?'<span class="hint">—</span>':`<b style="color:${diff?'var(--bad)':'var(--ok)'}">${l.received}</b>${l.damaged?`<div class="hint">${l.damaged} damaged</div>`:''}`}</td></tr>`; }).join('');
  $('tf_out').innerHTML=`<div class="card"><div class="row"><h3 class="grow" style="margin:0">${h(d.from.code)} → ${h(d.to.code)}</h3>${trfChip(d.status)}</div>
    <div class="hint">${h(d.type)}${d.requested?' · requested by '+h(d.requestedBy):''} · ${h(d.from.name)} → ${h(d.to.name)}${d.vehicle?' · 🚚 '+h(d.vehicle):''}${d.note?' · '+h(d.note):''}${d.cancelReason?' · reason: '+h(d.cancelReason):''}</div>
    <div class="grid4" style="margin-top:10px"><div class="kpi"><b>${ivN(d.status==='Requested'?d.requestedQty:d.sentQty)}</b><span>${d.status==='Requested'?'Requested':'Sent'}</span></div><div class="kpi"><b>${ivN(d.receivedQty)}</b><span>Received</span></div><div class="kpi"><b style="color:${d.pendingQty?'var(--warn)':'inherit'}">${ivN(d.status==='Requested'?0:d.pendingQty)}</b><span>In transit</span></div><div class="kpi"><b style="color:${d.openDiscrepancies?'var(--bad)':'inherit'}">${d.shortQty+d.excessQty}</b><span>Difference</span></div></div>
    <div><button class="btn sm gold" onclick="show('stkDoc','trf','${h(d.id)}')">🖨 Challan (print / share)</button></div></div>
    ${act}<div class="card" style="padding:10px"><table class="t" id="tf_tab"><tr><th></th><th>Colour</th><th class="r">${d.status==='Requested'?'Asked':'Sent'}</th><th class="r">Received</th></tr>${rows}</table></div>
    <div class="card"><h3>History</h3>${tlFull(d.timeline.map(e=>({label:e.event, done:true, at:e.at, by:e.by+(e.note?' · '+e.note:'')})))}</div>`;
}
async function trfDispatch(){
  const lines=[]; document.querySelectorAll('#tf_out input[id^="td_"][data-sku]').forEach(i=>lines.push({sku:i.dataset.sku, qty:Number(i.value)||0}));
  if(!lines.some(x=>x.qty>0)) return toast('Enter at least one quantity (or reject the request)');
  if(!confirm('Dispatch '+S.tf.id+'\n'+lines.filter(x=>x.qty).map(x=>x.sku+' '+x.qty).join(', '))) return;
  const r=await submit('apiTransferAction', {trfNo:S.tf.id, action:'dispatch', lines, vehicle:val('td_veh'), submissionId:S.tf.sub}); if(!r) return;
  toast('✅ '+r.message, 6000); refreshInBackground(); screens.trf(S.tf.id);
}
async function trfCancel(kind){
  const why=prompt(kind==='reject'?'Why can this request not be sent?':'Why cancel this request?'); if(!why) return;
  const r=await submit('apiTransferAction', {trfNo:S.tf.id, action:kind, reason:why, submissionId:uid()}); if(!r) return;
  toast('✅ '+r.message); refreshInBackground(); screens.trf(S.tf.id);
}
async function trfResolve(){
  const lines=[]; document.querySelectorAll('#tf_res select[data-sku]').forEach(s=>lines.push({sku:s.dataset.sku, action:s.value}));
  if(!confirm('Resolve '+S.tf.id+'\n'+lines.map(x=>x.sku+': '+RES_LABEL[x.action]).join('\n'))) return;
  const r=await submit('apiTransferResolve', {trfNo:S.tf.id, lines, note:val('rs_note'), submissionId:S.tf.sub}); if(!r) return;
  toast('✅ '+r.message, 6000); refreshInBackground(); screens.trf(S.tf.id);
}

/* ---- receive against a challan: ✓ per line, or correct the quantity + reason; partial or all */
screens.trfRecv = async function(id){
  page('Count & receive', id, `<div id="rc_out">${ivLoading()}</div>`);
  const r=await api('apiTransferDoc', id); if(S.screen!=='trfRecv') return;
  if(!r.ok){ $('rc_out').innerHTML=`<div class="badbox">${h(r.message)}</div>`; return; }
  const L=r.doc.items.filter(x=>x.received===null && x.sent>0);
  S.rc={id, d:r.doc, L:L.map(x=>({sku:x.sku, x, qty:x.sent, dmg:0, reason:'', note:'', st:''})), sub:uid()};
  rcRender();
};
function rcLine(l, i){
  const x=l.x, diff=l.st==='diff';
  return `<div class="rcl ${l.st}" id="rc_${h(l.sku)}">${prodImg({img:x.img,variant:x.colour},'cim')}<div class="grow"><b>${h(x.colour||x.name)}</b><div class="hint">${h(x.sku)} · sent <b>${x.sent}</b>${(x.batches||[]).length?' · '+x.batches.map(b=>h(b.batch)).join(', '):''}</div>
    <div class="qty" style="margin-top:6px"><button onclick="rcStep(${i},-1)">−</button><input type="number" inputmode="numeric" min="0" id="rq_${i}" value="${l.qty}" oninput="rcQty(${i},this.value)"><button onclick="rcStep(${i},1)">+</button></div>
    <div class="rcx" style="display:${diff?'':'none'}"><select id="rr_${i}" onchange="rcSet(${i},'reason',this.value)"><option value="">Reason…</option>${RC_REASONS.map(o=>`<option ${l.reason===o?'selected':''}>${o}</option>`).join('')}</select>
      <div class="grid2"><input type="number" inputmode="numeric" min="0" id="rd_${i}" value="${l.dmg||''}" placeholder="Damaged pcs" oninput="rcDmg(${i},this.value)"><input id="rn_${i}" value="${h(l.note)}" placeholder="Note" oninput="rcSet(${i},'note',this.value)"></div></div></div>
    <button class="tick ${l.st==='ok'?'on':''}" title="Received exactly as sent" onclick="rcTick(${i})">✓</button></div>`;
}
function rcRender(){
  const s=S.rc, d=s.d;
  $('rc_out').innerHTML=`<div class="card"><b>${h(d.from.code)} → ${h(d.to.code)}</b> ${trfChip(d.status)}<div class="hint">Count the goods. Tap ✓ when a colour matches the challan, or change the quantity and give the reason. You can receive some colours now and the rest later.</div>
    ${s.L.length?`<button class="btn ok" onclick="rcAll()">✓ Receive all as sent (${s.L.reduce((a,l)=>a+l.x.sent,0)} pcs)</button>`:'<div class="okbox">Every colour of this challan has been received.</div>'}</div>
    <div class="card" id="rc_lines">${s.L.map(rcLine).join('')}</div>
    <div class="card"><label>Colour not on the challan (wrong item / extra)</label><div class="grid2"><select id="rc_add"><option value="">Choose colour…</option>${S.boot.products.filter(p=>!d.items.some(x=>x.sku===p.sku)).map(p=>`<option value="${h(p.sku)}">${h(p.variant||p.name)} · ${h(p.sku)}</option>`).join('')}</select><button class="btn sm sec" onclick="rcAdd()">＋ Add</button></div></div>
    <div id="rc_sum"></div><button class="btn" id="rc_save" onclick="rcSave()">📥 Receive ticked / changed colours</button>`;
  rcSum();
}
function rcRedraw(i){ const el=$('rc_'+S.rc.L[i].sku); if(el) el.outerHTML=rcLine(S.rc.L[i], i); rcSum(); }
function rcState(l){ l.st = (l.qty===l.x.sent && !l.dmg) ? 'ok' : 'diff'; if(l.st==='ok') l.reason=''; else if(!l.reason) l.reason = l.qty<l.x.sent ? 'Short' : l.qty>l.x.sent ? (l.x.sent?'Excess':'Wrong item') : (l.dmg?'Damaged':''); }
function rcTick(i){ const l=S.rc.L[i]; if(l.st==='ok'){ l.st=''; } else { l.qty=l.x.sent; l.dmg=0; l.reason=''; l.st='ok'; } rcRedraw(i); }
function rcStep(i, d){ const l=S.rc.L[i]; l.qty=Math.max(0,(Number(l.qty)||0)+d); rcState(l); rcRedraw(i); }
function rcQty(i, v){ const l=S.rc.L[i]; l.qty=Math.max(0, Math.floor(Number(v)||0)); rcState(l); const el=$('rc_'+l.sku); if(el){ el.className='rcl '+l.st; el.querySelector('.rcx').style.display=l.st==='diff'?'':'none'; el.querySelector('.tick').classList.toggle('on', l.st==='ok'); const rr=$('rr_'+i); if(rr) rr.value=l.reason; } rcSum(); }
function rcDmg(i, v){ const l=S.rc.L[i]; l.dmg=Math.max(0, Math.floor(Number(v)||0)); rcState(l); if(l.dmg&&l.qty===l.x.sent) l.reason='Damaged'; const rr=$('rr_'+i); if(rr) rr.value=l.reason; rcSum(); }
function rcSet(i, k, v){ S.rc.L[i][k]=v; rcSum(); }
function rcAdd(){ const sku=val('rc_add'); if(!sku) return toast('Choose the colour'); const p=S.boot.products.find(x=>x.sku===sku)||{};
  S.rc.L.push({sku, x:{sku, sent:0, img:p.img, colour:p.variant||p.name, name:p.name, batches:[]}, qty:1, dmg:0, reason:'Wrong item', note:'', st:'diff'}); rcRender(); }
function rcPicked(){ return S.rc.L.filter(l=>l.st); }
function rcSum(){
  const P=rcPicked(), mm=P.filter(l=>l.st==='diff'), el=$('rc_sum'); if(!el) return;
  el.innerHTML = !P.length ? '' : `<div class="${mm.length?'warnbox':'okbox'}">${P.length} colour(s) to receive · ${P.reduce((a,l)=>a+l.qty,0)} pcs${mm.length?'<br><b>Differences:</b> '+mm.map(l=>h(l.x.colour||l.sku)+' sent '+l.x.sent+' → '+l.qty+(l.dmg?' ('+l.dmg+' damaged)':'')+(l.reason?' · '+h(l.reason):' · <b>reason?</b>')).join('; '):' · all exactly as sent'}</div>`;
}
async function rcSend(p, summary){
  if(!confirm(summary)) return;
  const r=await submit('apiTransferReceive', Object.assign({trfNo:S.rc.id, submissionId:S.rc.sub}, p)); if(!r) return;
  S.inv.data=null; refreshInBackground();
  done(r, null, `<button class="btn gold" onclick="show('trf','${h(S.rc.id)}')">📄 Open ${h(S.rc.id)}</button><button class="btn sec" onclick="show('trfs','incoming')">🚚 Incoming challans</button>`);
}
function rcAll(){ const s=S.rc; rcSend({all:true}, 'Receive '+s.id+' exactly as sent?\n'+s.L.filter(l=>l.x.sent).map(l=>(l.x.colour||l.sku)+' '+l.x.sent).join(', ')); }
function rcSave(){
  const P=rcPicked(); if(!P.length) return toast('Tick ✓ or change at least one colour');
  const bad=P.find(l=>l.st==='diff'&&!l.reason); if(bad) return toast('Choose the reason for '+(bad.x.colour||bad.sku));
  if(P.some(l=>l.dmg>Math.min(l.qty,l.x.sent))) return toast('Damaged cannot be more than the pieces received');
  const mm=P.filter(l=>l.st==='diff');
  rcSend({lines:P.map(l=>({sku:l.sku, received:l.qty, damaged:l.dmg, reason:l.st==='diff'?l.reason:'', note:l.note}))},
    'Receive '+P.length+' colour(s) of '+S.rc.id+'?'+(mm.length?'\n\nDifferences (a manager will decide):\n'+mm.map(l=>(l.x.colour||l.sku)+': sent '+l.x.sent+', counted '+l.qty+(l.dmg?', '+l.dmg+' damaged':'')+' – '+l.reason).join('\n'):'\nAll exactly as sent.'));
}

/* ---- new transfer (send) or stock request */
screens.trfForm = function(mode){
  const W=(S.boot.warehouses||[]), mine=S.boot.myWarehouses||[], cw=S.boot.centralWarehouse||'';
  const other=c=>(W.find(w=>w.code!==c)||{}).code||'';
  let from, to;
  if(mode==='request'){ to=mine[0]||''; from=to===cw?other(cw):cw; } else { from=mine.indexOf(cw)>=0?cw:(mine[0]||cw); to=from===cw?other(cw):cw; }
  S.tff={mode, from, to, sub:uid(), lv:{}};
  const sel=(id,v,list,on)=>`<select id="${id}" onchange="${on}">${list.map(w=>`<option value="${h(w.code)}" ${w.code===v?'selected':''}>${h(w.code+' · '+w.name)}${w.isCentral?' ★':''}</option>`).join('')}</select>`;
  const fromList = mode==='request' ? W : W.filter(w=>mine.indexOf(w.code)>=0), toList = mode==='request' ? W.filter(w=>mine.indexOf(w.code)>=0) : W;
  page(mode==='request'?'Request stock':'New transfer challan', 'Inventory', `<div class="card"><div class="grid2"><div><label>From</label>${sel('tff_from',from,fromList,'S.tff.from=this.value;tffLevels()')}</div><div><label>To</label>${sel('tff_to',to,toList,'S.tff.to=this.value')}</div></div>
    <div class="hint">${mode==='request'?'The sending warehouse gets your request and dispatches it.':'The stock leaves now and shows "in transit" until the receiving store keeper counts and receives it.'} Only ${h(cw)} (central) ⇄ branch.</div>
    ${mode==='request'?'':'<label>Vehicle / carrier</label><input id="tff_veh" placeholder="optional">'}<label>Note</label><input id="tff_note" placeholder="optional"></div>
   <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Colours</h3><span class="muted" id="tff_cnt"></span></div>
    <input id="tff_q" placeholder="🔍 Search colour or SKU" oninput="tffFilter()" style="margin-top:8px"><div id="tff_lines"></div>
    <button class="btn" onclick="tffSubmit()">${mode==='request'?'📨 Send request':'🚚 Dispatch challan'}</button></div>`);
  tffLines(); tffLevels();
};
async function tffLevels(){ const s=S.tff; const r=await api('apiStock', {warehouse:s.from}); if(S.tff!==s || !r.ok) return; s.lv={}; r.rows.forEach(x=>s.lv[x.sku]=x); tffLines(true); }
function tffLines(keep){
  const s=S.tff, el=$('tff_lines'); if(!el) return; const old={};
  if(keep) document.querySelectorAll('#tff_lines input').forEach(i=>{ if(i.value!=='') old[i.dataset.sku]=i.value; });
  el.innerHTML=S.boot.products.map(p=>{ const l=s.lv[p.sku];
    return `<div class="sfl" data-s="${h((p.sku+' '+p.name+' '+(p.variant||'')).toLowerCase())}">${prodImg(p,'cim')}<div class="grow"><b>${h(p.variant||p.name)}</b><div class="hint">${h(p.sku)}${l?' · '+h(s.from)+': '+ivN(l.onHand)+' on hand, '+ivN(l.available)+' available':''}${l&&l.batches&&l.batches.length?'<br>FIFO: '+l.batches.slice(0,3).map(b=>h(b.batch)+' '+b.qty).join(', '):''}</div></div>
      <input type="number" inputmode="numeric" min="0" step="1" id="tq_${h(p.sku)}" data-sku="${h(p.sku)}" value="${h(old[p.sku]||'')}" placeholder="0" oninput="tffCount()"></div>`; }).join('');
  tffFilter(); tffCount();
}
function tffFilter(){ const q=val('tff_q').toLowerCase(); document.querySelectorAll('#tff_lines .sfl').forEach(x=>{ x.style.display = !q||x.dataset.s.indexOf(q)>=0 ? '' : 'none'; }); }
function tffCollect(){ const out=[]; document.querySelectorAll('#tff_lines input').forEach(i=>{ const n=Number(i.value); if(n) out.push({sku:i.dataset.sku, qty:n}); }); return out; }
function tffCount(){ const L=tffCollect(); document.querySelectorAll('#tff_lines .sfl').forEach(x=>x.classList.toggle('on', x.querySelector('input').value.trim()!=='')); const c=$('tff_cnt'); if(c) c.textContent=L.length?L.length+' colour(s) · '+L.reduce((a,x)=>a+x.qty,0)+' pcs':''; }
async function tffSubmit(){
  const s=S.tff, L=tffCollect(); s.from=val('tff_from'); s.to=val('tff_to');
  if(!L.length) return toast('Enter at least one quantity'); if(s.from===s.to) return toast('Choose two different warehouses');
  if(L.some(x=>!Number.isInteger(x.qty)||x.qty<0)) return toast('Use whole pieces only');
  if(s.mode!=='request'){ const over=L.find(x=>s.lv[x.sku]&&x.qty>s.lv[x.sku].onHand); if(over) return toast('Only '+s.lv[over.sku].onHand+' of '+over.sku+' on hand in '+s.from); }
  if(!confirm((s.mode==='request'?'Request ':'Dispatch ')+s.from+' → '+s.to+'\n'+L.map(x=>x.sku+' '+x.qty).join(', ')+'\nTotal '+L.reduce((a,x)=>a+x.qty,0)+' pcs')) return;
  const r=await submit('apiTransferCreate', {from:s.from, to:s.to, lines:L, note:val('tff_note'), vehicle:val('tff_veh'), request:s.mode==='request', submissionId:s.sub}); if(!r) return;
  S.inv.data=null; refreshInBackground();
  done(r, null, `<button class="btn gold" onclick="show('stkDoc','trf','${h(r.id)}')">🖨 Challan ${h(r.id)}</button><button class="btn sec" onclick="show('trfs','${s.mode==='request'?'requests':'outgoing'}')">🚚 Transfers</button>`);
}

const abcChip = c => c?`<span class="chip abc abc${h(c)}" title="ABC class by sales value">${h(c)}</span>`:'';

const CNT_ST={Counting:'c-info','Pending approval':'c-warn',Closed:'c-ok',Cancelled:''};
const CL_ST={Pending:'',Counted:'c-info',Skipped:'',Matched:'c-ok','Auto-posted':'c-ok','Needs approval':'c-warn',Approved:'c-ok',Rejected:'c-bad',Recount:'c-info'};
const PRQ_ST={Open:'c-warn','Partly received':'c-info',Received:'c-ok',Cancelled:''};
const icSt=(m,s)=>`<span class="chip ${m[s]||''}">${h(s)}</span>`;
const CNT_REASONS=['Miscount','Theft/Loss','Damage found','Unrecorded receipt','Other'];
const RTN_REASONS=['Wrong colour','Damaged in transit','Quality issue','Not sold/slow','Other'];
const SRC_LABEL={variance:'recent difference',never:'never counted','due-A':'A · due','due-B':'B · due','due-C':'C · due',manual:'added',recount:'recount'};
const icNum = v => v===null||v===undefined ? '–' : (Math.round(Number(v)*10)/10).toLocaleString('en-US');
const icPct = v => v===null||v===undefined ? '–' : (Math.round(Number(v)*100)/100)+' %';
function icWhTabs(cur, fn, all){
  const W=((S.boot&&S.boot.warehouses)||[]).filter(w=>w.type!=='Van');

}
function icGps(ms){ return new Promise(res=>{ if(!navigator.geolocation) return res(null); let fin=false; const t=setTimeout(()=>{ if(!fin){ fin=true; res(null); } }, ms);
  navigator.geolocation.getCurrentPosition(p=>{ if(fin) return; fin=true; clearTimeout(t); res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), accuracy:Math.round(p.coords.accuracy)}); },
    ()=>{ if(!fin){ fin=true; clearTimeout(t); res(null); } }, {enableHighAccuracy:true, timeout:ms, maximumAge:60000}); }); }
const icMonthEnd = m => new Date(Date.UTC(+m.slice(0,4), +m.slice(5,7), 0)).toISOString().slice(0,10);
function icGo(g){ if(!g||!g.s) return; if(g.s==='drill') return drill(g.a[0], g.a[1], g.a[2]); show(g.s, ...(g.a||[])); }

  const ok=x=>(s.st==='all'||(s.st==='attention'&&(x.status==='Out of stock'||x.status==='Below reorder'))||(s.st==='out'&&x.status==='Out of stock')||(s.st==='below'&&x.status==='Below reorder')||(s.st==='over'&&x.status==='Overstock')||(s.st==='ok'&&x.status==='OK'))

function ctStep(sku, dd){ const el=$('cq_'+sku); const v=Math.max(0,(Number(el.value)||0)+dd); el.value=v; S.ct.v[sku]=String(v); }

function ctKeep(){ S.ct.r.doc.lineRows.forEach((l,i)=>{ const el=$('cq_'+l.sku); if(el) S.ct.v[l.sku]=el.value; (l.batches||[]).forEach((b,j)=>{ const e=$('cb_'+i+'_'+j); if(e&&e.value!=='') b.counted=Number(e.value); }); }); }
function ctAdd(){ const sku=val('ct_add'); if(!sku) return toast('Choose the colour'); const p=S.boot.products.find(x=>x.sku===sku)||{};
  ctKeep(); S.ct.r.doc.lineRows.push({sku, name:p.name, colour:p.variant||p.name, img:p.img, abc:'', source:'manual', status:'Pending', counted:null, batches:[], snap:null, system:null, variance:null}); ctRender(); }
function ctCollect(){
  const out=[]; let err='';
  S.ct.r.doc.lineRows.forEach((l,i)=>{
    if(S.ct.bb[l.sku]){ const B=(l.batches||[]).map((b,j)=>({batch:b.batch, counted:val('cb_'+i+'_'+j)})); if(B.every(b=>b.counted==='')) return; if(B.some(b=>b.counted==='')) err='Count every batch of '+(l.colour||l.sku)+' (0 if none)'; out.push({sku:l.sku, batches:B.map(b=>({batch:b.batch, counted:Number(b.counted)||0}))}); return; }
    const v=val('cq_'+l.sku); if(v==='') return; if(!/^[0-9]+$/.test(v)) err='Counted quantity for '+(l.colour||l.sku)+' must be a whole number'; out.push({sku:l.sku, counted:Number(v)});
  });
  return err ? {err} : {lines:out};
}

async function loadOpenOrders(){
  const tid=val('co_t'); const box=$('co_orders'); if(!tid){ box.innerHTML=''; return; }
  box.innerHTML='<div class="hint">Loading open invoices…</div>';
  const r=await api('apiTailorOrders', tid);
  if(!r.ok){ box.innerHTML=`<div class="badbox">${h(r.message)}</div>`; return; }
  S.openOrders=r.orders;
  box.innerHTML = `<label>Apply to order</label>` + (r.orders.length? r.orders.map((o,i)=>`<div class="opt ${i===0?'on':''}" onclick="pickOrder('${o.orderId}')" id="oo_${o.orderId}">
      <input type="radio" name="co_o" value="${o.orderId}" ${i===0?'checked':''}><div class="grow"><div class="row"><b class="grow">${h(o.orderId)}</b><span class="amt">${money(o.available)}</span></div>
      <div class="hint">${h(o.date)} · due ${h(o.due)} · net ${money(o.net)} · paid ${money(o.confirmed)}${o.pending>0?' · '+money(o.pending)+' awaiting verification':''}
      ${o.daysOverdue>0?` · <b style="color:var(--bad)">${o.daysOverdue} days overdue</b>`:''}</div></div></div>`).join('') : '<div class="hint">No open invoices.</div>') +
    `<div class="opt ${r.orders.length?'':'on'}" onclick="pickOrder('')" id="oo_"><input type="radio" name="co_o" value="" ${r.orders.length?'':'checked'}><div><b>Advance / on-account payment</b><div class="hint">No specific order${r.advance>0?' · current advance '+money(r.advance):''}</div></div></div>`;
  if(r.orders.length) $('co_amt').value=Math.max(0,r.orders[0].available); else $('co_adv').checked=true;
  collHint();
}
function pickOrder(id){ document.querySelectorAll('input[name=co_o]').forEach(x=>{ x.checked = x.value===id; x.closest('.opt').classList.toggle('on', x.value===id); });
  const o=S.openOrders.find(x=>x.orderId===id); if(o) $('co_amt').value=Math.max(0,o.available); if(!id){ $('co_adv').checked=true; $('co_adv').parentNode.classList.add('on'); } collHint(); }
function selOrder(){ const x=document.querySelector('input[name=co_o]:checked'); return x?x.value:''; }
function collHint(){ const o=S.openOrders.find(x=>x.orderId===selOrder()), a=parseFloat(val('co_amt'))||0, el=$('co_hint'); if(!el) return;
  el.innerHTML = o && a>o.available+0.5 ? `<div class="warnbox">${money(a-o.available)} more than the open balance — tick "advance" to keep it as credit, or correct the amount.</div>` : ''; }
async function doCollect(){
  const tid=val('co_t'); if(!tid) return toast('Select a shop');
  const amt=parseFloat(val('co_amt')); if(!(amt>0)) return toast('Enter the amount received');
  const m=val('co_m'); if(m!=='Cash' && !val('co_ref')) return toast('Transaction reference is required for '+m);
  const g=needGps('co'); if(!g) return;
  const oid=selOrder(), t=tailorById(tid);
  if(!confirm(`Confirm collection\n${t.shop}\n${money(amt)} by ${m}\n${oid?'Against '+oid:'Advance / on-account'}`)) return;
  const q=await saveQueued('apiSubmitCollection', Object.assign({tailorId:tid,orderId:oid,amount:amt,method:m,txnRef:val('co_ref'),nextDate:val('co_next'),allowAdvance:$('co_adv').checked,proof:S.photos.proof||'',remarks:val('co_rem'),submissionId:uid()}, g), 'Payment · '+t.shop+' · '+money(amt), 'Recording payment…');
  if(!q) return; if(q.sync) return done(q.sync,'collect');
  done({message:'Payment of '+money(amt)+' ('+m+') from '+t.shop+' saved. It counts after Accounts verifies it.'}, 'collect', waitBox(q.it, resultBox));
}

// ---------------------------------------------------------------- report (calendar)
function rangeFor(p){
  const t=today(), y=+t.slice(0,4), m=+t.slice(5,7);
  const pad=n=>String(n).padStart(2,'0'), last=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();
  if(p==='today') return [t,t];
  if(p==='yesterday'){ const d=addDays(t,-1); return [d,d]; }
  if(p==='week'){ const dow=new Date(t+'T00:00:00Z').getUTCDay(); const back=(dow+1)%7; return [addDays(t,-back),t]; }
  if(p==='month') return [t.slice(0,8)+'01',t];
  if(p==='lastmonth'){ const yy=m===1?y-1:y, mm=m===1?12:m-1; return [`${yy}-${pad(mm)}-01`,`${yy}-${pad(mm)}-${pad(last(yy,mm))}`]; }
  if(p==='quarter'){ const qm=Math.floor((m-1)/3)*3+1; return [`${y}-${pad(qm)}-01`,t]; }
  if(p==='year') return [`${y}-01-01`,t];
  return [t,t];
}

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

    if(!S.mapObj || !document.body.contains(S.mapObj.getContainer())){ S.mapObj=L.map('map').setView([23.78,90.40],11); L.tileLayer('https:\/\/{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(S.mapObj); }

    r.people.forEach(p=>{ if(p.trail.length>1) S.mapLayers.push(L.polyline(p.trail,{color:'#1A473C',weight:2,dashArray:'4 6'}).addTo(S.mapObj));

    if(pts.length) S.mapObj.fitBounds(pts,{padding:[30,30],maxZoom:15});

function dlLine(l){ const q=S.dl.q[l.lineId]; return q===l.qty ? l.net : Math.round(l.net*q/l.qty*100)/100; }
function dlCalc(){
  const L=S.dl.doc.lines, B=S.dl.doc.balance; let u=0,U=0,b=0,n=0;
  L.forEach(l=>{ u+=S.dl.q[l.lineId]; U+=l.qty; b+=dlLine(l); n+=l.net; });
  b=Math.round(b); S.dl.billed=b;
  const short=u<U;
  $('dl_short').style.display=short?'block':'none';
  $('dl_sum').innerHTML=`<div class="row"><span>Delivered</span><b>${u} of ${U} pcs</b></div><div class="row"><span>Bill amount</span><b class="amt">${money(b)}</b></div>${short?`<div class="row" style="color:var(--bad)"><span>Not delivered — cancelled</span><b>${money(n-b)}</b></div>`:''}`;
  const pf=$('dl_payf'), pc=$('dl_paid'), a=$('dl_amt');
  if(pf&&pc){ pf.style.display=pc.checked&&b>0?'block':'none'; if(a && a.dataset.auto!=='0') a.value = b>0 ? Math.max(0, Math.round((b - B.adjustments - B.paid - B.pending)*100)/100) : ''; }
}
function dlClamp(id,v){ const l=S.dl.doc.lines.find(x=>x.lineId===id); v=parseInt(v,10); if(isNaN(v)||v<0) v=0; if(v>l.qty) v=l.qty; return v; }
function dlSet(id,v){ const c=dlClamp(id,v); S.dl.q[id]=c; if(String(c)!==String(v) && v!=='') $('dq_'+id).value=c; dlCalc(); }
function dlStep(id,d){ const c=dlClamp(id,S.dl.q[id]+d); S.dl.q[id]=c; $('dq_'+id).value=c; dlCalc(); }
function dlAll(full){ S.dl.doc.lines.forEach(l=>{ S.dl.q[l.lineId]=full?l.qty:0; $('dq_'+l.lineId).value=S.dl.q[l.lineId]; }); dlCalc(); }
async function doDeliver(){
  const d=S.dl, L=d.doc.lines, o=d.doc.order;

  const u=lines.reduce((a,x)=>a+x.qty,0), U=L.reduce((a,l)=>a+l.qty,0);
  if(u<U && !val('dl_reason')) return toast('Select why less was delivered');
  const g=needGps('dl'); if(!g) return;
  const p=Object.assign({orderId:o.id, lines, reason:val('dl_reason'), reasonNote:val('dl_rnote'), receivedBy:val('dl_rcv'), remarks:val('dl_rem'), photo:S.photos.dl||'', submissionId:uid()}, g);
  const pc=$('dl_paid');
  if(pc&&pc.checked&&d.billed>0){ const a=parseFloat(val('dl_amt'))||0; if(a>0){ if(val('dl_m')!=='Cash'&&!val('dl_ref')) return toast('Enter the transaction reference'); p.collect={amount:a, method:val('dl_m'), txnRef:val('dl_ref')}; } }
  if(!confirm(`Confirm delivery to ${d.doc.tailor.shop}\n${u} of ${U} pcs · bill ${money(d.billed)}${p.collect?'\nPayment received: '+money(p.collect.amount)+' ('+p.collect.method+')':''}${u<U?'\nItems not delivered will be cancelled.':''}`)) return;
  const q=await saveQueued('apiDeliver', p, 'Delivery · '+o.id+' · '+d.doc.tailor.shop, 'Saving delivery…'); if(!q) return;
  S.docs=S.docs||{}; delete S.docs[o.id];
  if(S.dv&&S.dv.data){ S.dv.data.open=S.dv.data.open.filter(x=>x.id!==o.id); }
  const docBtns=r=>r.ok?`${r.billed>0?`<button class="btn" onclick="show('doc','${h(o.id)}','invoice')">🧾 Final invoice — print / share</button>`:''}<button class="btn sec" onclick="show('doc','${h(o.id)}','challan')">📄 Challan</button>`:'';
  navReplace('_page', ['Delivered', o.id, '<div class="okbox">✅ Delivery saved: '+u+' of '+U+' pcs · bill '+money(d.billed)+'</div><button class="btn sec" onclick="history.back()">Back to deliveries</button>']);
  if(q.sync){ const r=q.sync; if(r.doc) S.docs[o.id]=Object.assign({_t:Date.now()}, r.doc);
    page('Delivered', o.id, `<div class="okbox">✅ ${h(r.message)}</div>${r.geoFlag&&r.geoFlag.indexOf('Outside')>=0?`<div class="warnbox">📍 ${h(r.geoFlag)}</div>`:''}${docBtns(r)}<button class="btn sec" onclick="history.back()">Back to deliveries</button>`);
    return refreshBoot(false); }
  page('Delivered', o.id, `<div class="okbox">✅ Delivery saved: ${u} of ${U} pcs · bill ${money(d.billed)}${p.collect?' · payment '+money(p.collect.amount)+' ('+h(p.collect.method)+')':''}.</div>
    ${waitBox(q.it, r=>resultBox(r)+docBtns(r))}<button class="btn sec" onclick="history.back()">Back to deliveries</button>`);
}

// ---------------------------------------------------------------- documents: invoice, challan, statement

screens.doc = async function(id, kind){

function renderDoc(){
  const d=S.doc, r=d.data, box=$('docBox'); if(!box) return;

function fitDoc(){ const w=$('docwrap'), el=$('doc'); if(!w||!el) return; el.style.zoom=''; const z=Math.min(1,(w.clientWidth-20)/el.offsetWidth); el.style.zoom = z<1 ? String(Math.floor(z*100)/100) : ''; }
window.addEventListener('resize', ()=>{ if(S.screen==='doc') fitDoc(); });

function docKind(k){ S.doc.kind=k; S.doc.pdf=null; const b=document.querySelector('header.top .brand'); if(b&&b.firstChild) b.firstChild.textContent=DOC_TITLES[k]; renderDoc(); }
function docHeightMm(){ const el=$('doc'), z=el.style.zoom; el.style.zoom=''; const mm=Math.ceil(el.offsetHeight/3.78)+6; el.style.zoom=z; return mm; }

function docFileName(){ const d=S.doc, r=d.data; if(d.kind==='stk') return d.id+'-'+d.fmt.toUpperCase()+'.pdf'; const base = d.kind==='ledger' ? 'Statement-'+r.tailor.id : (d.kind==='challan' ? 'Challan-'+r.order.id : (r.final ? r.order.invoiceNo : 'Draft-invoice-'+r.order.id)); return base+'-'+(d.fmt==='80'?'80mm':d.fmt.toUpperCase())+'.pdf'; }
async function sharePdf(){
  const d=S.doc, btn=$('pdfBtn'), name=docFileName();
  try{
    if(!d.pdf){
      btn.disabled=true; btn.textContent='⏳ Preparing PDF…';
      if(!window.html2pdf) await loadScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
      const el=$('doc'), f=d.fmt, z=el.style.zoom; el.style.zoom='';
      const format = f==='80' ? [80, docHeightMm()] : f;
      try{
        const blob = await window.html2pdf().set({ margin: f==='80'?2:(f==='a5'?6:8), filename:name, image:{type:'jpeg',quality:0.96}, html2canvas:{scale:2, backgroundColor:'#ffffff'}, jsPDF:{unit:'mm', format:format, orientation:'portrait'}, pagebreak:{mode:['css','legacy']} }).from(el).outputPdf('blob');
        d.pdf = new File([blob], name, {type:'application/pdf'});
      } finally { el.style.zoom=z; btn.disabled=false; }
    }
    const file=d.pdf;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:name}); btn.textContent='📤 Share PDF'; }
      catch(e){ btn.textContent = e&&e.name==='AbortError' ? '📤 Share PDF' : '📤 Tap again to share'; }
      return;
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    btn.textContent='⬇️ PDF downloaded'; toast('PDF saved: '+name);
  }catch(e){ btn.disabled=false; btn.textContent='📤 Share PDF'; toast('Could not create the PDF ('+((e&&e.message)||e)+'). Use Print ▸ Save as PDF instead.', 7000); }
}

// ---------------------------------------------------------------- charts (pure SVG, no internet needed)
const PAL=['#1A473C','#B8925A','#6E9C88','#3E5C76','#A8322A','#C7A97D','#4A4642','#8FB3A4','#9E9A93','#D08B4C'];
function shortN(v){ v=Number(v)||0; const a=Math.abs(v); if(a>=1e7) return (v/1e7).toFixed(a>=1e8?0:1)+' Cr'; if(a>=1e5) return (v/1e5).toFixed(a>=1e6?0:1)+' L'; if(a>=1e3) return Math.round(v/1e3)+'k'; return String(Math.round(v)); }
function pctS(x){ return x===null||x===undefined||!isFinite(x)?'—':Math.round(x*100)+'%'; }
function legend(items){ return `<div class="lg">${items.map(i=>`<span><i style="background:${i.color}"></i>${h(i.label)}</span>`).join('')}</div>`; }
function svgLine(labels, series, o){
  o=o||{}; const W=340,H=170,pl=40,pr=8,pt=10,pb=22,n=labels.length;
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>Number(v)||0)));
  const X=i=>pl+(n<=1?(W-pl-pr)/2:(W-pl-pr)*i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-(Number(v)||0)/max);
  let g=''; for(let i=0;i<=4;i++){ const v=max*i/4, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${pl-4}" y="${y+3}" text-anchor="end" font-size="9" fill="#888">${shortN(v)}</text>`; }
  const step=Math.max(1,Math.ceil(n/6)); let xl='';
  labels.forEach((l,i)=>{ if(i%step===0||i===n-1) xl+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#888">${h(l)}</text>`; });
  const paths=series.map(s=>{ const pts=s.values.map((v,i)=>X(i)+','+Y(v)).join(' ');
    return (o.area&&s===series[0]?`<polygon points="${X(0)},${Y(0)} ${pts} ${X(n-1)},${Y(0)}" fill="${s.color}" opacity=".10"/>`:'')+`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`+(n<=31?s.values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${o.click?3.4:2.2}" fill="${s.color}" ${o.click?`onclick="${o.click(i,s)}" style="cursor:pointer"`:''}><title>${h(labels[i])}: ${h(o.fmt?o.fmt(v):v)}</title></circle>`).join(''):''); }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="ch">${g}${paths}${xl}</svg>${legend(series.map(s=>({label:s.name,color:s.color})))}`;
}
function svgDonut(items, o){
  o=o||{}; items=items.filter(i=>Number(i.value)>0); const tot=items.reduce((a,i)=>a+Number(i.value),0);
  if(!tot) return `<div class="muted" style="text-align:center;padding:14px">No data</div>`;
  let off=0; const arcs=items.map((it,k)=>{ const p=Number(it.value)/tot*100, c=it.color||PAL[k%PAL.length]; const a=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${c}" stroke-width="7" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-off}" ${it.click?`onclick="${it.click}" style="cursor:pointer"`:''}><title>${h(it.label)}: ${h(o.fmt?o.fmt(it.value):it.value)} (${Math.round(p)}%)</title></circle>`; off+=p; return a; }).join('');
  return `<div class="dn"><svg viewBox="0 0 42 42" class="dnc">${arcs}<text x="21" y="20.5" text-anchor="middle" font-size="5" font-weight="700" fill="#282626">${h(o.center||shortN(tot))}</text><text x="21" y="26" text-anchor="middle" font-size="2.8" fill="#888">${h(o.sub||'total')}</text></svg>
    <div class="dnl">${items.map((it,k)=>`<div ${it.click?`class="tapr" onclick="${it.click}"`:''}><i style="background:${it.color||PAL[k%PAL.length]}"></i><span class="grow">${h(it.label)}</span><b>${h(o.fmt?o.fmt(it.value):it.value)}</b><span class="muted">&nbsp;${Math.round(Number(it.value)/tot*100)}%</span>${it.click?'<span class="chev">›</span>':''}</div>`).join('')}</div></div>`;
}
function hBars(items, o){
  o=o||{}; const max=Math.max(1,...items.map(i=>Math.max(Number(i.value)||0, Number(i.target)||0)));
  return `<div class="hb">${items.map((it,k)=>{ const w=(Number(it.value)||0)/max*100, t=it.target?(Number(it.target)/max*100):null;
    return `<div class="hbr ${it.click?'tapr':''}" ${it.click?`onclick="${it.click}"`:''}><div class="row"><span class="grow">${h(it.label)}</span><b>${h(o.fmt?o.fmt(it.value):it.value)}</b>${it.sub?`<span class="muted">&nbsp;${h(it.sub)}</span>`:''}${it.click?'<span class="chev">›</span>':''}</div>

function svgStack(labels, stacks){
  const W=340,H=150,pl=24,pr=4,pt=8,pb=20,n=labels.length; if(!n) return '<div class="muted">No working days yet</div>';
  const tot=labels.map((_,i)=>stacks.reduce((a,s)=>a+(Number(s.values[i])||0),0)), max=Math.max(1,...tot);
  const bw=(W-pl-pr)/n; let out='';
  for(let i=0;i<=2;i++){ const v=Math.round(max*i/2), y=pt+(H-pt-pb)*(1-v/max); out+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${pl-3}" y="${y+3}" text-anchor="end" font-size="8" fill="#888">${v}</text>`; }
  labels.forEach((l,i)=>{ let y=H-pb; stacks.forEach(s=>{ const v=Number(s.values[i])||0, hh=(H-pt-pb)*v/max; if(hh>0){ y-=hh; out+=`<rect x="${pl+i*bw+1}" y="${y}" width="${Math.max(1,bw-2)}" height="${hh}" fill="${s.color}"><title>${h(l)} · ${h(s.name)}: ${v}</title></rect>`; } });
    if(i%Math.max(1,Math.ceil(n/8))===0) out+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="8" fill="#888">${h(l)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="ch">${out}</svg>${legend(stacks.map(s=>({label:s.name,color:s.color})))}`;
}
function delta(cur, prev){ if(!prev) return ''; const d=(cur-prev)/Math.abs(prev); if(!isFinite(d)) return ''; return `<em class="${d>=0?'up':'dn2'}">${d>=0?'▲':'▼'} ${Math.abs(Math.round(d*100))}%</em>`; }

screens.drill = function(kind, q, title){
  q=Object.assign({}, q||{});
  if(!q.from||!q.to){ const r=(S.ex&&S.ex.from)?[S.ex.from,S.ex.to]:rangeFor('month'); q.from=q.from||r[0]; q.to=q.to||r[1]; }
  S.dr={kind, q, title:title||DR_TITLES[kind]||'Details', sort:(DR_SORTS[kind]||[[null]])[0][0], dir:-1, search:'', shown:120, data:null};
  if(kind==='shops'&&q.bucket) S.dr.sort='bucket'; else if(kind==='shops'&&(q.risk==='overdue'||q.risk==='High Risk')) S.dr.sort='overdue'; else if(kind==='shops'&&q.risk==='outstanding') S.dr.sort='outstanding';
  const sub = drFilterText(q);
  page(S.dr.title, sub, `<div class="card" style="padding:12px 14px"><div class="row"><div class="grow muted" id="dr_rng">${h(fmtD(q.from))}${q.from!==q.to?' – '+h(fmtD(q.to)):''}</div>
      <button class="btn sm sec" style="margin:0" onclick="drRange()">Change period</button></div><div id="dr_rp" style="display:none"></div></div>
    <div id="dr_st" class="dcst"></div><div id="dr_tot"></div>
    <div class="card"><input id="dr_q" placeholder="🔍 Search this list" oninput="S.dr.search=this.value.toLowerCase();S.dr.shown=120;drRender()">
      <div class="tabs" id="dr_sort" style="margin-top:10px">${(DR_SORTS[kind]||[]).filter(x=>x[0]!=='bucket'||q.bucket).map(x=>`<button class="${x[0]===S.dr.sort?'on':''}" onclick="drSort('${x[0]}',this)">${x[1]}</button>`).join('')}</div>
      <div id="dr_list"><div class="muted" style="text-align:center;padding:22px">Loading…</div></div></div>`);
  drLoad();
};
function drFilterText(q){ const p=[]; if(q.repName) p.push(q.repName); if(q.area) p.push(q.area); if(q.type) p.push(q.type); if(q.fabric) p.push(q.fabric); if(q.colour) p.push(q.colour); if(q.skuName) p.push(q.skuName); if(q.bucket) p.push(q.bucket); if(q.method) p.push(q.method); if(q.verification) p.push(q.verification); if(q.outcome) p.push(q.outcome); if(q.byName) p.push(q.byName); if(q.status&&q.status!=='outstanding') p.push({Submitted:'Waiting for approval',open:'Not yet delivered',pending:'Waiting for approval',Cancelled:'Cancelled',new:'Waiting for store review',hold:'On hold',packing:'In packing',ready:'Ready to pick',dispatched:'Out for delivery',cancelled:'Cancelled',storeConfirmed:'Confirmed by store'}[q.status]||q.status); if(q.fulfil) p.push({booked:'All booked',awaiting:'Waiting for approval',new:'Waiting for store review',onHold:'On hold',confirmedByStore:'Confirmed by store',packing:'Packing queue',ready:'Ready to pick',dispatched:'Out for delivery',delivered:'Delivered',cancelled:'Cancelled'}[q.fulfil]||q.fulfil); if(q.now) p.push('right now'); if(q.cancelKind) p.push({discount:'Discount rejected',store:'Cancelled by store',manager:'Rejected by manager',other:'Other'}[q.cancelKind]||q.cancelKind); if(q.holdDecision) p.push(q.holdDecision==='waiting'?'Waiting for manager':q.holdDecision); if(q.timing) p.push({newToConfirm:'New → confirmed',confirmToDispatch:'Confirmed → dispatched',dispatchToDeliver:'Dispatched → delivered'}[q.timing]||q.timing); if(q.holdAge) p.push({lt1d:'held under 1 day','1to3d':'held 1–3 days','3to7d':'held 3–7 days',gt7d:'held 7+ days'}[q.holdAge]||q.holdAge); if(q.holdReason) p.push(q.holdReason); if(q.cancelReason) p.push(q.cancelReason); if(q.risk) p.push({outstanding:'With dues',overdue:'Overdue','High Risk':'High risk',active:'Active',advance:'Advance held',sold:'Bought in period'}[q.risk]||q.risk); return p.join(' · ')||'Tap a row for details'; }
function drRange(){ const el=$('dr_rp'); if(el.style.display==='block'){ el.style.display='none'; return; }
  el.style.display='block'; el.innerHTML=`<div class="tabs" style="margin-top:10px">${EX_PRESETS.filter(p=>p[0]!=='custom').map(p=>`<button onclick="drPreset('${p[0]}')">${p[1]}</button>`).join('')}</div>
    <div class="grid2"><div><label>From</label><input type="date" id="dr_f" value="${S.dr.q.from}" max="${today()}"></div><div><label>To</label><input type="date" id="dr_t" value="${S.dr.q.to}" max="${today()}"></div></div><button class="btn sm" onclick="drPreset('custom')">Show</button>`; }
function drPreset(p){ const r=p==='custom'?[val('dr_f'),val('dr_t')]:rangeFor(p); if(!r[0]||!r[1]||r[0]>r[1]) return toast('Choose a valid date range'); S.dr.q.from=r[0]; S.dr.q.to=r[1]; navArgs(S.dr.kind,S.dr.q,S.dr.title); $('dr_rp').style.display='none'; $('dr_rng').textContent=fmtD(r[0])+(r[0]!==r[1]?' – '+fmtD(r[1]):''); drLoad(); }
function drSort(k, b){ if(S.dr.sort===k) S.dr.dir=-S.dr.dir; else { S.dr.sort=k; S.dr.dir=-1; } document.querySelectorAll('#dr_sort button').forEach(x=>x.classList.toggle('on', x===b)); drRender(); }
async function drLoad(){
  const d=S.dr, key='dr|'+d.kind+'|'+JSON.stringify(d.q), seq=d.seq=(d.seq||0)+1, c=dcGet(key);
  if(c){ d.data=c.data; drRender(); dcStatus('dr_st','loading',c.t); } else if($('dr_list')) $('dr_list').innerHTML='<div class="muted" style="text-align:center;padding:22px">Loading…</div>';
  const q=Object.assign({}, d.q); ['repName','skuName','byName'].forEach(k=>delete q[k]);
  const r=await api('apiDrill', d.kind, q);
  if(S.screen!=='drill' || S.dr!==d || seq!==d.seq){ if(r.ok) dcPut(key, r); return; }
  if(!r.ok){ if(c) return dcStatus('dr_st','fail',c.t); $('dr_list').innerHTML=`<div class="badbox">${h(r.message)}</div>`; return; }
  dcPut(key, r); d.data=r; drRender(); dcStatus('dr_st', c?'ok':'');
}
function drMore(){ S.dr.shown+=200; drRender(); }
function drSub(q2, title){ return dk(S.dr.kind==='discounts'?'discounts':'orders', Object.assign({from:S.dr.q.from,to:S.dr.q.to}, q2), title); }
function drRender(){
  const d=S.dr, r=d.data; if(!r||!$('dr_list')) return; S.clk=[];
  const k=d.kind, t=r.totals||{}, Q=d.q, rng={from:Q.from,to:Q.to};
  let rows=(r.rows||[]).slice();
  if(d.search) rows=rows.filter(x=>JSON.stringify(x).toLowerCase().indexOf(d.search)>=0);
  if(d.sort) rows.sort((a,b)=>{ const x=a[d.sort], y=b[d.sort]; return (x===y?0:(x===null||x===undefined?1:(y===null||y===undefined?-1:(x<y?-1:1))))*d.dir; });
  const box=(label,v)=>`<div><b>${v}</b><span>${label}</span></div>`;
  let tot='';
  if(k==='orders'||k==='deliveries') tot=box('Orders',t.count)+box(Q.sku||Q.colour||Q.fabric?'Pieces of this':'Pieces',(t.qty!==undefined?t.qty:'—'))+box(Q.status==='outstanding'?'Due':'Value',money(Q.status==='outstanding'?t.outstanding:t.amount))+(k==='orders'&&t.discount?box('Discount',money(t.discount)):'')+(k==='orders'&&t.avgH!==undefined&&t.avgH!==null?box('Average',t.avgH+' h'):'');
  else if(k==='collections'||k==='returns'||k==='expenses') tot=box('Entries',t.count)+box('Total',money(t.amount));
  else if(k==='shops'||k==='onboarded') tot=box('Shops',t.count)+(Q.bucket?box('In '+Q.bucket,money(t.bucket)):'')+box('Outstanding',money(t.outstanding))+box('Overdue',money(t.overdue))+box('Sales in period',money(t.sales));
  else if(k==='visits') tot=box('Visits',t.count)+box('Shops',t.shops)+box('Outside geofence',t.outside);
  else if(k==='products'||k==='colours'||k==='fabrics') tot=box(k==='fabrics'?'Fabrics':(k==='colours'?'Colours':'Products'),t.count)+box('Pieces',t.qty)+box('Sales',money(t.amount))+(t.notMoving?box('Not sold',t.notMoving):'');
  else if(k==='discounts'&&r.mode==='byRep') tot=box('Total discount',money(t.discount))+box('Avg per piece',money(t.avgPerPc))+box('Avg price / pc',money(t.avgPrice))+box('Approvals asked',t.asked+' · '+t.approved+' ✓ · '+t.rejected+' ✗'+(t.pending?' · '+t.pending+' waiting':''));
  else if(k==='areas') tot=box('Areas',t.count)+box('Sales',money(t.sales))+box('Outstanding',money(t.outstanding));
  else if(k==='grns') tot=box('Receipts',t.count)+box('Pieces',ivN(t.qty))+box('Value at cost',money(t.value));
  else if(k==='transfers') tot=box('Challans',t.count)+box('Pieces sent',ivN(t.sent))+box('In transit',ivN(t.pending))+box('Value',money(t.value));
  else if(k==='discrepancies') tot=box('Lines',t.count)+box('Open',t.open)+box('Short / excess',t.shortQty+' / '+t.excessQty)+box('Damaged',t.damaged)+box('Value',money(t.value));
  else if(k==='stock') tot=box('Colours',t.count)+box('On hand',ivN(t.onHand))+box('Value',money(t.value))+box('Low / out',t.low+' / '+t.out);
  else if(k==='reviews') tot=box('Reviewed',t.count)+box('Confirmed',t.confirmed)+box('Held',t.holds+(t.released?' · '+t.released+' released':''))+box('Cancelled',t.cancels)+box('Avg time',t.avgMin+' min');
  if(r.generic) tot=(r.boxes||[]).map(b=>box(h(b[0]),h(b[1]))).join('');
  $('dr_tot').innerHTML=`<div class="card"><div class="tot">${tot}</div>${r.cached?'':''}</div>`;
  const rp=(name,id)=>id?`<span class="lnk" onclick="event.stopPropagation();${pk(id)}">${h(name)}</span>`:h(name);
  const chipS=s=>s?statusChip(s):'';
  const one=x=>{
    if(r.generic) return icDrRow(x);
    if(k==='orders'||(k==='discounts'&&r.mode!=='byRep')) return `<div class="drow" onclick="${ck(()=>show('doc',x.id,'invoice'))}"><div class="grow"><b>${h(x.shop)}</b> <span class="chip">${h(x.type)}</span>${x.status==='Submitted'?' <span class="chip c-warn">Waiting approval</span>':''}${x.approval==='Rejected'?' <span class="chip c-bad">Discount rejected</span>':''}${x.delivery==='On Hold'&&x.status==='Confirmed'?` <span class="chip c-bad">On hold${x.holdReason?': '+h(x.holdReason):''}</span>${x.holdDecision==='Allowed'?' <span class="chip c-ok">Manager allowed</span>':' <span class="chip c-warn">Waiting for manager</span>'}`:x.delivery==='New'&&x.status==='Confirmed'?' <span class="chip c-info">Store review</span>':''}${x.status==='Cancelled'&&x.cancelKind&&x.cancelKind!=='other'?` <span class="chip c-bad">${h({discount:'Discount rejected',store:'Cancelled by store',manager:'Rejected by manager'}[x.cancelKind]||x.cancelKind)}</span>`:''}${x.status==='Cancelled'&&x.cancelReason?` <span class="chip c-bad">${h(x.cancelReason)}</span>`:''}${x.hours!==undefined&&x.hours!==null?` <span class="chip">${x.hours} h</span>`:''}
      <div class="hint">${h(x.id)} · ${h(fmtD(x.date))} · ${rp(x.rep,x.repId)} · ${x.qty} pcs${x.perPc?` · disc ${money(x.perPc)}/pc`:''}${x.delivery?' · '+h(dlvTxt(x)):''}${x.heldBy&&x.delivery==='On Hold'?' · held by '+h(x.heldBy)+(x.holdAgeH!==null&&x.holdAgeH!==undefined?' '+x.holdAgeH+' h ago':''):''}${x.cancelledBy?' · cancelled by '+h(x.cancelledBy):''}</div></div>
      <div class="r"><div class="amt">${money(Q.status==='outstanding'?x.outstanding:x.amount)}</div>${x.outstanding>0&&Q.status!=='outstanding'?`<div class="hint">due ${money(x.outstanding)}</div>`:''}${x.days>0?`<span class="chip c-bad">${x.days}d late</span>`:''}</div></div>`;
    if(k==='deliveries') return `<div class="drow" onclick="${ck(()=>show('doc',x.id,'invoice'))}"><div class="grow"><b>${h(x.shop)}</b> ${chipS(x.delivery==='Delivered'?'':x.delivery)}<div class="hint">${h(x.id)} · ${x.deliveryDate?h(fmtD(x.deliveryDate)):'ordered '+h(fmtD(x.date))} · ${rp(x.by||'Unassigned',x.byId)}${x.reason?' · '+h(x.reason):''}</div></div><div class="r"><div class="amt">${money(x.billed||x.amount)}</div><div class="hint">${x.billedQty||x.qty}/${x.ordered||x.qty} pcs</div></div></div>`;
    if(k==='collections') return `<div class="drow" onclick="${ck(()=>x.orderId?show('doc',x.orderId,'invoice'):show('shop',x.shopId))}"><div class="grow"><b>${h(x.shop)}</b> ${chipS(x.verification)}<div class="hint">${h(x.id)} · ${h(fmtD(x.date))} · ${h(x.method)} · by ${rp(x.by,x.byId)}${x.byRole==='Delivery'?' (rider)':''}${x.orderId?' · '+h(x.orderId):' · on account'}</div></div><div class="r amt">${money(x.amount)}</div></div>`;
    if(k==='returns') return `<div class="drow" onclick="${ck(()=>x.orderId?show('doc',x.orderId,'invoice'):show('shop',x.shopId))}">${x.img?`<img class="cim" loading="lazy" src="${h(x.img)}">`:''}<div class="grow"><b>${h(x.shop)}</b><div class="hint">${h(fmtD(x.date))} · ${h(x.type)} · ${h(x.product)}${x.qty?' × '+x.qty:''}${x.reason?' · '+h(x.reason):''}</div></div><div class="r amt">${money(x.amount)}</div></div>`;
    if(k==='shops'||k==='onboarded') return `<div class="drow" onclick="${ck(()=>show('shop',x.id))}"><div class="grow"><b>${h(x.shop)}</b> <span class="chip">${h(x.type)}</span> ${x.risk&&x.risk!=='OK'?chipS(x.risk):''}${k==='onboarded'?' '+chipS(x.status):''}
      <div class="hint">${h(x.area)} · ${rp(x.rep,x.repId)} · ${k==='onboarded'?'registered '+h(fmtD(x.regDate)):(x.lastVisit?'visited '+h(fmtD(x.lastVisit)):'not visited')}${x.days>0?' · '+x.days+' days late':''}</div></div>
      <div class="r">${Q.bucket?`<div class="amt">${money(x.bucket)}</div><div class="hint">of ${money(x.outstanding)}</div>`:(Q.risk==='overdue'||Q.risk==='High Risk')?`<div class="amt" style="color:var(--bad)">${money(x.overdue)}</div><div class="hint">of ${money(x.outstanding)}</div>`:Q.risk==='advance'?`<div class="amt">${money(x.advance)}</div>`:`<div class="amt">${money(Q.risk==='outstanding'?x.outstanding:x.sales)}</div><div class="hint">${Q.risk==='outstanding'?'sales '+money(x.sales):'due '+money(x.outstanding)}</div>`}</div></div>`;
    if(k==='visits') return `<div class="drow" onclick="${ck(()=>show('shop',x.shopId))}"><div class="grow"><b>${h(x.shop)}</b> <span class="chip ${x.geo==='Outside geofence'?'c-warn':''}">${h(x.purpose)}</span><div class="hint">${h(fmtD(x.date))} ${h(x.time)} · ${rp(x.rep,x.repId)} · ${h(x.outcome)}${x.geo==='Outside geofence'?' · ⚠ outside shop area':''}</div></div></div>`;
    if(k==='products'||k==='colours') return `<div class="drow" onclick="${drSub(k==='products'?{sku:x.sku,skuName:x.name}:{colour:x.key}, (x.colour||x.name)+' · orders')}">${x.img?`<img class="cim" loading="lazy" src="${h(x.img)}">`:''}<div class="grow"><b>${h(k==='colours'?x.key:(x.colour||x.name))}</b>${x.qty?'':' <span class="chip c-warn">Not sold</span>'}<div class="hint">${h(x.fabric||'')} · ${x.shopCount} shops · ${x.orders} orders${x.qty?' · avg '+money(x.avgPrice)+'/pc':''}</div></div><div class="r"><div class="amt">${x.qty} pcs</div><div class="hint">${money(x.amount)} · ${pctS(x.share)}</div></div></div>`;
    if(k==='fabrics') return `<div class="drow" onclick="${dk('colours',Object.assign({},rng,{fabric:x.key}),x.key+' · colours')}"><div class="grow"><b>${h(x.key)}</b><div class="hint">${x.shopCount} shops · ${x.orders} lines · avg ${money(x.avgPrice)}/pc</div></div><div class="r"><div class="amt">${x.qty} pcs</div><div class="hint">${money(x.amount)}</div></div></div>`;
    if(k==='discounts') return `<div class="drow" onclick="${dk('discounts',Object.assign({},rng,{rep:x.repId,repName:x.rep}),'Discounts · '+x.rep)}"><div class="grow"><b>${rp(x.rep,x.repId)}</b><div class="hint">${x.discOrders} of ${x.orders} orders discounted · ${x.pcs} pcs · avg price ${money(x.avgPrice)}/pc${x.asked?` · approvals ${x.approved}✓ ${x.rejected}✗${x.pending?' '+x.pending+' waiting':''}`:''}</div></div><div class="r"><div class="amt">${money(x.discount)}</div><div class="hint">${money(x.avgPerPc)}/pc · ${pctS(x.share)}</div></div></div>`;
    if(k==='areas') return `<div class="drow" onclick="${dk('shops',Object.assign({},rng,{area:x.area}),'Shops · '+x.area)}"><div class="grow"><b>${h(x.area)}</b><div class="hint">${h(x.district)} · ${x.shops} shops · ${x.orders} orders · collected ${money(x.collections)}</div></div><div class="r"><div class="amt">${money(x.sales)}</div><div class="hint">due ${money(x.outstanding)}</div></div></div>`;
    if(k==='grns') return `<div class="drow" onclick="${ck(()=>show('stkDoc','grn',x.id))}"><div class="grow"><b>${h(x.id)}</b><div class="hint">${h(fmtD(x.date))} · ${h(x.supplier)}${x.refNo?' · '+h(x.refNo):''} · ${x.lines} colour(s)</div></div><div class="r"><div class="amt">${ivN(x.qty)} pcs</div><div class="hint">${x.value?money(x.value):''}</div></div></div>`;
    if(k==='transfers') return trfRow(x).replace(`onclick="show('trf','${h(x.id)}')"`, `onclick="${ck(()=>show('trf',x.id))}"`);
    if(k==='discrepancies') return `<div class="drow" onclick="${ck(()=>show('trf',x.trf))}">${x.img?`<img class="cim" loading="lazy" src="${h(x.img)}">`:''}<div class="grow"><b>${h(x.colour||x.sku)}</b> ${x.open?'<span class="chip c-bad">Open</span>':`<span class="chip c-ok">${h(RES_LABEL[x.resolution]||'Damaged')}</span>`}<div class="hint">${h(x.trf)} · ${h(x.from)} → ${h(x.to)} · sent ${x.sent}, counted ${x.received}${x.damaged?' · '+x.damaged+' damaged':''}${x.reason?' · '+h(x.reason):''}</div></div><div class="r"><div class="amt">${money(x.value)}</div><div class="hint">${x.short?'short '+x.short:''}${x.excess?'excess '+x.excess:''}</div></div></div>`;
    if(k==='stock') return `<div class="drow" onclick="${ck(()=>show('stockLedger',x.sku,Q.warehouse||''))}">${x.img?`<img class="cim" loading="lazy" src="${h(x.img)}">`:''}<div class="grow"><b>${h(x.colour||x.name)}</b> ${ivChip(x)}<div class="hint">${h(x.sku)} · ${ivN(x.onHand)} on hand · ${ivN(x.reserved)} booked</div></div><div class="r"><div class="amt">${ivN(x.available)}</div><div class="hint">${money(x.value)}</div></div></div>`;
    if(k==='reviews') return `<div class="drow" onclick="${ck(()=>show('doc',x.id,'invoice'))}"><div class="grow"><b>${h(x.shop)}</b> <span class="chip ${x.result==='Confirmed'?'c-ok':x.result==='On Hold'?'c-warn':'c-bad'}">${h(x.result)}${x.holdDecision==='Allowed'?' → allowed':x.holdDecision==='Rejected'?' → rejected':''}</span><div class="hint">${h(x.id)} · ${h(x.reviewedAt)} · by ${rp(x.by,x.byId)} · rep ${rp(x.rep,x.repId)} · ${x.minutes} min after order${x.holdReason?' · '+h(x.holdReason):''}${x.cancelReason?' · '+h(x.cancelReason):''}${x.approvedBy?' · allowed by '+h(x.approvedBy):''}</div></div><div class="r amt">${money(x.amount)}</div></div>`;
    if(k==='expenses') return `<div class="drow" onclick="${pk(x.empId)}"><div class="grow"><b>${h(x.name)}</b> ${chipS(x.status)}<div class="hint">${h(fmtD(x.date))} · ${h(x.category)}${x.note?' · '+h(x.note):''}</div></div><div class="r amt">${money(x.amount)}</div></div>`;
    return '';
  };
  const list=rows.slice(0,d.shown).map(one).join('');
  $('dr_list').innerHTML = (list || `<div class="muted" style="text-align:center;padding:22px">Nothing here for this period.</div>`) + (rows.length>d.shown?`<button class="btn sec" onclick="drMore()">Show more (${rows.length-d.shown} left)</button>`:'') + (rows.length?`<div class="hint" style="text-align:center">${rows.length} row${rows.length>1?'s':''}${d.search?' match':''}</div>`:'');
}

// ---------------------------------------------------------------- staff profile
screens.staff = function(empId, from, to){
  S.sp={empId, from:from||(S.ex&&S.ex.from)||rangeFor('month')[0], to:to||(S.ex&&S.ex.to)||rangeFor('month')[1], data:null};
  page('Staff profile', empId, `<div class="card" style="padding:12px 14px"><div class="tabs" style="margin:0">${[['week','This week'],['month','This month'],['lastmonth','Last month'],['quarter','This quarter'],['year','This year']].map(p=>`<button onclick="spPreset('${p[0]}',this)">${p[1]}</button>`).join('')}</div><div class="muted" id="sp_rng" style="margin-top:8px"></div></div>
    <div id="sp_st" class="dcst"></div><div id="sp_out"><div class="card"><div class="muted" style="text-align:center;padding:24px">Loading profile…</div></div></div>`);
  spLoad();
};
function spPreset(p, b){ const r=rangeFor(p); S.sp.from=r[0]; S.sp.to=r[1]; navArgs(S.sp.empId,r[0],r[1]); document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); spLoad(); }
async function spLoad(){
  const d=S.sp, key='sp|'+d.empId+'|'+d.from+'|'+d.to, seq=d.seq=(d.seq||0)+1, c=dcGet(key);
  if($('sp_rng')) $('sp_rng').textContent=fmtD(d.from)+(d.from!==d.to?' – '+fmtD(d.to):'');
  if(c){ d.data=c.data; spRender(); dcStatus('sp_st','loading',c.t); }
  const r=await api('apiStaffProfile', d.empId, d.from, d.to);
  if(S.screen!=='staff'||S.sp!==d||seq!==d.seq){ if(r.ok) dcPut(key,r); return; }
  if(!r.ok){ if(c) return dcStatus('sp_st','fail',c.t); $('sp_out').innerHTML=`<div class="badbox">${h(r.message)}</div>`; return; }
  dcPut(key,r); d.data=r; spRender(); dcStatus('sp_st', c?'ok':'');
}
function spRender(){

      ${kp('Collected',money(r.delivery.collected),r.delivery.pendingCash?money(r.delivery.pendingCash)+' pending':'','',dk('collections',Object.assign({},rng,{rep:e.id,repName:e.name}),'Payments · '+e.name))}

      ${kp('Returned',r.delivery.returned,'','',dk('deliveries',Object.assign({},rng,{by:e.id,byName:e.name,outcome:'Returned'}),'Returned · '+e.name))}
    </div></div>`:''}
    ${r.canHr?`<div class="card"><h3>Attendance</h3><div class="grid4">${kp('Present',a.present+' / '+a.workingDays,pctS(a.rate))}${kp('Late',a.late)}${kp('Absent',a.absent)}${kp('On leave',a.onLeave)}</div>
