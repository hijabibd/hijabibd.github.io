<!DOCTYPE html>
<html>
<head><title>Hijabi.bd · Field Sales</title><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><link rel="manifest" href="manifest.json">
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#6B2D4A">
<style>
  :root{--p:#6B2D4A;--a:#C8A24A;--pd:#3d1729;--soft:#F6EEF1;--ink:#2b2b2b;--mut:#7a7a7a;--ok:#1E7B4F;--okb:#E3F4EA;--warn:#9A6700;--warnb:#FFF4DB;--bad:#B42318;--badb:#FDE7E5;--info:#1D4E89;--infob:#E8F0FB;--line:#eadfe4;--r:14px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#faf7f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif;font-size:15px}
  .wrap{max-width:720px;margin:0 auto;padding:0 0 90px}
  header.top{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  header.top .brand{font-weight:800;letter-spacing:.3px;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.top .brand small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
  header.top button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:14px}
  .pad{padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(80,20,40,.04)}
  .card h3{margin:0 0 10px;font-size:15px;color:var(--pd)}
  .muted{color:var(--mut);font-size:12.5px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1;min-width:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .kpi{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center}
  .kpi b{display:block;font-size:17px;color:var(--p)}
  .kpi.tap{cursor:pointer;border:1px solid transparent}.kpi.tap:active{border-color:var(--p)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px}.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;color:var(--pd)}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
  .kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;font-weight:600;font-size:13px;color:var(--pd);position:relative;cursor:pointer}
  .tile .ic{font-size:26px;display:block;margin-bottom:6px}
  .tile .bdg{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
  label{display:block;font-size:12.5px;font-weight:600;color:#5b4650;margin:10px 0 5px}
  label .req{color:var(--bad)}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dccdd4;border-radius:11px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
  textarea{min-height:70px;resize:vertical}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--p);color:#fff;margin-top:14px;cursor:pointer}
  .btn.sec{background:#fff;color:var(--p);border:1.5px solid var(--p)}
  .btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gold{background:var(--a);color:#2b1a00}
  .btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:6px 6px 0 0}
  .btn:disabled{opacity:.55}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:#eee;color:#555}
  .c-ok{background:var(--okb);color:var(--ok)}.c-warn{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}.c-info{background:var(--infob);color:var(--info)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chips label{margin:0;font-weight:600;padding:8px 12px;border:1px solid #dccdd4;border-radius:20px;background:#fff;font-size:13px}
  .chips input{display:none}
  .chips input:checked+span{color:var(--p)}
  .chips label.on{background:var(--soft);border-color:var(--p);color:var(--p)}
  .gps{border:1.5px dashed #d8c3cd;border-radius:12px;padding:11px;margin-top:12px;background:#fffdfd}
  .gps.ok{border-color:var(--ok);background:var(--okb)}
  .gps.bad{border-color:var(--bad);background:var(--badb)}
  .list .it{border-bottom:1px solid var(--line);padding:11px 2px;display:flex;gap:10px;align-items:center;cursor:pointer}
  .list .it:last-child{border-bottom:0}
  .amt{font-weight:800;color:var(--p);white-space:nowrap}
  .line{display:grid;grid-template-columns:1fr 84px 34px;gap:8px;align-items:end;margin-bottom:8px}
  .line .x{background:var(--badb);color:var(--bad);border:0;border-radius:10px;height:44px;font-size:18px}
  .sum{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px}
  .sum .row{justify-content:space-between;padding:3px 0}
  .opt{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .opt.on{border-color:var(--p);background:var(--soft)}
  .opt input{width:auto;margin-top:3px}
  .bar{height:8px;border-radius:6px;background:#eee;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--p)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:92%;z-index:99;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #busy{position:fixed;inset:0;background:rgba(255,255,255,.65);z-index:98;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:600;color:var(--p)}
  .spin{width:38px;height:38px;border:4px solid var(--soft);border-top-color:var(--p);border-radius:50%;animation:s 0.8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #map{height:62vh;border-radius:14px;border:1px solid var(--line)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:8px}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{text-align:left;background:var(--soft);color:var(--pd);padding:7px}
  table.t td{border-bottom:1px solid var(--line);padding:7px}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--p),var(--pd))}
  .login .card{width:100%;max-width:380px;padding:24px}
  .logo{font-size:28px;font-weight:900;color:var(--p);letter-spacing:.5px}
  .logo span{color:var(--a)}
  a{color:var(--p)}
  .hint{font-size:12px;color:var(--mut);margin-top:6px}
  .warnbox{background:var(--warnb);color:var(--warn);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:8px}
  .badbox{background:var(--badb);color:var(--bad);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:8px}
  .okbox{background:var(--okb);color:var(--ok);border-radius:10px;padding:12px;font-size:14px}
  .sect{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
  .dl{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .qty{display:flex;align-items:center;gap:4px}.qty input{width:62px;text-align:center;padding:9px 4px}.qty button{width:38px;height:42px;border:1px solid var(--line);background:var(--soft);border-radius:10px;font-size:20px;color:var(--p)}
  .docwrap{overflow:auto;background:#e9e4e6;border-radius:12px;padding:10px}
  .doc{background:#fff;color:#111;margin:0 auto;padding:12mm;font-size:12.5px;line-height:1.38;box-shadow:0 2px 12px rgba(0,0,0,.12);position:relative}
  .doc.f-a4{width:210mm;min-height:190mm}.doc.f-a5{width:148mm;font-size:11px;padding:8mm}.doc.f-80{width:76mm;font-size:10.5px;padding:3mm}
  .dh{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--p);padding-bottom:8px;margin-bottom:10px}
  .dn{font-size:20px;font-weight:900;color:var(--p)}.ds{font-size:.9em;color:#555}
  .dt{text-align:right}.dtt{font-size:16px;font-weight:800;letter-spacing:.5px;color:#222;margin-bottom:4px}
  .doc span{color:#666}
  .dp{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.dp>div:last-child{text-align:right}
  .dl2{font-size:.8em;text-transform:uppercase;color:#777;letter-spacing:.5px}.dmut{font-size:.85em;color:#777}
  .dtab{width:100%;border-collapse:collapse;margin:6px 0}.dtab th{background:#f3eef0;text-align:left;padding:5px;border-bottom:1px solid #bbb;font-size:.9em}.dtab td{padding:5px;border-bottom:1px solid #eee;vertical-align:top}.dtab .r{text-align:right;white-space:nowrap}.dtab .dsum td{font-weight:700;border-top:1px solid #999}
  .dtot{margin-left:auto;width:58%;min-width:200px}.dtot>div{display:flex;justify-content:space-between;padding:2px 0}.dgt{font-weight:800;font-size:1.1em;border-top:1px solid #333;margin-top:3px;padding-top:4px!important}.dgt span{color:#111}
  .dnote{font-size:.9em;color:#444;margin-top:8px}
  .dsig{display:flex;justify-content:space-between;gap:20px;margin-top:42px}.dsig div{flex:1;border-top:1px solid #333;padding-top:4px;text-align:center;font-size:.9em}
  .draft{position:absolute;top:3mm;left:0;right:0;text-align:center;color:#b42318;font-weight:800;font-size:.85em;letter-spacing:.5px}
  .dbox{display:inline-block;width:34px;height:16px;border:1px solid #888}
  .f-80 .dh,.f-80 .dp,.f-80 .dsig{flex-direction:column;gap:4px}.f-80 .dt,.f-80 .dp>div:last-child{text-align:left}.f-80 .dtot{width:100%;min-width:0}.f-80 .dn{font-size:15px}.f-80 .dtt{font-size:13px}.f-80 .dsig{margin-top:22px;gap:26px}.f-80 .dtab td,.f-80 .dtab th{padding:3px 2px}.f-80 .draft{position:static;margin-bottom:4px}.f-a5 .dn{font-size:17px}
  @media print{html,body{background:#fff}body *{visibility:hidden}#doc,#doc *{visibility:visible}#doc{position:absolute;left:0;top:0;box-shadow:none;margin:0;zoom:1!important;min-height:0}.doc.f-a4,.doc.f-a5{width:100%!important;padding:0}#toast,#busy{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="busy"><div class="spin"></div><div id="busyMsg">Working…</div></div>

<script>
const COMPANY = "Hijabi.bd";
const S = { token:null, user:null, boot:null, gps:{}, photos:{}, lines:[], openOrders:[], mapObj:null, mapLayers:[] };
const $ = id => document.getElementById(id);
const app = () => $('app');
const h = s => String(s===null||s===undefined?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '৳' + Math.round(Number(n)||0).toLocaleString('en-US');
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(36).slice(2));
const today = () => { const d=new Date(Date.now()+6*3600000); return d.toISOString().slice(0,10); };
const addDays = (k,n) => { const d=new Date(k+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
function store(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }

function toast(msg, ms){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms||3800); }
function busy(on,msg){ $('busy').style.display=on?'flex':'none'; $('busyMsg').textContent=msg||'Working…'; }




const API_URL = 'https:\/\/script.google.com/macros/s/AKfycbwDhiXG4g-6nIRy2WCUzurbGNs6Ci0Sv2kWDisZdva8aOUzWnZd4ElaOW6IvjQ2wXGYkg/exec';
const GAS = !!(window.google && google.script && google.script.run);
function done_(r, resolve){ if(r && r.code==='AUTH'){ toast(r.message); logout(true); } resolve(r||{ok:false,message:'No response from server'}); }
function call(fn, ...args){
  return new Promise(resolve=>{
    if(GAS){
      google.script.run
        .withSuccessHandler(r=>done_(r, resolve))
        .withFailureHandler(e=>resolve({ok:false,net:true,message:(e&&e.message)?e.message:String(e)}))[fn](...args);
      return;
    }
    const ac=(typeof AbortController!=='undefined')?new AbortController():null, tm=ac?setTimeout(()=>ac.abort(), 120000):null;
    fetch(API_URL, {method:'POST', credentials:'omit', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({fn, args}), signal:ac?ac.signal:undefined})
      .then(res=>res.json()).then(r=>{ clearTimeout(tm); done_(r, resolve); })
      .catch(e=>{ clearTimeout(tm); resolve({ok:false,net:true,message:'Network problem, check internet and try again ('+(e&&e.message?e.message:e)+')'}); });
  });
}
async function api(fn, ...args){ return call(fn, S.token, ...args); }


const screens = {};
function show(name, ...args){
  S.screen = name;
  if(name!=='home') history.pushState({s:name},'');
  window.scrollTo(0,0);
  screens[name](...args);
}
window.onpopstate = () => { if(S.user) screens.home(); };
function topbar(title, sub, back){
  return `<header class="top">${back?`<button onclick="history.back()">‹</button>`:''}
    <div class="brand">${h(title)}<small>${h(sub||'')}</small></div>${obBadge()}
    ${back?'':`<button onclick="show('profile')">👤</button>`}</header>`;
}
function page(title, sub, body){ app().innerHTML = `<div class="wrap">${topbar(title,sub,true)}<div class="pad">${body}</div></div>`; updOb(); }

// ---------------------------------------------------------------- login
screens.login = function(){
  app().innerHTML = `<div class="login"><div class="card">
    <div class="logo">${h(COMPANY.split('.')[0])}<span>${COMPANY.indexOf('.')>=0?'.'+h(COMPANY.split('.').slice(1).join('.')):''}</span></div>
    <div class="muted" style="margin-bottom:14px">Distribution Field Sales</div>
    <label>Employee ID</label><input id="lid" autocapitalize="characters" placeholder="EMP-101" value="${h(load('hbd_emp')||'')}">
    <label>PIN</label><input id="lpin" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
    <button class="btn" onclick="doLogin()">Log in</button>
    <div class="hint">Forgot your PIN? Ask your admin to reset it.</div></div></div>`;
  $('lpin').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
};
async function doLogin(){
  const id=$('lid').value.trim(), pin=$('lpin').value.trim();
  if(!id||!pin) return toast('Enter your Employee ID and PIN');
  busy(true,'Signing in…');
  const r = await call('apiLogin', id, pin);
  busy(false);
  if(!r.ok) return toast(r.message);
  S.token=r.token; S.user=r.user; store('hbd_tok', r.token); store('hbd_emp', id.toUpperCase());
  const c=cachedBoot(); if(c && c.user && c.user.empId===r.user.empId){ S.boot=c; S.screen='home'; screens.home(); refreshInBackground(); return; }
  await refreshBoot(true); screens.home();
}
function logout(silent){ const ub=obMine().length; if(!silent && ub && !confirm(ub+' saved item(s) are not yet on the server. They will be sent when you log in again on this phone. Log out anyway?')) return; if(!silent && S.token) call('apiLogout', S.token); S.token=null; S.user=null; S.boot=null; store('hbd_tok',null); store('hbd_boot',null); screens.login(); }

async function refreshBoot(showBusy){
  if(showBusy) busy(true,'Loading your workspace…');
  S.refreshing=true; updBadge();
  const r = await api('apiBootstrap');
  S.refreshing=false; updBadge();
  if(showBusy) busy(false);
  if(!r.ok){ if(r.code!=='AUTH') toast(r.message); return false; }
  S.boot=r; S.user=r.user; setTimeout(obRun, 300);
  try{ store('hbd_boot', JSON.stringify({t:Date.now(), empId:r.user.empId, today:r.today, boot:r})); }catch(e){}
  return true;
}
/** Show the last saved home screen instantly, then refresh it in the background. */
function cachedBoot(){ try{ const c=JSON.parse(load('hbd_boot')||'null'); if(c && c.boot && c.today===today() && Date.now()-c.t < 12*3600000) return c.boot; }catch(e){} return null; }
function updBadge(){ const b=$('syncDot'); if(b) b.style.visibility=S.refreshing?'visible':'hidden'; }
async function refreshInBackground(){
  const ok=await refreshBoot(false);
  if(ok && (S.screen==='home' || !S.screen)) screens.home();
}

// ---------------------------------------------------------------- home
screens.home = function(){
  const b=S.boot, u=S.user; if(!b) return; S.screen='home';
  const a=b.attendance, st=b.stats, m=b.month, P=b.perms, c=b.counts;
  const pct=(x,t)=> t? Math.min(100, Math.round(x/t*100)) : 0;
  const pctRaw=(x,t)=> t? Math.round(x/t*100) : 0;
  let att;
  if(!P.field && !P.delivery) att='';
  else if(!a || !a.checkIn) att=`<div class="card"><div class="row"><div class="grow"><b>Not checked in</b><div class="muted">${h(b.todayLabel)}</div></div>
      <button class="btn sm ok" onclick="show('checkin')">Check in</button></div></div>`;
  else if(!a.checkOut) att=`<div class="card"><div class="row"><div class="grow"><b>Checked in ${h(a.checkIn)}</b> ${a.late?'<span class="chip c-bad">LATE</span>':'<span class="chip c-ok">ON TIME</span>'}<div class="muted">${h(b.todayLabel)}</div></div>
      <button class="btn sm" onclick="show('checkout')">Check out</button></div></div>`;
  else att=`<div class="card"><b>Day complete</b> <span class="chip c-ok">${h(a.checkIn)} – ${h(a.checkOut)}</span><div class="muted">${h(b.todayLabel)}</div></div>`;
  const prog = m ? `<div class="card"><h3>This month</h3>
      ${[['Sales',m.sales,m.tSales,1],['Collections (verified)',m.collections,m.tCollection,1],['New tailors',m.onboarded,m.tNewTailors,0],['Shop visits',m.visits,m.tVisits,0]].map(x=>`
      <div style="margin-bottom:9px"><div class="row"><div class="grow muted">${x[0]}</div><b>${x[3]?money(x[1]):x[1]}</b><span class="muted">&nbsp;/ ${x[2]?(x[3]?money(x[2]):x[2]):'—'}</span>${x[2]?`<span class="chip ${pctRaw(x[1],x[2])>=100?'c-ok':pctRaw(x[1],x[2])>=50?'c-info':'c-warn'}" style="margin-left:6px">${pctRaw(x[1],x[2])}%</span>`:''}</div>
      <div class="bar"><i style="width:${pct(x[1],x[2])}%"></i></div></div>`).join('')}
      <div class="grid2" style="margin-top:6px"><div class="kpi"><b>${money(m.outstanding)}</b><span>My outstanding</span></div><div class="kpi"><b style="color:${m.overdue>0?'var(--bad)':'var(--ok)'}">${money(m.overdue)}</b><span>Overdue</span></div></div></div>` : '';
  const tiles = [];
  if(P.field){
    tiles.push(['🧵','Onboard tailor',"show('onboard')"],['🛒','New order',"show('order')"],['💵','Collect payment',"show('collect')"],
      ['📍','Field visit',"show('visit')"],['🏪','My tailors',"show('tailors')"],['⏰','Follow-ups',"show('followups')",b.followUps.length],['🧾','Expense',"show('expense')"]);
  }
  if(P.delivery) tiles.push(['🚚','My deliveries',"show('deliveries','open')",c.deliveries],['🧾','Expense',"show('expense')"]);
  tiles.push(['📊','My report',"show('report','month','summary')"]);
  if(!P.delivery) tiles.push(['🗺️','Map',"show('map')"]);
  const mg=[];
  if(P.approve) mg.push(['✅','Approvals',"show('approvals')",c.approvals]);
  if(P.verify) mg.push(['🔎','Verify payments',"show('verify')",c.verifications]);
  if(P.orders) mg.push(['🚚','Orders & delivery',"show('deliveries','open')",c.orders]);
  if(P.team) mg.push(['👥','Team today',"show('team')"]);
  const tileHtml = arr => `<div class="tiles">${arr.map(t=>`<div class="tile" onclick="${t[2]}"><span class="ic">${t[0]}</span>${t[1]}${t[3]?`<span class="bdg">${t[3]}</span>`:''}</div>`).join('')}</div>`;

function gpsBox(key){ return `<div class="gps" id="gps_${key}"><div class="row"><div class="grow" id="gpsTxt_${key}">📍 Location not captured yet</div>
  <button class="btn sm" onclick="captureGps('${key}')">Capture location</button></div>
  ${S.boot.settings.allowManualGps?`<div class="hint">Phone GPS not working? <a href="#" onclick="manualGps('${key}');return false">Enter coordinates manually</a> (flagged for review).</div><div id="gpsMan_${key}"></div>`:''}</div>`; }
function captureGps(key){
  const box=$('gps_'+key), txt=$('gpsTxt_'+key);
  if(!navigator.geolocation){ txt.textContent='This browser cannot access GPS.'; box.className='gps bad'; return; }
  txt.textContent='⏳ Getting your location… (allow the permission prompt)'; box.className='gps';
  navigator.geolocation.getCurrentPosition(p=>{
    S.gps[key]={lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), accuracy:Math.round(p.coords.accuracy), gpsMethod:'GPS'};
    box.className='gps ok';
    txt.innerHTML=`✅ ${S.gps[key].lat}, ${S.gps[key].lng} <span class="muted">(±${S.gps[key].accuracy} m)</span> · <a target="_blank" href="https:\/\/www.google.com/maps?q=${S.gps[key].lat},${S.gps[key].lng}">view</a>`;
    if(S.gps[key].accuracy>150) txt.innerHTML+='<div class="warnbox">Accuracy is low. Step outside / wait a few seconds and capture again.</div>';
  }, err=>{
    box.className='gps bad';
    txt.textContent = err.code===1 ? '⛔ Location permission denied. Enable location for this site in browser settings.' : '⚠ Could not get location ('+err.message+'). Try again outdoors.';
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:15000});
}
function manualGps(key){
  $('gpsMan_'+key).innerHTML = `<div class="grid2"><div><label>Latitude</label><input id="mlat_${key}" inputmode="decimal" placeholder="23.759012"></div>
    <div><label>Longitude</label><input id="mlng_${key}" inputmode="decimal" placeholder="90.358045"></div></div>
    <button class="btn sm sec" onclick="setManual('${key}')">Use these coordinates</button>`;
}
function setManual(key){
  const lat=parseFloat($('mlat_'+key).value), lng=parseFloat($('mlng_'+key).value);
  if(!(lat>20&&lat<27&&lng>87&&lng<93)) return toast('Coordinates must be inside Bangladesh');
  S.gps[key]={lat,lng,accuracy:'',gpsMethod:'Manual'}; $('gps_'+key).className='gps ok';
  $('gpsTxt_'+key).innerHTML=`✍️ Manual: ${lat}, ${lng} <span class="chip c-warn">flagged</span>`;
}
function needGps(key){ if(!S.gps[key]){ toast('Please capture your location first'); const el=$('gps_'+key); if(el) el.scrollIntoView({behavior:'smooth'}); return null; } return S.gps[key]; }


function photoBox(key, label){ return `<label>${h(label)}</label><input type="file" accept="image/*" capture="environment" onchange="pickPhoto('${key}',this)"><div class="hint" id="ph_${key}"></div>`; }
function pickPhoto(key, input){
  const f=input.files&&input.files[0]; if(!f) return;
  $('ph_'+key).textContent='Compressing…';
  compress(f).then(d=>{ S.photos[key]=d; $('ph_'+key).innerHTML='✅ Photo ready ('+Math.round(d.length*0.75/1024)+' KB)'; })
    .catch(()=>{ $('ph_'+key).textContent='Could not read photo'; });
}
function compress(file, max, q){
  max=max||1280; q=q||0.7;
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
    img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}

/* ---------------------------------------------------------------- unsent items (instant save, sent in the background)
   Orders, payments, visits, expenses and deliveries are saved on the phone at once and sent to the server in the
   background, in order, with automatic retry when the network is bad. The same submission ID is reused on every retry,
   so the server never records an item twice. Items the server refuses stay in "Unsent items" to fix or discard. */
const OB_FNS={apiSubmitOrder:'Order',apiSubmitCollection:'Payment',apiSubmitVisit:'Visit',apiSubmitExpense:'Expense',apiDeliver:'Delivery'};
S.ob=(function(){ try{ const q=JSON.parse(localStorage.getItem('hbd_outbox')||'[]'); q.forEach(x=>{ if(x.st==='sending') x.st='pending'; }); return Array.isArray(q)?q:[]; }catch(e){ return []; } })();
S.obWait={}; S.obSaved=true; S.obSent=false;
function obPersist(){ try{ localStorage.setItem('hbd_outbox', JSON.stringify(S.ob)); S.obSaved=true; }catch(e){ S.obSaved=false; } updOb(); }
function obMine(){ return S.user ? S.ob.filter(x=>x.emp===S.user.empId) : []; }
function obBadge(){ return `<span id="obBadge" class="chip" onclick="show('outbox')" style="display:none;cursor:pointer;margin-right:6px"></span>`; }
function updOb(){
  const m=obMine(), f=m.filter(x=>x.st==='failed').length, p=m.length-f;
  document.querySelectorAll('#obBadge').forEach(el=>{ el.style.display=m.length?'inline-block':'none'; el.className='chip '+(f?'c-bad':'c-info'); el.textContent=f?('⚠ '+f+(p?' · ⏳ '+p:'')):('⏳ '+p); });
}
function queueSubmit(fn, payload, label){
  if(!S.user) return null;
  const it={id:payload.submissionId||uid(), fn, p:payload, label:label||OB_FNS[fn]||fn, at:Date.now(), emp:S.user.empId, st:'pending', tries:0, err:''};
  payload.submissionId=it.id;
  S.ob.push(it); obPersist();
  if(!S.obSaved){ S.ob=S.ob.filter(x=>x!==it); updOb(); return null; }
  S.gps={}; S.photos={};
  setTimeout(obRun, 50); return it;
}
async function obRun(){
  if(S.obBusy || !S.token || !S.user) return; S.obBusy=true;
  try{
    for(;;){
      const it=obMine().find(x=>x.st==='pending'); if(!it) break;
      it.st='sending'; obPersist();
      const r=await call(it.fn, S.token, it.p);
      if(r && r.ok){ S.ob=S.ob.filter(x=>x!==it); obPersist(); obDone(it, r); continue; }
      if(!r || r.net || r.code==='AUTH'){ it.st='pending'; it.tries++; obPersist(); clearTimeout(S.obTimer); S.obTimer=setTimeout(obRun, Math.min(60000, 4000*it.tries)); break; }
      it.st='failed'; it.err=r.message||'Not saved'; obPersist(); obDone(it, r);
    }
  } finally { S.obBusy=false; }
  if(S.obSent && !obMine().some(x=>x.st!=='failed')){ S.obSent=false; refreshInBackground(); }
}
function obDone(it, r){
  if(r.ok){ S.obSent=true; if(r.doc && r.id){ S.docs=S.docs||{}; S.docs[r.id]=Object.assign({_t:Date.now()}, r.doc); } }
  const w=S.obWait[it.id]; delete S.obWait[it.id];
  if(w && document.getElementById('obw_'+it.id)) w(r);
  else if(r.ok) toast('✅ '+it.label+' saved on server');
  else toast('⛔ '+it.label+' NOT saved: '+r.message+' — open ⚠ Unsent items', 9000);
}
window.addEventListener('online', ()=>obRun());
const homeScreen_=screens.home; screens.home=function(){ homeScreen_.apply(this, arguments); updOb(); };
async function saveQueued(fn, p, label, busyMsg){
  const it=queueSubmit(fn, p, label);
  if(it) return {it};
  const r=await submit(fn, p, busyMsg);
  return r ? {sync:r} : null;
}
function waitBox(it, render){
  S.obWait[it.id]=r=>{ const el=$('obw_'+it.id); if(el) el.outerHTML=render(r); };
  return `<div id="obw_${it.id}" class="hint" style="margin-top:10px">⏳ Sending to the server in the background — you can carry on working.</div>`;
}
function resultBox(r){
  return r.ok ? `<div class="okbox" style="margin-top:10px">✅ On server: ${h(r.message)}</div>${r.geoFlag&&String(r.geoFlag).indexOf('Outside')>=0?`<div class="warnbox">📍 ${h(r.geoFlag)}</div>`:''}${r.warning?`<div class="warnbox">${h(r.warning)}</div>`:''}`
    : `<div class="badbox" style="margin-top:10px">⛔ Not saved: ${h(r.message)}</div><button class="btn sec" onclick="show('outbox')">Fix in Unsent items</button>`;
}
screens.outbox = function(){
  const m=obMine().slice().sort((a,b)=>a.at-b.at);
  const when=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  page('Unsent items', m.length? m.length+' on this phone' : 'All sent', m.length ? m.map(x=>`<div class="card"><div class="row"><div class="grow"><b>${h(x.label)}</b><div class="muted">${h(when(x.at))}${x.tries?' · tried '+x.tries+'×':''}</div></div>
      <span class="chip ${x.st==='failed'?'c-bad':'c-info'}">${x.st==='failed'?'NOT SAVED':(x.st==='sending'?'SENDING':'WAITING')}</span></div>
      ${x.st==='failed'?`<div class="badbox">${h(x.err)}</div><div class="grid2"><button class="btn sm" onclick="obRetry('${h(x.id)}')">Try again</button><button class="btn sm sec" onclick="obDiscard('${h(x.id)}')">Discard</button></div>`:''}</div>`).join('')
      + `<div class="hint">Waiting items are sent automatically as soon as the network allows. A refused item (for example credit limit or amount above the balance) must be discarded and entered again with the right details.</div>`
      : `<div class="okbox">✅ Everything saved on this phone has reached the server.</div>`);
  obRun();
};
function obRetry(id){ const x=S.ob.find(y=>y.id===id); if(x){ x.st='pending'; x.err=''; obPersist(); obRun(); setTimeout(()=>{ if(S.screen==='outbox') screens.outbox(); }, 400); } }
function obDiscard(id){ const x=S.ob.find(y=>y.id===id); if(!x || !confirm('Discard this '+x.label+'? It was NOT saved on the server.')) return; S.ob=S.ob.filter(y=>y!==x); obPersist(); screens.outbox(); }

function productOptions(sel){
  const P=S.boot.products, cats=[...new Set(P.map(p=>p.category))];
  return `<option value="">Select product</option>` + cats.map(c=>`<optgroup label="${h(c)}">${P.filter(p=>p.category===c).map(p=>`<option value="${h(p.sku)}" ${p.sku===sel?'selected':''}>${h(p.name)} · ${money(p.price)}</option>`).join('')}</optgroup>`).join('');
}
function renderLines(){
  $('or_lines').innerHTML = S.lines.map((l,i)=>{ const p=S.boot.products.find(x=>x.sku===l.sku);
    return `<div class="line"><div><select onchange="S.lines[${i}].sku=this.value;renderLines()">${productOptions(l.sku)}</select>${p?`<div class="hint">MOQ ${p.moq} · ${h(p.unit)} · MRP ${money(p.mrp)}</div>`:''}</div>
    <div><input type="number" inputmode="numeric" placeholder="Qty" value="${h(l.qty)}" oninput="S.lines[${i}].qty=this.value;calcOrder()"></div>
    <button class="x" onclick="S.lines.splice(${i},1);if(!S.lines.length)S.lines.push({sku:'',qty:''});renderLines()">×</button></div>`; }).join('');
  calcOrder();
}
function addLine(){ S.lines.push({sku:'',qty:''}); renderLines(); }
function orderTotals(){
  let gross=0, units=0; S.lines.forEach(l=>{ const p=S.boot.products.find(x=>x.sku===l.sku); const q=parseInt(l.qty)||0; if(p){ gross+=p.price*q; units+=q; } });
  const dv=parseFloat(val('or_dt')==='pct'?val('or_dv'):val('or_dv'))||0;
  const disc = val('or_dt')==='pct' ? Math.round(gross*dv)/100 : dv;
  return {gross, units, disc, net:gross-disc, maxDisc:gross*S.boot.settings.maxDiscount/100};
}
function calcOrder(){
  const t=orderTotals(), el=$('or_sum'); if(!el) return;
  el.innerHTML=`<div class="row"><span>Units</span><b>${t.units}</b></div><div class="row"><span>Gross</span><b>${money(t.gross)}</b></div>
    <div class="row"><span>Discount</span><b>− ${money(t.disc)}</b></div><div class="row" style="font-size:17px"><span>Net order amount</span><b class="amt">${money(t.net)}</b></div>
    ${t.disc>t.maxDisc+0.01?`<div class="badbox">Discount above the ${S.boot.settings.maxDiscount}% limit (${money(t.maxDisc)}).</div>`:''}`;
  orderTailorInfo();
}
function setDue(){ const m=(val('or_terms').match(/(\d+)/)||[0,0])[1]; $('or_due').value=addDays(today(), Number(m)); $('or_due').min=today(); }
function orderTailorInfo(){
  const t=tailorById(val('or_t')), el=$('or_tinfo'); if(!el) return;
  if(!t){ el.innerHTML=''; return; }
  const net=orderTotals().net;
  let w='';
  if(t.overdue>0) w+=`<div class="badbox">Overdue ${money(t.overdue)} (max ${t.maxDays} days). Collect before giving more credit.</div>`;
  if(t.creditLimit>0 && t.outstanding+net>t.creditLimit) w+=`<div class="warnbox">Credit limit ${money(t.creditLimit)} would be exceeded (outstanding ${money(t.outstanding)} + this order).</div>`;
  el.innerHTML=`<div class="hint">${h(t.owner)} · ${h(t.mobile)} · Outstanding <b>${money(t.outstanding)}</b>${t.advance>0?' · Advance '+money(t.advance):''}</div>${w}`;
}
async function doOrder(){
  const tid=val('or_t'); if(!tid) return toast('Select a tailor');
  const lines=S.lines.filter(l=>l.sku && parseInt(l.qty)>0).map(l=>({sku:l.sku, qty:parseInt(l.qty)}));
  if(!lines.length) return toast('Add at least one product with quantity');
  for(const l of lines){ const p=S.boot.products.find(x=>x.sku===l.sku); if(l.qty<p.moq) return toast(p.name+': minimum '+p.moq); }
  const t=orderTotals(); if(t.disc>t.maxDisc+0.01) return toast('Discount exceeds the allowed limit');
  const g=needGps('or'); if(!g) return;
  const tl=tailorById(tid);
  if(!confirm(`Confirm order for ${tl.shop}\n${lines.length} product(s), ${t.units} units\nNet: ${money(t.net)}\nTerms: ${val('or_terms')} · due ${val('or_due')}`)) return;
  const q=await saveQueued('apiSubmitOrder', Object.assign({tailorId:tid,lines,discountType:val('or_dt'),discountValue:val('or_dv'),paymentTerms:val('or_terms'),expectedPayDate:val('or_due'),remarks:val('or_rem'),submissionId:uid()}, g), 'Order · '+tl.shop+' · '+money(t.net), 'Saving order…');
  if(!q) return;
  const inv=r=>r.ok?`<button class="btn gold" onclick="show('doc','${h(r.id)}','invoice')">🧾 Draft invoice — print / share</button>`:'';
  if(q.sync){ const r=q.sync; if(r.doc){ S.docs=S.docs||{}; S.docs[r.id]=Object.assign({_t:Date.now()}, r.doc); } return done(r,'order', inv(r)); }
  done({message:'Order for '+tl.shop+' saved: '+lines.length+' product(s), '+t.units+' units, '+money(t.net)+'.'}, 'order', waitBox(q.it, r=>resultBox(r)+inv(r)));
}

function pickOrder(id){ document.querySelectorAll('input[name=co_o]').forEach(x=>{ x.checked = x.value===id; x.closest('.opt').classList.toggle('on', x.value===id); });

function collHint(){ const o=S.openOrders.find(x=>x.orderId===selOrder()), a=parseFloat(val('co_amt'))||0, el=$('co_hint'); if(!el) return;
  el.innerHTML = o && a>o.available+0.5 ? `<div class="warnbox">${money(a-o.available)} more than the open balance — tick "advance" to keep it as credit, or correct the amount.</div>` : ''; }

  const q=await saveQueued('apiSubmitCollection', Object.assign({tailorId:tid,orderId:oid,amount:amt,method:m,txnRef:val('co_ref'),nextDate:val('co_next'),allowAdvance:$('co_adv').checked,proof:S.photos.proof||'',remarks:val('co_rem'),submissionId:uid()}, g), 'Payment · '+t.shop+' · '+money(amt), 'Recording payment…');

// ---------------------------------------------------------------- report (calendar)
function rangeFor(p){
  const t=today(), y=+t.slice(0,4), m=+t.slice(5,7);
  const pad=n=>String(n).padStart(2,'0'), last=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();
  if(p==='today') return [t,t];
  if(p==='yesterday'){ const d=addDays(t,-1); return [d,d]; }
  if(p==='week'){ const dow=new Date(t+'T00:00:00Z').getUTCDay(); const back=(dow+1)%7; return [addDays(t,-back),t]; }
  if(p==='month') return [t.slice(0,8)+'01',t];
  if(p==='lastmonth'){ const yy=m===1?y-1:y, mm=m===1?12:m-1; return [`${yy}-${pad(mm)}-01`,`${yy}-${pad(mm)}-${pad(last(yy,mm))}`]; }
  if(p==='quarter'){ const qm=Math.floor((m-1)/3)*3+1; return [`${y}-${pad(qm)}-01`,t]; }
  if(p==='year') return [`${y}-01-01`,t];
  return [t,t];
}
const PRESETS=[['today','Today'],['yesterday','Yesterday'],['week','This week'],['month','This month'],['lastmonth','Last month'],['quarter','This quarter'],['year','This year'],['custom','Custom']];

    <div class="tabs">${tabs.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="rpTab('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
  const empty=msg=>`<div class="muted" style="text-align:center;padding:16px">${msg}</div>`;
  let body='';
  if(tab==='summary'){

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function loadCss(href){ const l=document.createElement('link'); l.rel='stylesheet'; l.href=href; document.head.appendChild(l); }
async function ensureMapLib(){
  const st=S.boot.settings;
  if(st.mapProvider==='GOOGLE' && st.mapsKey){ if(!window.google||!window.google.maps) await loadScript('https:\/\/maps.googleapis.com/maps/api/js?key='+encodeURIComponent(st.mapsKey)); return 'google'; }
  if(!window.L){ loadCss('https:\/\/unpkg.com/leaflet@1.9.4/dist/leaflet.css'); await loadScript('https:\/\/unpkg.com/leaflet@1.9.4/dist/leaflet.js'); }
  return 'leaflet';
}
async function loadMap(first){
  const f={repId:val('mp_rep'),district:val('mp_dist'),status:val('mp_st'),date:val('mp_date'),staleOnly:$('mp_stale_l').classList.contains('on'),overdueOnly:$('mp_od_l').classList.contains('on')};
  busy(true,'Loading map…');
  const r=await api('apiMapData', f);
  let lib; try{ lib=await ensureMapLib(); }catch(e){ busy(false); return toast('Map library could not load. Check internet.'); }
  busy(false);
  if(!r.ok) return toast(r.message);
  if(first){ $('mp_rep').innerHTML='<option value="">All</option>'+r.reps.map(x=>`<option value="${h(x.id)}">${h(x.name)}</option>`).join(''); $('mp_dist').innerHTML='<option value="">All</option>'+r.districts.map(d=>`<option>${h(d)}</option>`).join(''); }
  const col={Approved:'#1E7B4F',Interested:'#3E7CB1',Prospect:'#9E9E9E',Rejected:'#B42318'};
  const pts=[];
  const popup=s=>`<b>${h(s.shop)}</b><br>${h(s.id)} · ${h(s.status)}<br>${h(s.owner)} · <a href="tel:${h(s.mobile)}">${h(s.mobile)}</a><br>Rep: ${h(s.repName)}<br>Outstanding ${money(s.outstanding)}${s.overdue>0?' · <b style="color:#B42318">overdue '+money(s.overdue)+'</b>':''}<br>Last visit: ${s.lastVisit||'never'}<br><a target="_blank" href="https:\/\/www.google.com/maps?q=${s.lat},${s.lng}">Open in Google Maps</a> · <a target="_blank" href="https:\/\/www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">Directions</a>`;
  if(lib==='leaflet'){
    if(!S.mapObj || !document.body.contains(S.mapObj.getContainer())){ S.mapObj=L.map('map').setView([23.78,90.40],11); L.tileLayer('https:\/\/{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(S.mapObj); }
    S.mapLayers.forEach(l=>S.mapObj.removeLayer(l)); S.mapLayers=[];
    r.shops.forEach(s=>{ const m=L.circleMarker([s.lat,s.lng],{radius:8,color:s.stale?'#E07B00':'#ffffff',weight:s.stale?4:2,fillColor:s.overdue>0?'#C8A24A':(col[s.status]||'#777'),fillOpacity:.95}).bindPopup(popup(s)).addTo(S.mapObj); S.mapLayers.push(m); pts.push([s.lat,s.lng]); });
    r.people.forEach(p=>{ if(p.trail.length>1) S.mapLayers.push(L.polyline(p.trail,{color:'#6B2D4A',weight:2,dashArray:'4 6'}).addTo(S.mapObj));
      const mk=(pt,sym)=>L.marker([pt.lat,pt.lng],{icon:L.divIcon({className:'',html:`<div style="font-size:18px;color:#6B2D4A;text-shadow:0 0 3px #fff">${sym}</div>`})}).bindPopup(`<b>${h(p.name)}</b><br>${sym==='▲'?'First':'Last'} report ${h(pt.time)} · ${h(pt.label)}<br>${p.events} location events`).addTo(S.mapObj);
      S.mapLayers.push(mk(p.first,'▲')); S.mapLayers.push(mk(p.last,'■')); pts.push([p.first.lat,p.first.lng],[p.last.lat,p.last.lng]); });
    if(pts.length) S.mapObj.fitBounds(pts,{padding:[30,30],maxZoom:15});
    setTimeout(()=>S.mapObj.invalidateSize(),200);
  } else {
    if(!S.mapObj || !document.body.contains(S.mapObj.getDiv())){ S.mapObj=new google.maps.Map($('map'),{center:{lat:23.78,lng:90.40},zoom:11,mapTypeControl:false}); S.iw=new google.maps.InfoWindow(); }
    S.mapLayers.forEach(l=>l.setMap(null)); S.mapLayers=[]; const bounds=new google.maps.LatLngBounds();
    r.shops.forEach(s=>{ const m=new google.maps.Marker({position:{lat:s.lat,lng:s.lng},map:S.mapObj,icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:s.overdue>0?'#C8A24A':(col[s.status]||'#777'),fillOpacity:.95,strokeColor:s.stale?'#E07B00':'#fff',strokeWeight:s.stale?4:2}});
      m.addListener('click',()=>{S.iw.setContent(popup(s));S.iw.open(S.mapObj,m);}); S.mapLayers.push(m); bounds.extend(m.getPosition()); });
    r.people.forEach(p=>{ if(p.trail.length>1) S.mapLayers.push(new google.maps.Polyline({path:p.trail.map(x=>({lat:x[0],lng:x[1]})),map:S.mapObj,strokeColor:'#6B2D4A',strokeWeight:2}));
      [[p.first,'▲','First'],[p.last,'■','Last']].forEach(([pt,sym,lab])=>{ const m=new google.maps.Marker({position:{lat:pt.lat,lng:pt.lng},map:S.mapObj,label:{text:sym,color:'#6B2D4A'}});
        m.addListener('click',()=>{S.iw.setContent(`<b>${h(p.name)}</b><br>${lab} report ${h(pt.time)} · ${h(pt.label)}`);S.iw.open(S.mapObj,m);}); S.mapLayers.push(m); bounds.extend(m.getPosition()); }); });
    if(!bounds.isEmpty()) S.mapObj.fitBounds(bounds);
  }
  $('mp_sum').innerHTML=`${r.shops.length} shops shown · ${r.shops.filter(s=>s.stale).length} not visited in ${r.staleDays}+ days · ${r.people.length} team members reported location on ${h(r.date)}`;
}

  }

  const staffSel = o => `<select onchange="assignDel('${h(o.id)}',this.value)"><option value="">— Not assigned —</option>${r.staff.map(p=>`<option value="${h(p.id)}" ${o.deliveryBy===p.id?'selected':''}>${h(p.name)}</option>`).join('')}</select>`;
  let list='';
  if(S.dv.tab==='open') list = open.length ? open.map(o=>`<div class="card" id="dv_${h(o.id)}"><div class="row"><div class="grow"><b>${h(o.shop)}</b> ${delChip(o.delivery)}
      <div class="hint">${h(o.id)} · ${h(o.date)}${o.age>0?' ('+o.age+' d ago)':''} · ${o.qty} pcs · ${h(o.terms)}</div>
      <div class="muted">${h(o.address||'')}${o.address?' · ':''}${h(o.area)}</div>
      <div class="hint">${h(o.owner)} · Rep ${h(o.rep)}${mg?' · '+(o.deliveryName?'🚚 '+h(o.deliveryName):'<b style="color:var(--bad)">not assigned</b>'):''}</div></div><div class="amt">${money(o.net)}</div></div>
      ${mg?`<label>Delivery person</label>${staffSel(o)}`:''}
      <div>${o.mobile?`<a class="btn sm sec" href="tel:${h(o.mobile)}">📞 Call</a>`:''}${navLink(o.lat,o.lng)}<button class="btn sm sec" onclick="show('doc','${h(o.id)}','challan')">📄 Challan</button><button class="btn sm sec" onclick="show('doc','${h(o.id)}','invoice')">🧾 Invoice</button>${o.delivery==='Pending'?`<button class="btn sm sec" onclick="dispatchDel('${h(o.id)}')">🚚 Out for delivery</button>`:''}<button class="btn sm ok" onclick="show('deliver','${h(o.id)}')">✅ Deliver</button></div></div>`).join('') : '<div class="okbox">Nothing waiting for delivery. 🎉</div>';
  else if(S.dv.tab==='done') list = done.length ? `<div class="card list">${done.map(o=>`<div class="it" onclick="show('doc','${h(o.id)}','invoice')"><div class="grow"><b>${h(o.shop)}</b> ${delChip(o.delivery)}<div class="muted">${h(o.invoiceNo||o.id)} · ${h(o.deliveredAt||o.date)} · ${o.billedQty===null?o.qty:o.billedQty}/${o.qty} pcs${mg&&o.deliveryName?' · '+h(o.deliveryName):''}</div>${o.shortReason?`<div class="hint">⚠ ${h(o.shortReason)}</div>`:''}</div><div style="text-align:right"><div class="amt">${money(o.billed===null?o.net:o.billed)}</div>${o.billed!==null&&o.billed<o.net?`<div class="hint"><s>${money(o.net)}</s></div>`:''}</div></div>`).join('')}</div>` : '<div class="hint">No deliveries in the last 7 days.</div>';
  else list = r.submitted.length ? r.submitted.map(o=>`<div class="card" id="dv_${h(o.id)}"><div class="row"><div class="grow"><b>${h(o.shop)}</b><div class="hint">${h(o.id)} · ${h(o.date)} · ${h(o.rep)} · ${h(o.area)} · ${h(o.terms)} · ${o.qty} pcs</div></div><div class="amt">${money(o.net)}</div></div>
      <div><button class="btn sm sec" onclick="show('doc','${h(o.id)}','invoice')">🧾 View</button><button class="btn sm ok" onclick="setOrderStatus('${h(o.id)}','Confirmed')">Confirm</button><button class="btn sm bad" onclick="setOrderStatus('${h(o.id)}','Cancelled')">Cancel</button></div></div>`).join('') : '<div class="okbox">No orders waiting for confirmation.</div>';
  box.innerHTML = head + list;
}
async function assignDel(id, emp){
  busy(true,'Assigning…'); const r=await api('apiAssignDelivery', id, emp); busy(false);
  toast(r.ok?'✅ '+r.message:'⛔ '+r.message);
  if(r.ok){ const o=S.dv.data.open.find(x=>x.id===id); if(o){ o.deliveryBy=emp; const p=S.dv.data.staff.find(x=>x.id===emp); o.deliveryName=p?p.name:''; } }
}
async function dispatchDel(id){ busy(true); const r=await api('apiDispatch', id); busy(false); toast(r.ok?'🚚 '+r.message:'⛔ '+r.message); if(r.ok){ const o=S.dv.data.open.find(x=>x.id===id); if(o) o.delivery='Dispatched'; renderDeliveries(); } }
async function setOrderStatus(id, st){

  busy(true,'Updating…'); const r=await api('apiUpdateOrder', id, ch); busy(false);

// ---------------------------------------------------------------- deliver (per-product quantities)
screens.deliver = async function(id){
  page('Deliver', id, `<div id="dlBox" class="hint">Loading…</div>`);
  const r=await getDoc(id); if(!r.ok) return $('dlBox').innerHTML=`<div class="badbox">${h(r.message)}</div>`;
  if(r.order.closed) return $('dlBox').innerHTML=`<div class="okbox">This order is already ${h(r.order.delivery)}.</div><button class="btn" onclick="show('doc','${h(id)}','invoice')">Open invoice</button>`;
  S.dl={doc:r, q:{}}; r.lines.forEach(l=>S.dl.q[l.lineId]=l.qty);
  const dd=S.dv&&S.dv.data, canCollect = dd ? dd.canCollect : true;
  const reasons = (dd&&dd.reasons) || ['Out of stock','Customer asked for less','Damaged in transit','Wrong item packed','Customer refused','Shop closed','Other'];
  const t=r.tailor, o=r.order, cod=/Cash on Delivery/i.test(o.terms);
  $('dlBox').innerHTML=`<div class="card"><b>${h(t.shop)}</b><div class="muted">${h(t.owner)} · ${h(t.mobile)}<br>${h(t.address)} ${h(t.area)}</div>
     <div class="hint">${h(o.id)} · ${h(o.date)} · ${h(o.terms)} · Rep ${h(o.rep)}</div>
     <div>${t.mobile?`<a class="btn sm sec" href="tel:${h(t.mobile)}">📞 Call</a>`:''}${navLink(t.lat,t.lng)}<button class="btn sm sec" onclick="show('doc','${h(o.id)}','challan')">📄 Challan</button></div></div>
   <div class="card"><h3>Delivered quantity</h3><div class="hint">Change the number if less was delivered. Anything not delivered is cancelled and not billed.</div>
     <div style="margin:4px 0 6px"><button class="btn sm sec" onclick="dlAll(1)">Deliver all</button><button class="btn sm sec" onclick="dlAll(0)">Nothing delivered</button></div>
     ${r.lines.map(l=>`<div class="dl"><div class="grow"><b>${h(l.name)}</b><div class="hint">${h(l.sku)} · ordered ${l.qty} · ${money(l.price)}/pc</div></div>
       <div class="qty"><button onclick="dlStep('${h(l.lineId)}',-1)">−</button><input id="dq_${h(l.lineId)}" type="number" inputmode="numeric" min="0" max="${l.qty}" value="${l.qty}" oninput="dlSet('${h(l.lineId)}',this.value)"><button onclick="dlStep('${h(l.lineId)}',1)">+</button></div></div>`).join('')}
     <div class="sum" id="dl_sum"></div>
     <div id="dl_short" style="display:none"><label>Why less? <span class="req">*</span></label><select id="dl_reason">${opts(reasons,'','Select reason')}</select><input id="dl_rnote" placeholder="Details (optional)" style="margin-top:8px"></div></div>
   ${canCollect?`<div class="card" id="dl_pay"><h3>Payment at delivery</h3><label class="opt ${cod?'on':''}"><input type="checkbox" id="dl_paid" ${cod?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked);dlCalc()"><span>Payment received now</span></label>
      <div id="dl_payf"><label>Amount (৳)</label><input id="dl_amt" type="number" inputmode="decimal" oninput="this.dataset.auto='0'">
      <label>Method</label><select id="dl_m" onchange="$('dl_refw').style.display=this.value==='Cash'?'none':'block'">${opts(S.boot.lists.methods,'Cash')}</select>
      <div id="dl_refw" style="display:none"><label>Transaction reference</label><input id="dl_ref"></div>
      <div class="hint">Counts as collected after Accounts verifies it.</div></div></div>`:''}
   <div class="card"><label>Received by (name)</label><input id="dl_rcv" placeholder="Who took the goods">
     ${photoBox('dl','Delivery photo (optional)')}
     ${gpsBox('dl')}
     <label>Remarks</label><textarea id="dl_rem"></textarea>
     <button class="btn ok" onclick="doDeliver()">Confirm delivery</button></div>`;
  captureGps('dl'); dlCalc();
};
function dlLine(l){ const q=S.dl.q[l.lineId]; return q===l.qty ? l.net : Math.round(l.net*q/l.qty*100)/100; }
function dlCalc(){
  const L=S.dl.doc.lines, B=S.dl.doc.balance; let u=0,U=0,b=0,n=0;
  L.forEach(l=>{ u+=S.dl.q[l.lineId]; U+=l.qty; b+=dlLine(l); n+=l.net; });
  b=Math.round(b); S.dl.billed=b;
  const short=u<U;
  $('dl_short').style.display=short?'block':'none';
  $('dl_sum').innerHTML=`<div class="row"><span>Delivered</span><b>${u} of ${U} pcs</b></div><div class="row"><span>Bill amount</span><b class="amt">${money(b)}</b></div>${short?`<div class="row" style="color:var(--bad)"><span>Not delivered — cancelled</span><b>${money(n-b)}</b></div>`:''}`;
  const pf=$('dl_payf'), pc=$('dl_paid'), a=$('dl_amt');
  if(pf&&pc){ pf.style.display=pc.checked&&b>0?'block':'none'; if(a && a.dataset.auto!=='0') a.value = b>0 ? Math.max(0, Math.round((b - B.adjustments - B.paid - B.pending)*100)/100) : ''; }
}
function dlClamp(id,v){ const l=S.dl.doc.lines.find(x=>x.lineId===id); v=parseInt(v,10); if(isNaN(v)||v<0) v=0; if(v>l.qty) v=l.qty; return v; }
function dlSet(id,v){ const c=dlClamp(id,v); S.dl.q[id]=c; if(String(c)!==String(v) && v!=='') $('dq_'+id).value=c; dlCalc(); }
function dlStep(id,d){ const c=dlClamp(id,S.dl.q[id]+d); S.dl.q[id]=c; $('dq_'+id).value=c; dlCalc(); }
function dlAll(full){ S.dl.doc.lines.forEach(l=>{ S.dl.q[l.lineId]=full?l.qty:0; $('dq_'+l.lineId).value=S.dl.q[l.lineId]; }); dlCalc(); }
async function doDeliver(){
  const d=S.dl, L=d.doc.lines, o=d.doc.order;
  const lines=L.map(l=>({lineId:l.lineId, qty:d.q[l.lineId]}));
  const u=lines.reduce((a,x)=>a+x.qty,0), U=L.reduce((a,l)=>a+l.qty,0);
  if(u<U && !val('dl_reason')) return toast('Select why less was delivered');
  const g=needGps('dl'); if(!g) return;
  const p=Object.assign({orderId:o.id, lines, reason:val('dl_reason'), reasonNote:val('dl_rnote'), receivedBy:val('dl_rcv'), remarks:val('dl_rem'), photo:S.photos.dl||'', submissionId:uid()}, g);
  const pc=$('dl_paid');
  if(pc&&pc.checked&&d.billed>0){ const a=parseFloat(val('dl_amt'))||0; if(a>0){ if(val('dl_m')!=='Cash'&&!val('dl_ref')) return toast('Enter the transaction reference'); p.collect={amount:a, method:val('dl_m'), txnRef:val('dl_ref')}; } }
  if(!confirm(`Confirm delivery to ${d.doc.tailor.shop}\n${u} of ${U} pcs · bill ${money(d.billed)}${p.collect?'\nPayment received: '+money(p.collect.amount)+' ('+p.collect.method+')':''}${u<U?'\nItems not delivered will be cancelled.':''}`)) return;
  const q=await saveQueued('apiDeliver', p, 'Delivery · '+o.id+' · '+d.doc.tailor.shop, 'Saving delivery…'); if(!q) return;
  S.docs=S.docs||{}; delete S.docs[o.id];
  if(S.dv&&S.dv.data){ S.dv.data.open=S.dv.data.open.filter(x=>x.id!==o.id); }
  const docBtns=r=>r.ok?`${r.billed>0?`<button class="btn" onclick="show('doc','${h(o.id)}','invoice')">🧾 Final invoice — print / share</button>`:''}<button class="btn sec" onclick="show('doc','${h(o.id)}','challan')">📄 Challan</button>`:'';
  if(q.sync){ const r=q.sync; if(r.doc) S.docs[o.id]=Object.assign({_t:Date.now()}, r.doc);
    page('Delivered', o.id, `<div class="okbox">✅ ${h(r.message)}</div>${r.geoFlag&&r.geoFlag.indexOf('Outside')>=0?`<div class="warnbox">📍 ${h(r.geoFlag)}</div>`:''}${docBtns(r)}<button class="btn sec" onclick="show('deliveries','open')">Back to deliveries</button>`);
    return refreshBoot(false); }
  page('Delivered', o.id, `<div class="okbox">✅ Delivery saved: ${u} of ${U} pcs · bill ${money(d.billed)}${p.collect?' · payment '+money(p.collect.amount)+' ('+h(p.collect.method)+')':''}.</div>
    ${waitBox(q.it, r=>resultBox(r)+docBtns(r))}<button class="btn sec" onclick="show('deliveries','open')">Back to deliveries</button>`);
}

// ---------------------------------------------------------------- documents: invoice, challan, statement
const FMTS=[['a4','A4'],['a5','A5'],['80','80 mm']];
const DOC_TITLES={invoice:'Invoice', challan:'Delivery challan', ledger:'Account statement'};
screens.doc = async function(id, kind){
  S.doc={id, kind:kind||'invoice', fmt:load('hbd_fmt')||'a4', pdf:null};
  page(DOC_TITLES[S.doc.kind], id, `<div id="docBox" class="hint">Loading…</div>`);
  const r = S.doc.kind==='ledger' ? await api('apiTailorLedger', id) : await getDoc(id);
  if(!r.ok) return $('docBox').innerHTML=`<div class="badbox">${h(r.message)}</div>`;
  S.doc.data=r; renderDoc();
};
function renderDoc(){
  const d=S.doc, r=d.data, box=$('docBox'); if(!box) return;
  const body = d.kind==='challan' ? challanHtml(r) : d.kind==='ledger' ? ledgerHtml(r) : invoiceHtml(r);
  box.innerHTML = `<div class="card"><div class="tabs">${FMTS.map(f=>`<button class="${d.fmt===f[0]?'on':''}" onclick="docFmt('${f[0]}')">${f[1]}</button>`).join('')}${d.kind!=='ledger'?`<button onclick="docKind('${d.kind==='challan'?'invoice':'challan'}')">${d.kind==='challan'?'🧾 Invoice':'📄 Challan'}</button>`:''}</div>
     <div><button class="btn sm" onclick="printDoc()">🖨 Print</button><button class="btn sm gold" id="pdfBtn" onclick="sharePdf()">📤 Share PDF</button></div>
     <div class="hint">80 mm = thermal receipt printer. On a phone, Print ▸ "Save as PDF" also works.</div></div>
     <div class="docwrap" id="docwrap"><div id="doc" class="doc f-${d.fmt}">${body}</div></div>`;
  fitDoc();
}
function fitDoc(){ const w=$('docwrap'), el=$('doc'); if(!w||!el) return; el.style.zoom=''; const z=Math.min(1,(w.clientWidth-20)/el.offsetWidth); el.style.zoom = z<1 ? String(Math.floor(z*100)/100) : ''; }
window.addEventListener('resize', ()=>{ if(S.screen==='doc') fitDoc(); });
function docFmt(f){ S.doc.fmt=f; S.doc.pdf=null; store('hbd_fmt',f); renderDoc(); }
function docKind(k){ S.doc.kind=k; S.doc.pdf=null; const b=document.querySelector('header.top .brand'); if(b&&b.firstChild) b.firstChild.textContent=DOC_TITLES[k]; renderDoc(); }
function docHeightMm(){ const el=$('doc'), z=el.style.zoom; el.style.zoom=''; const mm=Math.ceil(el.offsetHeight/3.78)+6; el.style.zoom=z; return mm; }
function printDoc(){
  let st=$('pgsz'); if(!st){ st=document.createElement('style'); st.id='pgsz'; document.head.appendChild(st); }
  const f=S.doc.fmt; st.textContent = f==='80' ? `@page{size:80mm ${docHeightMm()}mm;margin:2mm}` : (f==='a5' ? '@page{size:A5;margin:8mm}' : '@page{size:A4;margin:10mm}');
  window.print();
}
function docFileName(){ const d=S.doc, r=d.data; const base = d.kind==='ledger' ? 'Statement-'+r.tailor.id : (d.kind==='challan' ? 'Challan-'+r.order.id : (r.final ? r.order.invoiceNo : 'Draft-invoice-'+r.order.id)); return base+'-'+(d.fmt==='80'?'80mm':d.fmt.toUpperCase())+'.pdf'; }
async function sharePdf(){
  const d=S.doc, btn=$('pdfBtn'), name=docFileName();
  try{
    if(!d.pdf){
      btn.disabled=true; btn.textContent='⏳ Preparing PDF…';
      if(!window.html2pdf) await loadScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
      const el=$('doc'), f=d.fmt, z=el.style.zoom; el.style.zoom='';
      const format = f==='80' ? [80, docHeightMm()] : f;
      try{
        const blob = await window.html2pdf().set({ margin: f==='80'?2:(f==='a5'?6:8), filename:name, image:{type:'jpeg',quality:0.96}, html2canvas:{scale:2, backgroundColor:'#ffffff'}, jsPDF:{unit:'mm', format:format, orientation:'portrait'}, pagebreak:{mode:['css','legacy']} }).from(el).outputPdf('blob');
        d.pdf = new File([blob], name, {type:'application/pdf'});
      } finally { el.style.zoom=z; btn.disabled=false; }
    }
    const file=d.pdf;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:name}); btn.textContent='📤 Share PDF'; }
      catch(e){ btn.textContent = e&&e.name==='AbortError' ? '📤 Share PDF' : '📤 Tap again to share'; }
      return;
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    btn.textContent='⬇️ PDF downloaded'; toast('PDF saved: '+name);
  }catch(e){ btn.disabled=false; btn.textContent='📤 Share PDF'; toast('Could not create the PDF ('+((e&&e.message)||e)+'). Use Print ▸ Save as PDF instead.', 7000); }
}
function kv(k,v){ return v ? `<div><span>${h(k)}</span> ${v}</div>` : ''; }
function docHead(c, title, meta){ return `<div class="dh"><div><div class="dn">${h(c.name)}</div><div class="ds">${h(c.address)}${c.phone?'<br>☎ '+h(c.phone):''}</div></div><div class="dt"><div class="dtt">${title}</div>${meta}</div></div>`; }
function partyHtml(label, t, withId){ return `<div><div class="dl2">${label}</div><b>${h(t.shop)}</b><br>${h(t.owner)}${t.mobile?' · '+h(t.mobile):''}<br>${t.address?h(t.address)+'<br>':''}${h(t.area)}${t.district?', '+h(t.district):''}${withId?`<div class="dmut">Customer ID ${h(t.id)}</div>`:''}</div>`; }
function invoiceHtml(r){
  const o=r.order, t=r.tailor, fin=r.final;
  const rows = r.lines.map(l=>{ const q = fin ? l.delivered : l.qty; return {l, q, amt:Math.round(q*l.price*100)/100}; });
  const shown = fin ? rows.filter(x=>x.q>0) : rows;
  const sub = Math.round(shown.reduce((a,x)=>a+x.amt,0)*100)/100;
  const total = fin ? o.billed : o.net, disc = Math.round((sub-total)*100)/100;
  const short = fin ? r.lines.filter(l=>l.delivered<l.qty) : [];
  const B=r.balance, bal=Math.max(0, Math.round((B.due-B.pending)*100)/100);
  const meta = (fin ? kv('Invoice No','<b>'+h(o.invoiceNo)+'</b>')+kv('Invoice date',h(o.invoiceDate))+kv('Order',h(o.id)+' · '+h(o.date))
                    : kv('Draft for order','<b>'+h(o.id)+'</b>')+kv('Order date',h(o.date)));
  return `${fin?'':'<div class="draft">DRAFT — the final invoice is issued on delivery</div>'}
   ${docHead(r.company, fin?'INVOICE':'DRAFT INVOICE', meta)}
   <div class="dp">${partyHtml('Bill to', t, true)}<div>${kv('Payment terms',h(o.terms))}${kv('Due date','<b>'+h(o.due)+'</b>')}${kv('Sales rep',h(o.rep))}${fin?kv('Delivered',h(o.deliveredAt)):''}${fin&&o.deliveryName?kv('Delivered by',h(o.deliveryName)):''}${fin&&o.receivedBy?kv('Received by',h(o.receivedBy)):''}</div></div>
   <table class="dtab"><thead><tr><th>#</th><th>Product</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>
   ${shown.map((x,i)=>`<tr><td>${i+1}</td><td>${h(x.l.name)}<div class="dmut">${h(x.l.sku)}${x.l.variant?' · '+h(x.l.variant):''}${fin&&x.q<x.l.qty?' · ordered '+x.l.qty:''}</div></td><td class="r">${x.q}</td><td class="r">${money2(x.l.price)}</td><td class="r">${money2(x.amt)}</td></tr>`).join('')}
   <tr class="dsum"><td></td><td>Total quantity</td><td class="r">${shown.reduce((a,x)=>a+x.q,0)}</td><td></td><td></td></tr></tbody></table>
   <div class="dtot">${kv('Subtotal',money2(sub))}${disc>0.004?kv('Discount','− '+money2(disc)):''}<div class="dgt"><span>Total</span> ${money2(total)}</div>
     ${fin?kv('Paid (verified)',money2(B.paid))+(B.pending>0?kv('Paid, awaiting verification',money2(B.pending)):'')+(B.adjustments>0?kv('Returns / adjustments','− '+money2(B.adjustments)):'')+`<div class="dgt"><span>Balance due</span> ${money2(bal)}</div>`:''}</div>
   ${short.length?`<div class="dnote"><b>Not delivered (cancelled, not billed):</b> ${short.map(l=>h(l.name)+' × '+(l.qty-l.delivered)).join(', ')}${o.shortReason?' — '+h(o.shortReason):''}</div>`:''}
   ${r.company.note?`<div class="dnote">${h(r.company.note)}</div>`:''}
   <div class="dsig"><div>Customer signature</div><div>For ${h(r.company.name)}</div></div>`;
}
function challanHtml(r){
  const o=r.order, t=r.tailor, fin=o.closed;
  const meta = kv('Challan No','<b>CH-'+h(o.id.replace(/^ORD-/,''))+'</b>')+kv('Date',h(fin?o.deliveredAt.split(',')[0]:fmtD(today())))+kv('Order',h(o.id))+(o.invoiceNo?kv('Invoice',h(o.invoiceNo)):'');
  return `${docHead(r.company,'DELIVERY CHALLAN',meta)}
   <div class="dp">${partyHtml('Deliver to', t, false)}<div>${kv('Delivery person',h(o.deliveryName||'—'))}${kv('Sales rep',h(o.rep))}${kv('Payment terms',h(o.terms))}</div></div>
   <table class="dtab"><thead><tr><th>#</th><th>Product</th><th class="r">Ordered</th><th class="r">Delivered</th></tr></thead><tbody>
   ${r.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${h(l.name)}<div class="dmut">${h(l.sku)}${l.variant?' · '+h(l.variant):''}</div></td><td class="r">${l.qty}</td><td class="r">${l.delivered===null?'<span class="dbox"></span>':l.delivered}</td></tr>`).join('')}
   <tr class="dsum"><td></td><td>Total pcs</td><td class="r">${o.totalQty}</td><td class="r">${o.billedQty===null?'':o.billedQty}</td></tr></tbody></table>
   ${fin&&o.shortReason?`<div class="dnote">Short / not delivered: ${h(o.shortReason)}</div>`:''}
   <div class="dnote">Goods received in good condition and in the quantity shown above.</div>
   <div class="dsig"><div>Delivered by</div><div>Received by (name &amp; signature)${o.receivedBy?'<br><b>'+h(o.receivedBy)+'</b>':''}</div></div>`;
}
function ledgerHtml(r){
  const t=r.tailor;
  return `${docHead(r.company,'ACCOUNT STATEMENT', kv('As of',h(r.asOf))+kv('Customer ID',h(t.id)))}
   <div class="dp">${partyHtml('Customer', t, false)}<div>${kv('Total billed',money2(r.debit))}${kv('Total received',money2(r.credit))}<div class="dgt"><span>${r.balance<0?'Advance / credit':'Balance due'}</span> ${money2(Math.abs(r.balance))}</div></div></div>
   <table class="dtab"><thead><tr><th>Date</th><th>Details</th><th class="r">Debit</th><th class="r">Credit</th><th class="r">Balance</th></tr></thead><tbody>
   ${r.rows.length?r.rows.map(x=>`<tr><td>${h(x.date)}</td><td>${h(x.desc)}<div class="dmut">${h(x.ref)}</div></td><td class="r">${x.debit?money2(x.debit):''}</td><td class="r">${x.credit?money2(x.credit):''}</td><td class="r">${money2(x.balance)}</td></tr>`).join(''):'<tr><td colspan="5">No transactions yet.</td></tr>'}
   </tbody></table>
   ${r.pending.length?`<div class="dnote"><b>Payments awaiting verification (${money2(r.pendingTotal)}):</b> ${r.pending.map(p=>h(p.date)+' '+h(p.ref)+' '+money2(p.amount)).join(' · ')}</div>`:''}
   <div class="dnote">Debit = goods billed. Credit = payments verified by Accounts, returns and adjustments. Orders not yet delivered are shown at the ordered value.</div>`;
}

// ---------------------------------------------------------------- profile
screens.profile = function(){
  const u=S.user;
  page('Profile', u.empId, `<div class="card"><b>${h(u.name)}</b><div class="muted">${h(u.role)} · ${h(u.territory||u.district||'')}</div></div>
    <div class="card"><h3>Change PIN</h3><label>Current PIN</label><input id="pp_o" type="password" inputmode="numeric"><label>New PIN (4–8 digits)</label><input id="pp_n" type="password" inputmode="numeric"><label>Confirm new PIN</label><input id="pp_c" type="password" inputmode="numeric">
    <button class="btn" onclick="changePin()">Change PIN</button></div><button class="btn bad" onclick="logout()">Log out</button>`);
};
async function changePin(){
  if(val('pp_n')!==val('pp_c')) return toast('New PINs do not match');
  busy(true); const r=await call('apiChangePin', S.token, val('pp_o'), val('pp_n')); busy(false);
  toast(r.ok?'✅ '+r.message:'⛔ '+r.message);
}

// ---------------------------------------------------------------- start
(async function(){
  const tok=load('hbd_tok');
  if(!tok) return screens.login();
  S.token=tok;
  const c=cachedBoot(); if(c){ S.boot=c; S.user=c.user; S.screen='home'; screens.home(); refreshInBackground(); return; }
  if(await refreshBoot(true)) screens.home(); else if(S.token) screens.login();
})();
</script>
