      ${r.expenses.count?`<div class="tapr" style="margin-top:10px;padding:6px" onclick="${dk('expenses',Object.assign({},rng,{rep:e.id,repName:e.name}),'Expenses · '+e.name)}">Expenses in period: <b>${money(r.expenses.amount)}</b> (${r.expenses.count}) <span class="chev">›</span></div>`:''}</div>`:''}

// ---------------------------------------------------------------- HR panel
const HR_TABS=[['overview','Overview'],['attendance','Attendance'],['leave','Leave'],['payroll','Payroll'],['performance','Performance']];
function monthShift(m, d){ let y=+m.slice(0,4), mm=+m.slice(5,7)+d; while(mm<1){mm+=12;y--;} while(mm>12){mm-=12;y++;} return y+'-'+String(mm).padStart(2,'0'); }
screens.hr = function(month, tab){
  S.hr=S.hr||{}; S.hr.month=month||S.hr.month||today().slice(0,7); S.hr.tab=tab||S.hr.tab||'overview'; navArgs(S.hr.month, S.hr.tab);
  const cur=today().slice(0,7);
  page('HR panel', 'Attendance · leave · payroll · performance', `<div class="card"><div class="row"><button class="btn sm sec" style="width:auto;margin:0" onclick="screens.hr(monthShift(S.hr.month,-1))">‹</button>
    <div class="grow" style="text-align:center"><b id="hr_m">${h(S.hr.month)}</b></div><button class="btn sm sec" style="width:auto;margin:0" ${S.hr.month>=cur?'disabled':''} onclick="screens.hr(monthShift(S.hr.month,1))">›</button></div></div>
    <div class="tabs">${HR_TABS.map(t=>`<button class="${S.hr.tab===t[0]?'on':''}" onclick="hrTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
    <div id="hr_st" class="dcst"></div><div id="hr_out"><div class="card"><div class="muted" style="text-align:center;padding:24px">Loading… (first time can take ~20 s)</div></div></div>`);
  loadHr();
};
function hrTab(t){ S.hr.tab=t; navArgs(S.hr.month, t); document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on', HR_TABS[i]&&HR_TABS[i][0]===t)); renderHr(); }
async function loadHr(fresh){
  const key='hr|'+S.hr.month, seq=S.hr.seq=(S.hr.seq||0)+1;
  if(!fresh && S.hr.data && S.hr.data.month===S.hr.month && Date.now()-S.hr.t<60000) return renderHr();
  const c=fresh?null:dcGet(key);
  if(c){ S.hr.data=c.data; S.hr.t=0; if($('hr_m')) $('hr_m').textContent=c.data.monthLabel; renderHr(); dcStatus('hr_st','loading',c.t); }
  else if(fresh) dcStatus('hr_st','loading',Date.now());
  const r=await api('apiHrDashboard', S.hr.month);
  if(!$('hr_out') || S.screen!=='hr' || seq!==S.hr.seq){ if(r.ok) dcPut(key, r); return; }
  if(!r.ok){ if(c||fresh) return dcStatus('hr_st','fail',c?c.t:Date.now()); $('hr_out').innerHTML=`<div class="badbox">${h(r.message)}</div>`; return; }
  dcPut(key, r); S.hr.data=r; S.hr.t=Date.now(); if($('hr_m')) $('hr_m').textContent=r.monthLabel; renderHr(); dcStatus('hr_st', (c||fresh)?'ok':'');
}
function stChip(st){ const c={'Present':'c-ok','Late':'c-warn','Missing Check-out':'c-warn','Absent':'c-bad','On Leave':'c-info','Off-day Work':'c-info','Checked in':'c-ok','Not checked in':''}[st]; return `<span class="chip ${c===undefined?'':c}">${h(st)}</span>`; }

  box.innerHTML=`<div class="card"><h3>Daily attendance</h3><div class="atabs" id="att_mode"><button data-m="day" onclick="attMode('day')">One day</button><button data-m="range" onclick="attMode('range')">Date range</button></div><div id="att_ctl"></div></div><div id="att_out"></div>`;

function attMode(m){

function attPreset(p){ const r=rangeFor(p); S.att.from=r[0]; S.att.to=r[1]; if($('att_from')){ $('att_from').value=r[0]; $('att_to').value=r[1]; } attLoadRange(); }
function attMonthShift(d){ S.att.month=monthShift(S.att.month,d); attDrawCal(); attLoadCal(S.att.month); }
async function attLoadCal(m){
  const r=await api('apiAttendanceCalendar', m);
  if(!r.ok){ if($('att_cal')&&S.att.month===m&&!S.att.cal[m]) $('att_cal').innerHTML=`<div class="badbox">${h(r.message)}</div>`; return; }
  S.att.cal[m]=r; if(S.att.month===m && S.att.mode==='day') attDrawCal();
}
function attDrawCal(){
  const box=$('att_cal'); if(!box) return;
  const m=S.att.month, c=S.att.cal[m];
  const head=`<div class="acalh"><button class="btn sm sec" style="width:auto;margin:0" onclick="attMonthShift(-1)" aria-label="Previous month">‹</button><b>${h(c?c.monthLabel:m)}</b><button class="btn sm sec" style="width:auto;margin:0" onclick="attMonthShift(1)" aria-label="Next month">›</button></div>`;
  if(!c){ box.innerHTML=head+'<div class="muted" style="text-align:center;padding:16px">Loading calendar…</div>'; return; }
  const dw=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dw">${d}</div>`).join('');
  const blank='<div></div>'.repeat(c.firstDow-1);
  const cells=c.days.map(d=>{
    const work=d.dayType==='Working', ot=d.present-d.late, seg=[[ot,'ontime'],[d.late,'late'],[d.absent,'absent'],[d.leave,'leave'],[d.notIn,'pending']].filter(s=>s[0]>0);
    const tip=d.day+(d.holiday?' · '+d.holiday:work?'':' · '+d.dayType)+(d.future?'':` · present ${d.present}, late ${d.late}, absent ${d.absent}, leave ${d.leave}`);
    const mark=d.future?(work?'':`<i>${d.dayType==='Holiday'?'Holiday':'Off'}</i>`):!work&&!d.present?`<i>${d.dayType==='Holiday'?'Holiday':'Off'}</i>`:seg.length?`<div class="abar">${seg.map(s=>`<s style="flex:${s[0]};background:${ATT_COL[s[1]]}"></s>`).join('')}</div><i>${d.present}/${d.people}</i>`:'';
    return `<div class="acd${work?'':' off'}${d.future?' fut':''}${d.isToday?' tdy':''}${d.day===S.att.date?' sel':''}" data-d="${d.day}" title="${h(tip)}" onclick="attPick('${d.day}')"><b>${d.n}</b>${mark}</div>`;
  }).join('');
  box.innerHTML=head+`<div class="acal">${dw}${blank}${cells}</div><div class="aleg"><span><s style="background:${ATT_COL.ontime}"></s>On time</span><span><s style="background:${ATT_COL.late}"></s>Late</span><span><s style="background:${ATT_COL.absent}"></s>Absent</span><span><s style="background:${ATT_COL.leave}"></s>On leave</span><span>n/N = present / people</span></div>`;
}
function attPick(d){
  S.att.date=d; S.att.filter='';
  if($('att_date')) $('att_date').value=d;
  const t=today(); if($('att_q_t')) $('att_q_t').classList.toggle('on', d===t); if($('att_q_y')) $('att_q_y').classList.toggle('on', d===addDays(t,-1));
  if(d.slice(0,7)!==S.att.month){ S.att.month=d.slice(0,7); attDrawCal(); attLoadCal(S.att.month); }
  else document.querySelectorAll('#att_cal .acd').forEach(x=>x.classList.toggle('sel', x.dataset.d===d));
  attLoadDay(d);
}
async function attLoadDay(d){
  const seq=S.att.seq=(S.att.seq||0)+1, out=$('att_out'); if(!out) return;
  if(S.att.day[d]) attDrawDay(); else out.innerHTML='<div class="card"><div class="muted" style="text-align:center;padding:20px">Loading attendance…</div></div>';
  const r=await api('apiAttendanceDay', d);
  if(!$('att_out') || S.screen!=='hr' || seq!==S.att.seq || S.att.mode!=='day') return;
  if(!r.ok){ if(!S.att.day[d]) $('att_out').innerHTML=`<div class="card"><div class="badbox">${h(r.message)}</div></div>`; return; }
  S.att.day[d]=r; if(S.att.date===d) attDrawDay();

function attFilter(k){ S.att.filter=S.att.filter===k?'':k; attDrawDay(); const l=$('att_list'); if(l&&S.att.filter) l.scrollIntoView({block:'nearest'}); }
function attMap(lat,lng){ return (lat===null||lat===undefined||lat==='')?'':'https:\/\/www.google.com/maps?q='+encodeURIComponent(lat+','+lng); }
function attDrawDay(){
  const out=$('att_out'), r=S.att.day[S.att.date]; if(!out||!r) return;
  const T=r.totals, f=S.att.filter, mon=r.date.slice(0,7);
  const tile=(k,label,n,sub,color)=>`<div class="kpi tap${f===k?' aon':''}" data-f="${k}" role="button" onclick="attFilter('${k}')"><b style="color:${color}">${n}</b><span>${label}</span>${sub?`<div class="muted" style="font-size:11px">${sub}</div>`:''}</div>`;
  let info='';
  if(r.dayType==='Holiday') info=`<div class="ainfo">🎉 Holiday${r.holiday?': '+h(r.holiday):''} — nobody is marked absent.</div>`;
  else if(r.dayType==='Weekly off') info='<div class="ainfo">Weekly off-day — nobody is marked absent. Anyone who worked shows as Off-day Work.</div>';
  if(r.isFuture) info+='<div class="ainfo">This day has not come yet. Approved leave is shown in the notes.</div>';
  else if(r.beforeCutoff) info+=`<div class="ainfo">Before ${String(r.cutoffHour).padStart(2,'0')}:00 — people who have not checked in show as “Not checked in yet”, not absent.</div>`;
  const tiles=tile('present','Present',T.present,T.onTime+' on time',ATT_COL.ontime)+tile('late','Late',T.late,'',ATT_COL.late)+tile('absent','Absent',T.absent,'',ATT_COL.absent)+tile('leave','On leave',T.leave,'',ATT_COL.leave)+tile('notin','Not checked in',T.notIn,'','var(--mut)')+(T.missing?tile('missing','No check-out',T.missing,'','var(--warn)'):'')+(T.offDayWork?tile('offwork','Off-day work',T.offDayWork,'','var(--info)'):'');
  const rows=f&&ATT_F[f]?r.rows.filter(ATT_F[f][1]):r.rows;
  const line=x=>{
    const bits=[h(x.role)]; if(x.checkIn) bits.push('in '+h(x.checkIn)); if(x.checkOut) bits.push('out '+h(x.checkOut)); if(x.hours) bits.push(x.hours+' h'); if(x.late) bits.push(`<b style="color:var(--warn)">${x.lateMin} min late</b>`);
    const map=attMap(x.inLat,x.inLng);
    return `<div class="it" data-emp="${h(x.empId)}" onclick="show('emp','${h(x.empId)}','${mon}')"><div class="grow"><b>${h(x.name)}</b><div class="muted">${bits.join(' · ')}</div>${map?`<a class="lnk" style="font-size:12.5px" href="${map}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 Check-in location</a>`:''}${x.summary?`<div class="muted">📝 ${h(x.summary)}</div>`:''}${x.note?`<div class="muted" style="font-size:12px">${h(x.note)}</div>`:''}</div>${attChip(x.status)}</div>`;
  };
  out.innerHTML=`<div class="card"><div class="row"><div class="grow"><h3 style="margin:0">${h(r.label)}</h3><div class="muted">${h(r.dayType)}${r.isToday?' · today':''} · ${T.people} people</div></div></div>${info}
    <div class="grid3" style="margin-top:10px">${tiles}</div>
    ${T.present?`<div class="muted" style="margin-top:8px">Day summary: ${T.present} present of ${T.people}${T.late?', '+T.late+' late':''}${T.absent?', '+T.absent+' absent':''}${T.leave?', '+T.leave+' on leave':''} · ${T.hours} working hours in total (average ${T.avgHours} h)</div>`:''}</div>
    <div class="card" id="att_list"><div class="row"><h3 class="grow" style="margin:0">${f&&ATT_F[f]?h(ATT_F[f][0])+' ('+rows.length+')':'Everyone ('+rows.length+')'}</h3>${f?'<button class="btn sm sec" style="width:auto;margin:0" onclick="attFilter(\'\')">Show all</button>':''}</div>
    <div class="list" style="margin-top:4px">${rows.map(line).join('')||'<div class="muted" style="padding:12px 0">Nobody in this group.</div>'}</div></div>`;
}
async function attLoadRange(){

    <div class="card" style="overflow-x:auto"><h3>Per person</h3><table class="t" id="att_rtab"><tr><th>Employee</th><th>Work days</th><th>Present</th><th>Late</th><th>Absent</th><th>Leave</th><th>No out</th><th>Hours</th><th>Att.</th></tr>
    ${r.rows.map(x=>`<tr onclick="show('emp','${h(x.empId)}','${mon}')" style="cursor:pointer"><td><b>${h(x.name)}</b><div class="muted">${h(x.role)}</div></td><td>${x.workingDays}</td><td>${x.present}${x.offDayWork?` <span class="muted">(${x.offDayWork} off-day)</span>`:''}</td><td style="color:${x.late?'var(--warn)':'inherit'}">${x.late}${x.lateMin?`<div class="muted">${x.lateMin} min</div>`:''}</td><td style="color:${x.absent?'var(--bad)':'inherit'}">${x.absent}</td><td>${x.leave}</td><td>${x.missing}</td><td>${x.hours||'—'}</td><td>${x.attPct===null?'—':pctS(x.attPct)}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">Nobody in scope.</td></tr>'}</table>
    <div class="muted" style="margin-top:6px">Att. = (present on working days + leave) ÷ working days. Tap a name for the employee page.</div></div>`;

function FUL(){ return !!(S.boot && typeof S.boot.unread==='number'); }

/** Cheap poll (every 30 s while the app is open): new notifications since the last one seen -> badge, toast, vibration. */
async function notifPoll(force){
  if(!S.token || !FUL() || S.nBusy) return;
  if(document.hidden && !force && !(window.Notification && Notification.permission==='granted')) return;
  S.nBusy=true; let r;
  try{ r=await call('apiNotifications', S.token, {sinceId:S.nLast||0}); } finally { S.nBusy=false; }
  if(!r || !r.ok || !S.boot) return;
  S.boot.unread=r.unread; updBell();
  const fresh=(r.list||[]).filter(x=>x.id>(S.nLast||0));
  if(r.latestId>(S.nLast||0)) S.nLast=r.latestId;
  if(!fresh.length) return;
  const n=fresh[0];
  toast('🔔 '+n.title+(fresh.length>1?' (+'+(fresh.length-1)+' more)':''), 6000);
  try{ if(navigator.vibrate) navigator.vibrate([180,80,180]); }catch(e){}
  try{ if(window.Notification && Notification.permission==='granted' && document.hidden){ const bn=new Notification(n.title,{body:n.body, tag:n.refNo||String(n.id)}); bn.onclick=()=>{ window.focus(); openNotif(n.id, n.refNo); }; } }catch(e){}
  if(S.screen==='packq' || S.screen==='pickq') screens[S.screen]();
  else if(S.screen==='notifs') screens.notifs();
  else if(S.screen==='home' || !S.screen) refreshInBackground();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) notifPoll(); });

    <div class="grid4">${stg('packing')}${stg('ready')}${stg('dispatched')}${stg('delivered')}</div>

      ${kp('On hold now', `<span style="color:${hd.count?'var(--bad)':'inherit'}">${hd.count}</span>`, money(hd.value), '', dk('orders',NOW,'On hold now'))}
      ${kp('Waiting for manager', hd.waiting.count||0, money(hd.waiting.value||0), '', dk('orders',Object.assign({holdDecision:'waiting'},NOW),'On hold · waiting for manager'))}
      ${kp('Manager allowed', hd.allowed.count||0, money(hd.allowed.value||0)+' · to confirm', '', dk('orders',Object.assign({holdDecision:'allowed'},NOW),'On hold · allowed'))}
      ${kp('Average age', (hd.avgAgeH||0)+' h', 'oldest '+(hd.oldestH||0)+' h', '', dk('orders',NOW,'On hold now'))}
    </div>
    ${hd.count?`<div style="margin-top:8px">${hBars((hd.aging||[]).map(a=>({label:'Held '+a.label.toLowerCase(),value:a.count,sub:shortN(a.value),color:FN_COL.onHold,click:dk('orders',Object.assign({holdAge:a.key},NOW),'On hold · '+a.label)})),{})}</div>`:''}
    ${(hd.reasons||[]).length?`<div class="sect">Why orders are on hold</div>${hBars(hd.reasons.map(x=>({label:x.reason,value:x.count,sub:shortN(x.value),color:FN_COL.onHold,click:dk('orders',Object.assign({holdReason:x.reason},NOW),'On hold · '+x.reason)})),{})}`:''}
    <div class="sect">Cancelled in the period</div><div class="grid4" id="cancelKinds">
      ${(cn.kinds||[]).map(k=>kp(k.label, `<span style="color:${k.count?'var(--bad)':'inherit'}">${k.count}</span>`, money(k.value), '', dk('orders',R({fulfil:'cancelled',cancelKind:k.kind}),k.label))).join('')}
    </div>
    ${reasons.length?`<div style="margin-top:8px">${hBars(reasons,{})}</div>`:''}
    <div class="sect">Average time</div><div class="grid3" id="fnTimes">
      ${kp('New → confirmed', (tm.newToConfirmH||0)+' h', tm.newToConfirmN+' orders', '', dk('orders',R({fulfil:'booked',timing:'newToConfirm'}),'New → confirmed by store'))}
      ${kp('Confirmed → dispatched', (tm.confirmToDispatchH||0)+' h', tm.confirmToDispatchN+' orders', '', dk('orders',R({fulfil:'booked',timing:'confirmToDispatch'}),'Confirmed → dispatched'))}
      ${kp('Dispatched → delivered', (tm.dispatchToDeliverH||0)+' h', tm.dispatchToDeliverN+' orders', '', dk('orders',R({fulfil:'booked',timing:'dispatchToDeliver'}),'Dispatched → delivered'))}
    </div>
    <div class="sect">Store review in the period</div><div class="grid4">
      ${kp('Reviewed', rv.reviewed||0, (rv.confirmed||0)+' confirmed at once', '', dk('reviews',R(),'Store reviews'))}
      ${kp('Avg time to review', (rv.avgMin||0)+' min', 'from order to decision', '', dk('reviews',R(),'Store reviews'))}
      ${kp('Put on hold', rv.holds||0, (rv.allowed||0)+' allowed · '+(rv.rejected||0)+' rejected', '', dk('reviews',R({status:'On Hold'}),'Held at store review'))}
      ${kp('Cancelled at review', rv.cancels||0, '', '', dk('reviews',R({status:'Cancelled'}),'Cancelled at store review'))}
    </div>
    ${(rv.byKeeper||[]).length?`<div style="overflow-x:auto;margin-top:8px"><table class="t"><tr><th>Store keeper</th><th>Reviewed</th><th>Confirmed</th><th>Held</th><th>Cancelled</th><th>Avg min</th></tr>${rv.byKeeper.map(k=>`<tr class="tapr" onclick="${dk('reviews',R({by:k.empId,byName:k.name}),'Reviews · '+k.name)}"><td>${h(k.name)}</td><td>${k.reviewed}</td><td>${k.confirmed}</td><td>${k.holds}</td><td>${k.cancels}</td><td>${k.avgMin}</td></tr>`).join('')}</table></div>`:''}
  </div>`;
}
/* staff profile: held / cancelled orders of a rep, reviews of a store keeper */
function staffGateCard(r, e, rng){
  const g=r.storeReview; if(!g) return ''; const me={rep:e.id,repName:e.name}; let out='';
  if(r.isRep) out+=`<div class="card" id="spGate"><h3>Store review</h3><div class="grid4">
    ${kp('On hold now', `<span style="color:${g.hold.count?'var(--bad)':'inherit'}">${g.hold.count}</span>`, money(g.hold.value), '', dk('orders',Object.assign({fulfil:'onHold',now:'1'},me),'On hold · '+e.name))}
    ${kp('Cancelled by store', g.storeCancelled.count, money(g.storeCancelled.value), '', dk('orders',Object.assign({},rng,me,{fulfil:'cancelled',cancelKind:'store'}),'Cancelled by store · '+e.name))}
    ${kp('Rejected by manager', g.managerRejected.count, money(g.managerRejected.value), '', dk('orders',Object.assign({},rng,me,{fulfil:'cancelled',cancelKind:'manager'}),'Rejected by manager · '+e.name))}
    ${kp('Waiting for review', g.new.count, money(g.new.value), '', dk('orders',Object.assign({fulfil:'new',now:'1'},me),'New · '+e.name))}</div></div>`;
  if(g.reviews) out+=`<div class="card"><h3>Orders reviewed</h3><div class="grid4">
    ${kp('Reviewed', g.reviews.reviewed, g.reviews.confirmed+' confirmed', '', dk('reviews',Object.assign({},rng,{by:e.id,byName:e.name}),'Reviews · '+e.name))}
    ${kp('Held', g.reviews.holds)}${kp('Cancelled', g.reviews.cancels)}${kp('Avg time', g.reviews.avgMin+' min', 'order → decision')}</div></div>`;
  return out;
}
